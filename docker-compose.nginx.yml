# ============================================================================
# DRAFT PROPOSAL -- Phase 1 overlay of INFRA-SYNERGY-RESEARCH-2026-06-25 (slot:bravo)
# Adds a TLS-terminating Nginx ingress in front of the existing stack.
# NOT part of the default compose -- apply explicitly (reversible):
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d nginx
# Revert: stop/remove the nginx service, or simply omit this -f overlay.
# Prereq: TLS certs present at deploy/nginx/certs/{prism.crt,prism.key}.
# ============================================================================
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: prism-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      prism-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - prism-net   # defined in the base docker-compose.yml (overlay merge)
