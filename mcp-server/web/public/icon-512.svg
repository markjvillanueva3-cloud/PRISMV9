    <line x1="100" y1="256" x2="180" y2="256" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <line x1="320" y1="256" x2="420" y2="208" stroke="url(#ray1)" stroke-width="8" stroke-linecap="round"/>
    <line x1="320" y1="256" x2="420" y2="256" stroke="url(#ray2)" stroke-width="8" stroke-linecap="round"/>
    <line x1="320" y1="256" x2="420" y2="304" stroke="url(#ray3)" stroke-width="8" stroke-linecap="round"/>
