    <line x1="40" y1="96" x2="68" y2="96" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="120" y1="96" x2="156" y2="78" stroke="url(#ray1)" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="96" x2="156" y2="96" stroke="url(#ray2)" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="96" x2="156" y2="114" stroke="url(#ray3)" stroke-width="3" stroke-linecap="round"/>
