  <rect width="192" height="192" rx="32" fill="url(#bgCyan)"/>
  <rect x="3" y="3" width="186" height="186" rx="29" fill="none" stroke="rgba(6,182,212,0.45)" stroke-width="1.5"/>
  <g filter="url(#glow)">
