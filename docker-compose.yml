# PRISM MCP Server - Docker Compose Production Stack
# Includes: server, monitoring, log aggregation
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prism-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prism-dev-only}
    volumes:
      - ./data/docker-volumes/postgres:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prism-net

  prism-server:
    build:
      context: .
      dockerfile: Dockerfile
      # U-INFRA-DOCKER-FIX (delta, 2026-05-18): Dockerfile defines stages
      # `builder` and `runtime` only — never `production`. Was previously
      # `target: production` which failed with
      #   "target stage 'production' could not be found"
      # on every compose-up of prism-server (and every service in its
      # depends_on chain). Aligned to the real Dockerfile stage name.
      target: runtime
    container_name: prism-mcp-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PRISM_LOG_LEVEL=info
      - PRISM_DATA_DIR=/app/data
      - PRISM_STATE_DIR=/app/state
      - MAX_OLD_SPACE_SIZE=4096
      - DATABASE_URL=postgres://prism:${POSTGRES_PASSWORD:-prism-dev-only}@postgres:5432/prism
    volumes:
      - ./data/docker-volumes/prism-state:/app/state
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - prism-net

  # Monitoring: Prometheus metrics scrape
  prometheus:
    image: prom/prometheus:latest
    container_name: prism-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/docker-volumes/prometheus:/prometheus
    networks:
      - prism-net
    depends_on:
      prism-server:
        condition: service_healthy

  # Vector DB for semantic search, tool catalog embeddings, MIT course index
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: prism-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ./data/docker-volumes/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - prism-net

  # PRISM Hook Broker daemon (U-DOCKER-HOOK-BROKER-P3, 2026-05-22, slot hotel).
  # Holds the 78 module-safe `.claude/hooks/*.mjs` warm in memory + serves
  # them via HTTP. Reads HOOK-BROKER-COMPAT-REPORT.json (produced by
  # `scripts/classify-hooks-for-broker.mjs`) on startup; routes `POST
  # /hook/:name` → cached handler.
  #
  # Bind-mounts:
  #   .claude/hooks       — hook source (read-only)
  #   state/shared        — compat report + atomic-write outputs (read-only)
  #
  # The image bakes ONLY the broker entry point + classifier lib; hook
  # source is bind-mounted so edits land via `POST /reload` without
  # rebuilding. Production-safe defaults: non-root user, no networking
  # except localhost, 1 MB body cap, 10s handler timeout (all enforced
  # in `docker/hook-broker/server.mjs`).
  prism-hooks:
    build:
      context: .
      dockerfile: docker/hook-broker/Dockerfile
    container_name: prism-hook-broker
    restart: unless-stopped
    ports:
      - "127.0.0.1:9876:9876"
    volumes:
      - ./.claude/hooks:/repo/.claude/hooks:ro
      - ./state/shared:/repo/state/shared:ro
    environment:
      NODE_ENV: production
      PRISM_BROKER_PORT: "9876"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9876/healthz | grep -q '\"ready\":true' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - prism-net

  # Local LLM runtime (Ollama). GPU passthrough opt-in via override file.
  ollama:
    image: ollama/ollama:latest
    container_name: prism-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data/docker-volumes/ollama:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      # GPU-OFFLOAD-MAXIMIZE-MS0/U2 (2026-05-22, slot:sierra; retuned 2026-06-04
      # BLACKWELL-GPU-SWAP slot:golf) — perf knobs for the 96GB RTX PRO 6000
      # Blackwell Workstation Edition (massive VRAM headroom; was 16GB RTX 4080
      # SUPER). NOTE: native ollama (PRISM Ollama Serve task, v0.30.3) is the
      # ACTIVE runtime on DESKTOP-N7MI1VB; this containerized service is the
      # portable/CI fallback (Docker Desktop is normally down here). KEEP_ALIVE=-1
      # pins models warm forever. With 96GB, KV_CACHE_TYPE=f16 (full precision —
      # no q8_0 VRAM compromise needed), NUM_PARALLEL=4 serves the 26-slot fleet,
      # MAX_LOADED_MODELS=6 keeps the 7b workhorse + 32b heavy + embed co-resident.
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "f16"
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_LOADED_MODELS: "6"
      OLLAMA_CONTEXT_LENGTH: "16384"
    healthcheck:
      test: ["CMD-SHELL", "ollama --version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - prism-net

  # Alerting + Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: prism-grafana
    restart: unless-stopped
    ports:
      - "3601:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=prism-admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./data/docker-volumes/grafana:/var/lib/grafana
      - ./deploy/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana-datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - prism-net
    depends_on:
      - prometheus

# Named volumes removed — all data bind-mounted to ./data/docker-volumes/ for
# H: drive portability across machines. See data/docker-volumes/README.md.

networks:
  prism-net:
    driver: bridge
