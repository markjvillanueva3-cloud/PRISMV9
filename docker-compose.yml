version: "3.8"

services:
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - mcp-server
    environment:
      - API_URL=http://mcp-server:3000

  mcp-server:
    build: ./mcp-server
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./mcp-server/data:/app/data:ro
