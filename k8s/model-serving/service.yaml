# PRISM CAM Model Serving — Service + ServiceAccount
# CAM-EXHAUST-MS0/U-CAM122
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prism-cam-serving
  namespace: prism
---
apiVersion: v1
kind: Service
metadata:
  name: prism-cam-model-serving
  namespace: prism
  labels:
    app: prism-cam-model-serving
    component: cam-agi
spec:
  type: ClusterIP
  selector:
    app: prism-cam-model-serving
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
# Headless companion for direct pod addressing during canary analysis
apiVersion: v1
kind: Service
metadata:
  name: prism-cam-model-serving-headless
  namespace: prism
  labels:
    app: prism-cam-model-serving
    role: headless
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: prism-cam-model-serving
  ports:
    - name: http
      port: 80
      targetPort: http
