# PRISM CAM Model Serving — Horizontal Pod Autoscaler + PDB
# CAM-EXHAUST-MS0/U-CAM122
#
# HPA scales 3..12 replicas on CPU + p95 inference latency. Custom-metric
# adapter (e.g. prometheus-adapter) must export
# `cam_serve_p95_latency_ms{model_id=...}` for the latency arm to fire.
# minReplicas=3 preserves anti-affinity quorum; 99.9% SLA depends on it.
#
# PDB ensures at least 2 pods stay up across voluntary disruptions.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prism-cam-model-serving
  namespace: prism
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prism-cam-model-serving
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: cam_serve_p95_latency_ms
        target:
          type: AverageValue
          averageValue: "200"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prism-cam-model-serving
  namespace: prism
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: prism-cam-model-serving
