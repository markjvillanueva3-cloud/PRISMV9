# PRISM CAM Model Serving — production Deployment
# CAM-EXHAUST-MS0/U-CAM122
#
# This Deployment runs the CAM model-serving fabric backed by
# CAMModelServingEngine. Three replicas anti-affinity-spread across nodes
# meet the 99.9% uptime SLA (≤8h 45m downtime/year). Resource requests
# are sized for the steady-state load measured during canary rehearsal;
# limits include a 50% headroom for spike traffic.
#
# Liveness / readiness probes hit the engine's HTTP health endpoint which
# proxies CAMModelServingEngine.listAllHealth() — any model in
# rollback_pending status will surface to the operator dashboard via the
# pending-confirmations buffer (k8s itself stays green; rollback is a
# logical concern handled by the engine).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism-cam-model-serving
  namespace: prism
  labels:
    app: prism-cam-model-serving
    component: cam-agi
    milestone: cam-exhaust-ms0
    unit: u-cam122
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: prism-cam-model-serving
  template:
    metadata:
      labels:
        app: prism-cam-model-serving
        component: cam-agi
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [prism-cam-model-serving]
                topologyKey: kubernetes.io/hostname
      serviceAccountName: prism-cam-serving
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serving
          image: ghcr.io/prism/cam-model-serving:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PRISM_DISPATCHER_PREFIX
              value: cam_serve_
            - name: PRISM_LOG_LEVEL
              value: info
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          envFrom:
            - configMapRef:
                name: prism-cam-model-serving-registry
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz/startup
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: registry-seed
              mountPath: /etc/prism/cam-serving
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: registry-seed
          configMap:
            name: prism-cam-model-serving-registry
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: prism-cam-model-serving
