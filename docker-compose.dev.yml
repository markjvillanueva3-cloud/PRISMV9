# PRISM MCP Server — Local Development Stack
# INFRA-1-1 U-DB3: Lightweight Postgres + Redis for local dev
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   export DATABASE_URL=postgres://prism:prism-dev@localhost:5432/prism
#   npm run dev
#
# To run migrations after DB is up:
#   npx tsx src/db/migration-runner.ts
#
# In-memory fallback: If DATABASE_URL is not set, PRISM runs entirely
# in-memory — no Postgres needed. This is the default for development
# without Docker.

services:
  postgres:
    image: postgres:16-alpine
    container_name: prism-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prism-dev}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prism-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata-dev:
