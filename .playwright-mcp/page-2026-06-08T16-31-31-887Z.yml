- generic [ref=e2]: "{\"code\":200,\"message\":\"OK\",\"tweet\":{\"url\":\"https://x.com/0x_rody/status/2063928611619455268\",\"id\":\"2063928611619455268\",\"text\":\"\",\"raw_text\":{\"text\":\"https://t.co/ukQdyLx8MO\",\"display_text_range\":[0,23],\"facets\":[]},\"author\":{\"screen_name\":\"0x_rody\",\"url\":\"https://x.com/0x_rody\",\"id\":\"1386319613391253504\",\"followers\":1460,\"following\":54,\"likes\":506,\"media_count\":20,\"name\":\"rody\",\"description\":\"AI tools analyst | Code & consciousness | @zscdao\",\"raw_description\":{\"text\":\"AI tools analyst | Code & consciousness | @zscdao\",\"facets\":[]},\"location\":\"San Diego, CA\",\"banner_url\":\"https://pbs.twimg.com/profile_banners/1386319613391253504/1775673301\",\"avatar_url\":\"https://pbs.twimg.com/profile_images/2041947351120572416/4IBmZ3QT_200x200.jpg\",\"joined\":\"Sun Apr 25 14:02:14 +0000 2021\",\"protected\":false,\"website\":null,\"verification\":{\"verified\":true,\"verified_at\":null,\"type\":\"individual\"},\"avatar_color\":null},\"replies\":8,\"retweets\":13,\"likes\":81,\"bookmarks\":172,\"quotes\":2,\"created_at\":\"Mon Jun 08 10:18:21 +0000 2026\",\"created_timestamp\":1780913901,\"possibly_sensitive\":false,\"views\":13913,\"is_note_tweet\":false,\"community_note\":null,\"lang\":null,\"replying_to\":null,\"replying_to_status\":null,\"source\":\"Twitter Web App\",\"article\":{\"created_at\":\"2026-06-08T10:18:21.000Z\",\"modified_at\":\"2026-06-08T10:18:21.000Z\",\"id\":\"2063893302181519360\",\"title\":\"How to Make Claude Code Review Its Own Work Before Showing You (Exact Setup Inside) \",\"preview_text\":\"Claude Code hands you broken code, says it's done, and waits.\\nYou spot the bug, ask Claude to check, and now it's a back-and-forth that should have been one prompt.\\nMost devs accept this as normal.\",\"cover_media\":{\"id\":\"QXBpTWVkaWE6DAAFCgABHKRvbboWgAAKAAITPTJX5VewAAAA\",\"media_id\":\"2063897046306684928\",\"media_info\":{\"__typename\":\"ApiImage\",\"color_info\":{\"palette\":[{\"percentage\":67.52,\"rgb\":{\"blue\":238,\"green\":243,\"red\":244}},{\"percentage\":26.01,\"rgb\":{\"blue\":30,\"green\":30,\"red\":30}},{\"percentage\":1.72,\"rgb\":{\"blue\":39,\"green\":77,\"red\":34}},{\"percentage\":1.67,\"rgb\":{\"blue\":141,\"green\":144,\"red\":144}},{\"percentage\":0.25,\"rgb\":{\"blue\":198,\"green\":210,\"red\":241}}]},\"original_img_height\":572,\"original_img_url\":\"https://pbs.twimg.com/media/HKRvbboWgAAFMgf.jpg\",\"original_img_width\":1430},\"media_key\":\"3_2063897046306684928\"},\"content\":{\"blocks\":[{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"a8dsu\",\"text\":\"Claude Code hands you broken code, says it's done, and waits.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"20l8q\",\"text\":\"You spot the bug, ask Claude to check, and now it's a back-and-forth that should have been one prompt.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"35bu6\",\"text\":\"Most devs accept this as normal. The fix is making Claude review its own work before the result ever reaches you.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":0,\"length\":1,\"offset\":33}],\"inlineStyleRanges\":[{\"length\":34,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"9i0gk\",\"text\":\"Here's the full self-check setup 👇\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":1,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"dddq0\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"fnh93\",\"text\":\"Why Claude doesn't self-check by default\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"22k35\",\"text\":\"Claude is trained to deliver fast. \\\"Done\\\" feels helpful, running tests doesn't. So by default Claude skips review and ships.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"442jn\",\"text\":\"You know the loop. Claude writes code, claims the tests passed, and hands it over. You run them yourself, find three failures, and the conversation starts over.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"8hi2c\",\"text\":\"The fix isn't asking harder, it's making self-check happen before the result reaches you. \",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":2,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"9cipn\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"ft673\",\"text\":\"Step 1: The CLAUDE.md self-check protocol\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"amjrs\",\"text\":\"The first step is a set of rules in CLAUDE.md that tell Claude what \\\"done\\\" actually means. Drop this in your project root:\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":3,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"888qt\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"134th\",\"text\":\"These rules force Claude to do the review pass that it otherwise skips. The last paragraph is the most important. \",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"d5ctp\",\"text\":\"Without it, Claude will claim \\\"tests pass\\\" based on a memory from 3 turns ago, when the tests haven't actually been touched since.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"d7ip4\",\"text\":\"Step 2: The hooks that run checks automatically\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":13,\"offset\":28,\"style\":\"Bold\"}],\"key\":\"fkmok\",\"text\":\"The second step is hooks in settings.json that run linters and type checkers after every edit, so Claude can't skip the check even if it wanted to.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":4,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"evcu1\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":11,\"offset\":174,\"style\":\"Bold\"}],\"key\":\"200k\",\"text\":\"Hook output goes back to Claude as context. If the linter complains, Claude sees it the moment the file is saved and fixes it before the next step. No broken edit survives a PostToolUse check.\",\"type\":\"unstyled\"},{\"data\":{\"cashtags\":[{\"fromIndex\":54,\"text\":\"file\",\"toIndex\":59},{\"fromIndex\":80,\"text\":\"file\",\"toIndex\":85}]},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":13,\"offset\":25,\"style\":\"Bold\"}],\"key\":\"9r7f5\",\"text\":\"For Python projects, swap npm run lint for ruff check $file and tsc for pyright $file. For Rust, use cargo check --message-format=short. The pattern is the same, the command changes.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"12p7l\",\"text\":\"Step 3: The Stop hook that runs tests before \\\"done\\\"\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"blqcf\",\"text\":\"The third step is the most important one. A Stop hook runs the test suite before Claude is allowed to declare the session done. \",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"3ijc\",\"text\":\"If tests fail, Claude has to fix them or admit the work isn't ready.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":5,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"4vfbj\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"678ke\",\"text\":\"This is the layer that ends the back-and-forth. Claude can't say \\\"done, tests pass\\\" without the hook actually running them and the result coming back into the session. \",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"ejnv1\",\"text\":\"If 3 tests failed, Claude sees 3 failed tests and either fixes them or stops with a clear message.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"1vbtb\",\"text\":\"For longer test suites, scope the hook to fast tests only:\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":6,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"10o2l\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"5gpju\",\"text\":\"Full integration suites run in CI. The local Stop hook should be fast enough that Claude doesn't try to skip it.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"7fgsj\",\"text\":\"Step 4: The self-reviewer subagent\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"acla\",\"text\":\"The fourth step is a subagent whose only job is to review the work that just happened. Drop this in .claude/agents/self-reviewer.md:\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":7,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"fjasn\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"co0p1\",\"text\":\"Invoke this agent before showing results to your teammates or before commits. \",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"9jir4\",\"text\":\"It catches the issues the hooks missed and gives you a clean report instead of a vague \\\"looks good.\\\"\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"fnhof\",\"text\":\"Common mistakes that skip the self-check\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":15,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"bfn59\",\"text\":\"Hooks too slow. If npm test takes 90 seconds, Claude works around it. Per-edit hooks = lint and type checks only. Test suite belongs in the Stop hook.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":13,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"sp3a\",\"text\":\"No Stop hook. Without it, Claude declares \\\"done\\\" while PostToolUse is still complaining. The Stop hook is what makes \\\"done\\\" actually mean done.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":19,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"8drp0\",\"text\":\"CLAUDE.md too long. Self-check rules in the first 50 lines or Claude skims past them.\",\"type\":\"unstyled\"},{\"data\":{\"mentions\":[{\"fromIndex\":87,\"text\":\"self\",\"toIndex\":92}]},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":35,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"2an7k\",\"text\":\"You don't invoke the self-reviewer. A subagent only runs if you actually call it. Make @self-reviewer part of your pre-commit habit.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":31,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"268gb\",\"text\":\"You override with --skip-hooks. Don't. If you're disabling hooks, they're too slow or too noisy. Fix them, don't bypass them.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"fc8se\",\"text\":\"The 5-minute setup\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":8,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"dt8qb\",\"text\":\"1 minute: copy the CLAUDE.md self-check protocol into your project root.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":10,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"89kup\",\"text\":\"2 minutes: copy the PostToolUse and Stop hooks into .claude/settings.json.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":10,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"mkut\",\"text\":\"1 minute: create .claude/agents/self-reviewer.md with the template above.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":10,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"28abm\",\"text\":\"1 minute: run a real task and watch for tsc and npm test output at the end. Confirm Claude says \\\"tests passed\\\" with evidence, not just a confident \\\"done.\\\"\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"3e8vu\",\"text\":\"Done. The back-and-forth loop disappears. You only see results that already passed review. The model didn't get smarter. Your pipeline did.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":19,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"7a149\",\"text\":\"Thanks for reading!\",\"type\":\"unstyled\"},{\"data\":{\"mentions\":[{\"fromIndex\":0,\"text\":\"0x_rody\",\"toIndex\":8}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"e026m\",\"text\":\"@0x_rody \",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":8,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"2avah\",\"text\":\" \",\"type\":\"atomic\"}],\"entityMap\":[{\"key\":\"8\",\"value\":{\"data\":{\"entityKey\":\"a7bdf805-19f0-4caf-b15e-1f72becbadad\",\"mediaItems\":[{\"localMediaId\":\"3\",\"mediaCategory\":\"DraftTweetImage\",\"mediaId\":\"2063893618444623872\"}]},\"mutability\":\"Immutable\",\"type\":\"MEDIA\"}},{\"key\":\"4\",\"value\":{\"data\":{\"entityKey\":\"c7351b70-97f8-477c-8fad-58a02bebaf4f\",\"markdown\":\"```json\\n{\\n \\\"hooks\\\": {\\n \\\"PostToolUse\\\": [\\n {\\n \\\"matcher\\\": \\\"Write|Edit\\\",\\n \\\"hooks\\\": [\\n { \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"npm run lint --silent 2>&1 | tail -15\\\" }\\n ]\\n },\\n {\\n \\\"matcher\\\": \\\"Write(*.ts|*.tsx)|Edit(*.ts|*.tsx)\\\",\\n \\\"hooks\\\": [\\n { \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"npx tsc --noEmit --pretty false 2>&1 | head -15\\\" }\\n ]\\n }\\n ]\\n }\\n}\\n```\"},\"mutability\":\"Mutable\",\"type\":\"MARKDOWN\"}},{\"key\":\"5\",\"value\":{\"data\":{\"entityKey\":\"f71b1099-2c9d-43fc-bc95-a979a7266b08\",\"markdown\":\"```json\\n\\\"Stop\\\": [\\n {\\n \\\"hooks\\\": [\\n { \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"npm test --silent 2>&1 | tail -25\\\" }\\n ]\\n }\\n]\\n```\"},\"mutability\":\"Mutable\",\"type\":\"MARKDOWN\"}},{\"key\":\"6\",\"value\":{\"data\":{\"entityKey\":\"53253e0f-0744-4b08-840d-aa78f19de630\",\"markdown\":\"```json\\n\\\"Stop\\\": [\\n {\\n \\\"hooks\\\": [\\n { \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"npm test --silent -- --testPathPattern='unit' 2>&1 | tail -20\\\" }\\n ]\\n }\\n]\\n```\"},\"mutability\":\"Mutable\",\"type\":\"MARKDOWN\"}},{\"key\":\"1\",\"value\":{\"data\":{\"entityKey\":\"0471056e-c2c0-4d0b-8e1f-81c822375800\",\"mediaItems\":[{\"localMediaId\":\"1\",\"mediaCategory\":\"DraftTweetImage\",\"mediaId\":\"2063893549624483840\"}]},\"mutability\":\"Immutable\",\"type\":\"MEDIA\"}},{\"key\":\"0\",\"value\":{\"data\":{\"url\":\"https://abs.twimg.com/emoji/v2/svg/1f447.svg\"},\"mutability\":\"Immutable\",\"type\":\"TWEMOJI\"}},{\"key\":\"2\",\"value\":{\"data\":{\"entityKey\":\"c863e85a-53cd-4136-9c86-f6c607533d24\",\"mediaItems\":[{\"localMediaId\":\"6\",\"mediaCategory\":\"DraftTweetImage\",\"mediaId\":\"2063895493092970496\"}]},\"mutability\":\"Immutable\",\"type\":\"MEDIA\"}},{\"key\":\"7\",\"value\":{\"data\":{\"entityKey\":\"4caafa8e-a2d1-4a08-8345-5ce877be56a9\",\"markdown\":\"```yaml\\n---\\nname: self-reviewer\\ndescription: Run this agent after any task that wrote or edited code. Reviews the changes in the current session for bugs, broken tests, leftovers, and unfinished work before the result is shown to the user.\\ntools: Read, Grep, Glob, Bash\\nmodel: sonnet\\n---\\n\\nYou review work that was just completed in this session, including your own.\\n\\nWhen invoked:\\n\\n1. Run `git diff` to see what changed.\\n2. Read the full files where changes happened, not just the diff.\\n3. Run the test suite. Report what passed and what failed.\\n4. Check for: broken imports, missing tests for new code, unused code,\\n leftover console.log/print statements, TODO markers.\\n5. Verify every claim from the previous turn. \\\"Refactored function X\\\"\\n → did it actually get refactored? \\\"Added test for Y\\\" → does the test\\n exist and run?\\n\\nOutput one of:\\n- VERIFIED: list what you confirmed, with evidence (file:line or command output)\\n- ISSUES FOUND: list each issue with file:line and a one-sentence fix suggestion\\n- BLOCKED: explain why you can't verify\\n\\nDo not fix anything. Just report. The author decides what to do next.\\n```\"},\"mutability\":\"Mutable\",\"type\":\"MARKDOWN\"}},{\"key\":\"3\",\"value\":{\"data\":{\"entityKey\":\"2ddd7eed-346b-400f-9f9d-8de952dfe97e\",\"markdown\":\"```markdown\\n## Self-check protocol (run before saying \\\"done\\\")\\n\\nBefore showing me a result, do all of:\\n\\n1. Run the relevant test, build, or lint command in this session.\\n2. Read every file you edited end to end. Look for breakage you missed.\\n3. Check for leftovers: console.log, print(), commented-out code, TODO markers.\\n4. Confirm the diff matches what you actually intended to change.\\n\\n\\\"Done\\\" requires evidence from this session. \\\"Tests pass\\\" only counts if\\nyou ran them in this turn. Never claim success based on a previous turn.\\n\\nIf anything failed or you couldn't verify it, say \\\"blocked\\\" or\\n\\\"unverified\\\" instead of \\\"done\\\", and explain why.\\n\\n```\"},\"mutability\":\"Mutable\",\"type\":\"MARKDOWN\"}}]},\"media_entities\":[{\"id\":\"QXBpTWVkaWE6DAAFCgABHKRsP5eWYAAKAAITPTJX5VewAAAA\",\"media_id\":\"2063893549624483840\",\"media_info\":{\"__typename\":\"ApiImage\",\"color_info\":{\"palette\":[{\"percentage\":40.06,\"rgb\":{\"blue\":26,\"green\":33,\"red\":43}},{\"percentage\":32.47,\"rgb\":{\"blue\":194,\"green\":203,\"red\":212}},{\"percentage\":28.95,\"rgb\":{\"blue\":86,\"green\":104,\"red\":121}},{\"percentage\":0.32,\"rgb\":{\"blue\":28,\"green\":53,\"red\":76}},{\"percentage\":0.14,\"rgb\":{\"blue\":41,\"green\":50,\"red\":116}}]},\"original_img_height\":800,\"original_img_url\":\"https://pbs.twimg.com/media/HKRsP5eWYAAPTt4.jpg\",\"original_img_width\":1200},\"media_key\":\"3_2063893549624483840\"},{\"id\":\"QXBpTWVkaWE6DAAFCgABHKRuBBdWEAAKAAITPTJX5VewAAAA\",\"media_id\":\"2063895493092970496\",\"media_info\":{\"__typename\":\"ApiImage\",\"color_info\":{\"palette\":[{\"percentage\":94.58,\"rgb\":{\"blue\":88,\"green\":120,\"red\":217}},{\"percentage\":2.73,\"rgb\":{\"blue\":34,\"green\":42,\"red\":63}},{\"percentage\":2.32,\"rgb\":{\"blue\":246,\"green\":250,\"red\":251}},{\"percentage\":0.23,\"rgb\":{\"blue\":125,\"green\":153,\"red\":224}}]},\"original_img_height\":395,\"original_img_url\":\"https://pbs.twimg.com/media/HKRuBBdWEAAuUsA.jpg\",\"original_img_width\":776},\"media_key\":\"3_2063895493092970496\"},{\"id\":\"QXBpTWVkaWE6DAAFCgABHKRsT52WYAAKAAITPTJX5VewAAAA\",\"media_id\":\"2063893618444623872\",\"media_info\":{\"__typename\":\"ApiImage\",\"color_info\":{\"palette\":[{\"percentage\":40.59,\"rgb\":{\"blue\":26,\"green\":38,\"red\":50}},{\"percentage\":32.22,\"rgb\":{\"blue\":197,\"green\":225,\"red\":229}},{\"percentage\":13.51,\"rgb\":{\"blue\":44,\"green\":90,\"red\":147}},{\"percentage\":7.29,\"rgb\":{\"blue\":108,\"green\":103,\"red\":92}},{\"percentage\":3.24,\"rgb\":{\"blue\":21,\"green\":33,\"red\":62}}]},\"original_img_height\":636,\"original_img_url\":\"https://pbs.twimg.com/media/HKRsT52WYAAufXE.jpg\",\"original_img_width\":1125},\"media_key\":\"3_2063893618444623872\"}]},\"twitter_card\":\"tweet\",\"color\":null,\"provider\":\"twitter\",\"reposted_by\":null}}"