- generic [ref=e2]: "{\"code\":200,\"message\":\"OK\",\"tweet\":{\"url\":\"https://x.com/cyrilXBT/status/2063634505940754601\",\"id\":\"2063634505940754601\",\"text\":\"\",\"raw_text\":{\"text\":\"https://t.co/ozmU5bcQaS\",\"display_text_range\":[0,23],\"facets\":[]},\"author\":{\"screen_name\":\"cyrilXBT\",\"url\":\"https://x.com/cyrilXBT\",\"id\":\"1373665408193036293\",\"followers\":183173,\"following\":453,\"likes\":35464,\"media_count\":7333,\"name\":\"CyrilXBT\",\"description\":\"AI • Tech • Crypto | Sharing what I see before everyone else does.\",\"raw_description\":{\"text\":\"AI • Tech • Crypto | Sharing what I see before everyone else does.\",\"facets\":[]},\"location\":\"\",\"banner_url\":\"https://pbs.twimg.com/profile_banners/1373665408193036293/1775621295\",\"avatar_url\":\"https://pbs.twimg.com/profile_images/2035229727414534145/aWap3Jbq_200x200.jpg\",\"joined\":\"Sun Mar 21 15:58:58 +0000 2021\",\"protected\":false,\"website\":{\"url\":\"https://linktr.ee/cyrilxbt\",\"display_url\":\"linktr.ee/cyrilxbt\"},\"verification\":{\"verified\":true,\"verified_at\":null,\"type\":\"individual\"},\"avatar_color\":null},\"replies\":21,\"retweets\":29,\"likes\":212,\"bookmarks\":412,\"quotes\":1,\"created_at\":\"Sun Jun 07 14:49:41 +0000 2026\",\"created_timestamp\":1780843781,\"possibly_sensitive\":false,\"views\":112014,\"is_note_tweet\":false,\"community_note\":null,\"lang\":null,\"replying_to\":null,\"replying_to_status\":null,\"source\":\"Twitter Web App\",\"article\":{\"created_at\":\"2026-06-04T18:01:33.000Z\",\"modified_at\":\"2026-06-07T14:49:41.000Z\",\"id\":\"2056443926895382528\",\"title\":\"12 Free MIT AI Textbooks Into Claude and It Rebuilt My Entire Research System From Scratch\",\"preview_text\":\"Most people using Claude are getting chatbot outputs.\\nI am getting something different.\\nNot because I have a better subscription. Not because I write better prompts.\\nBecause I spent one afternoon\",\"cover_media\":{\"id\":\"QXBpTWVkaWE6DAAFCgABHIpMPjWWQAAKAAITED1pJ5aABQAA\",\"media_id\":\"2056540009918775296\",\"media_info\":{\"__typename\":\"ApiImage\",\"color_info\":{\"palette\":[{\"percentage\":90.12,\"rgb\":{\"blue\":231,\"green\":242,\"red\":250}},{\"percentage\":4.26,\"rgb\":{\"blue\":195,\"green\":179,\"red\":173}},{\"percentage\":2.44,\"rgb\":{\"blue\":114,\"green\":120,\"red\":121}},{\"percentage\":1.55,\"rgb\":{\"blue\":158,\"green\":204,\"red\":222}},{\"percentage\":1.06,\"rgb\":{\"blue\":171,\"green\":188,\"red\":242}}]},\"original_img_height\":710,\"original_img_url\":\"https://pbs.twimg.com/media/HIpMPjWWQAA_4hG.jpg\",\"original_img_width\":1774},\"media_key\":\"3_2056540009918775296\"},\"content\":{\"blocks\":[{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"ci8jm\",\"text\":\"Most people using Claude are getting chatbot outputs.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"911hn\",\"text\":\"I am getting something different.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"c4ers\",\"text\":\"Not because I have a better subscription. Not because I write better prompts.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"2k0a6\",\"text\":\"Because I spent one afternoon uploading 12 free MIT AI textbooks into a Claude Project and never went back to the way I worked before.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"189v5\",\"text\":\"This is not an article about free education.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"cdovi\",\"text\":\"This is about what happens when you stop using Claude as a search engine with better grammar and start using it as a system that reasons from first principles.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"5n9lb\",\"text\":\"The difference is not subtle.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"87p56\",\"text\":\"What MIT Actually Published and Why Nobody Is Using It\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"a2plh\",\"text\":\"MIT's researchers did not write blog posts.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"bcibi\",\"text\":\"They did not record YouTube tutorials optimized for watch time.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"eb3s3\",\"text\":\"They wrote 12 graduate-level textbooks covering the complete theoretical foundation of modern AI. Machine learning foundations. Deep learning. Reinforcement learning. Decision algorithms. Ethics. Probability theory.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"4ksa2\",\"text\":\"Primary source material from the institution that produced the people building the models everyone is talking about.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"f0if7\",\"text\":\"Every book is free.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"f7ecv\",\"text\":\"Every link is publicly available.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"3297n\",\"text\":\"Almost nobody is using them.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"1527b\",\"text\":\"Most people will treat this list as a reading list. Something to bookmark and return to someday.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"fi81h\",\"text\":\"I treated it as training data for a research system.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"jt17\",\"text\":\"What I Actually Did\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"dvrjq\",\"text\":\"I created a Claude Project.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"elc34\",\"text\":\"I uploaded all 12 books as Project knowledge. Not as reference material to search through manually. As permanent context that lives inside every conversation in that Project forever.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"2ghjg\",\"text\":\"This distinction matters more than most people realize.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"lh4c\",\"text\":\"When you paste a document into a chat session Claude reads it for that conversation and it disappears when the session ends.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"a7nga\",\"text\":\"When you upload books to a Claude Project Claude does not skim them when you ask a question. It reasons from them. The theoretical foundation sits underneath every output permanently.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"fjf2a\",\"text\":\"Every conversation in that Project now has 12 MIT textbooks as its base layer.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"8ii8p\",\"text\":\"Most retail research tools were not built with that layer.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"e9ric\",\"text\":\"Most quant analysts earning six figures are paid specifically because they understand that layer.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"4acsh\",\"text\":\"I got it for free in one afternoon.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"ju40\",\"text\":\"What Changed the Moment the Books Were Uploaded\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"7f80v\",\"text\":\"The first thing I noticed was that Claude stopped describing signals and started explaining why signals exist.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"7p3j8\",\"text\":\"Before the books: ask Claude to analyze a market structure and it pattern-matches. RSI overbought. Moving average convergence. Surface-level output that describes what the chart looks like.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"4tvvf\",\"text\":\"After the books: the same question produced something categorically different.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"2bet8\",\"text\":\"Claude started reasoning about distribution properties. It flagged when market behavior was deviating from statistical norms rather than just visual patterns. It started identifying regime changes earlier because it was now working from probability theory not price history.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"ebi8k\",\"text\":\"That is not a productivity upgrade.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"6eiq3\",\"text\":\"That is a different category of analytical tool entirely.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"3i08l\",\"text\":\"The Moment That Stopped Me\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"8sheu\",\"text\":\"I was building a position sizing framework inside the Project.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"afc2f\",\"text\":\"I mentioned the Kelly Criterion as my baseline.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"con1h\",\"text\":\"Claude pushed back.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"5qcok\",\"text\":\"It told me the Kelly Criterion was mathematically insufficient for crypto specifically because crypto returns follow fat-tailed distributions that violate the assumptions Kelly was built on.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"d2866\",\"text\":\"Then it pulled directly from Kevin Murphy's Probabilistic Machine Learning textbook, cited the chapter on heavy-tailed inference, and offered a modified position sizing framework grounded in that material.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"9ukvu\",\"text\":\"Unprompted.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"62ahd\",\"text\":\"Unsolicited.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"4it86\",\"text\":\"Completely correct.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"6tcnu\",\"text\":\"That moment came from a free MIT textbook uploaded to a free Claude Project on a Sunday afternoon.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"67ti9\",\"text\":\"The gap between a Claude that pattern-matches and a Claude that catches the mathematical flaw in your framework before you deploy capital on it is exactly the gap this setup creates.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"4mid9\",\"text\":\"The Complete 12-Book System\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"a4vil\",\"text\":\"Here are all 12 books, what each one unlocks, and the direct link to download.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":11,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"23e6u\",\"text\":\"FOUNDATIONS\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":57,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"d5ppf\",\"text\":\"1. Foundations of Machine Learning — Mehryar Mohri et al.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"27ej2\",\"text\":\"The theoretical backbone of the entire system. Covers the mathematics behind why learning algorithms work, not just how to use them.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"e23l4\",\"text\":\"After this book Claude stopped giving surface pattern recognition and started explaining the statistical mechanics underneath price behavior.\",\"type\":\"unstyled\"},{\"data\":{\"urls\":[{\"fromIndex\":0,\"text\":\"mlbook.cs.nyu.edu\",\"toIndex\":17}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"48uak\",\"text\":\"mlbook.cs.nyu.edu\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":50,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"dpetq\",\"text\":\"2. Understanding Deep Learning — Simon J.D. Prince\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"1em2d\",\"text\":\"The clearest explanation of how neural networks actually process and weight information that exists in print.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"8ojm\",\"text\":\"Reading this changed how I write prompts. Understanding what Claude is doing when it responds — not just what it produces — makes every interaction more precise.\",\"type\":\"unstyled\"},{\"data\":{\"urls\":[{\"fromIndex\":0,\"text\":\"udlbook.github.io/udlbook\",\"toIndex\":25}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"1ft0v\",\"text\":\"udlbook.github.io/udlbook\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":33,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"c9e1k\",\"text\":\"3. Machine Learning Systems — MIT\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"ahcb6\",\"text\":\"Bridges theory to production. How models are built, deployed, and fail in real environments.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"94j99\",\"text\":\"Understanding Claude's failure modes is as important as understanding its capabilities. This book teaches you when not to trust the output.\",\"type\":\"unstyled\"},{\"data\":{\"urls\":[{\"fromIndex\":0,\"text\":\"mlsysbook.ai\",\"toIndex\":12}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"4clr9\",\"text\":\"mlsysbook.ai\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":19,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"9jgq\",\"text\":\"ADVANCED TECHNIQUES\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":63,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"o06b\",\"text\":\"4. Algorithms for Decision Making — Kochenderfer, Wheeler, Wray\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"9cr55\",\"text\":\"The book that reframed how I think about entries, holds, and exits entirely.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"acpm9\",\"text\":\"Treats sequential decisions as policy problems under uncertainty. This is the theoretical foundation for how I now structure position management inside Claude.\",\"type\":\"unstyled\"},{\"data\":{\"urls\":[{\"fromIndex\":0,\"text\":\"algorithmsbook.com\",\"toIndex\":18}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"7lgs0\",\"text\":\"algorithmsbook.com\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":48,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"6vli8\",\"text\":\"5. Deep Learning — Goodfellow, Bengio, Courville\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"6i2i4\",\"text\":\"The original deep learning textbook. Dense but foundational.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"fgi4f\",\"text\":\"Understanding this one tells you why specific Claude behaviors happen and how to engineer around them.\",\"type\":\"unstyled\"},{\"data\":{\"urls\":[{\"fromIndex\":0,\"text\":\"deeplearningbook.org\",\"toIndex\":20}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"87bt0\",\"text\":\"deeplearningbook.org\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":22,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"farat\",\"text\":\"REINFORCEMENT LEARNING\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":61,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"b6ji3\",\"text\":\"6. Reinforcement Learning: An Introduction — Sutton and Barto\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"dtu1u\",\"text\":\"The bible of reinforcement learning.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"785g5\",\"text\":\"Every agent, every Claude tool that reasons sequentially, traces its lineage back to this book. If you want to understand why Claude performs the way it does on multi-step tasks, this is where you start.\",\"type\":\"unstyled\"},{\"data\":{\"urls\":[{\"fromIndex\":0,\"text\":\"incompleteideas.net/book/the-book.html\",\"toIndex\":38}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"e4lt\",\"text\":\"incompleteideas.net/book/the-book.html\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":59,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"7pa8o\",\"text\":\"7. Distributional Reinforcement Learning — Bellemare et al.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"9vqel\",\"text\":\"The one most people skip. It is the most important one to read.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"1dub9\",\"text\":\"It shifts the analytical frame from expected rewards to full probability distributions over outcomes. That distinction matters enormously in any domain where returns are fat-tailed and asymmetric.\",\"type\":\"unstyled\"},{\"data\":{\"urls\":[{\"fromIndex\":0,\"text\":\"distributional-rl.org\",\"toIndex\":21}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"bfs0a\",\"text\":\"distributional-rl.org\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":70,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"62nrl\",\"text\":\"8. Multi-Agent Reinforcement Learning — Albrecht, Christianos, Schafer\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"nnis\",\"text\":\"How multiple decision-making agents learn to interact in shared environments.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"edj1t\",\"text\":\"Directly relevant for anyone thinking about multi-agent Claude setups or understanding how market participants collectively create price dynamics.\",\"type\":\"unstyled\"},{\"data\":{\"urls\":[{\"fromIndex\":0,\"text\":\"marl-book.com\",\"toIndex\":13}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"3edrn\",\"text\":\"marl-book.com\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":60,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"ffinb\",\"text\":\"9. Algorithms for Decision Making — Kochenderfer (Long Game)\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"82uii\",\"text\":\"Focused specifically on decision-making under uncertainty across long time horizons.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"ei83f\",\"text\":\"The probabilistic frameworks here are directly applicable to portfolio construction and position sizing with incomplete information.\",\"type\":\"unstyled\"},{\"data\":{\"urls\":[{\"fromIndex\":0,\"text\":\"mykel.kochenderfer.com/textbooks\",\"toIndex\":32}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"b9ojb\",\"text\":\"mykel.kochenderfer.com/textbooks\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":22,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"er07j\",\"text\":\"ETHICS AND PROBABILITY\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":61,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"7ss0a\",\"text\":\"10. Fairness and Machine Learning — Barocas, Hardt, Narayanan\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"98bep\",\"text\":\"The most underrated book on this list.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"642h0\",\"text\":\"Understanding where models break down and where bias enters is critical for knowing when not to trust Claude's output. Most people ignore this one. The ones who read it use AI tools more accurately than the ones who do not.\",\"type\":\"unstyled\"},{\"data\":{\"urls\":[{\"fromIndex\":0,\"text\":\"fairmlbook.org\",\"toIndex\":14}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"bre8n\",\"text\":\"fairmlbook.org\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":66,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"4cnsq\",\"text\":\"11. Probabilistic Machine Learning: An Introduction — Kevin Murphy\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"18sgm\",\"text\":\"Volume one. This is the book that triggered the Kelly Criterion moment described above.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"8ibqn\",\"text\":\"Murphy builds every concept on probability theory from the ground up. Upload this and Claude gains a completely different analytical baseline.\",\"type\":\"unstyled\"},{\"data\":{\"urls\":[{\"fromIndex\":0,\"text\":\"probml.github.io/book1.html\",\"toIndex\":27}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"5mt2h\",\"text\":\"probml.github.io/book1.html\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":66,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"6o3sf\",\"text\":\"12. Probabilistic Machine Learning: Advanced Topics — Kevin Murphy\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"5keaj\",\"text\":\"Volume two. Causal inference. Decision making under uncertainty. Generative models at graduate level.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"1codg\",\"text\":\"This is the layer that gave Claude the theoretical grounding to challenge my frameworks rather than confirm them.\",\"type\":\"unstyled\"},{\"data\":{\"urls\":[{\"fromIndex\":0,\"text\":\"probml.github.io/book2.html\",\"toIndex\":27}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"db0po\",\"text\":\"probml.github.io/book2.html\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"b10rd\",\"text\":\"How to Build This System in One Afternoon\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"2kpit\",\"text\":\"The setup is straightforward. The discipline required to actually do it is what separates people who read this from people who build it.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":7,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"b3fsk\",\"text\":\"Step 1: Download all 12 books from the links above. Every one is free and publicly available.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":7,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"fh9kj\",\"text\":\"Step 2: Create a new Claude Project. Name it something specific. Research System. Analysis Engine. Whatever signals to you that this is not a casual chat session.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":7,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"bmito\",\"text\":\"Step 3: Write a focused system prompt before uploading anything:\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"6l7nl\",\"text\":\"You are a research and analysis system grounded in ML theory \\nand probability. Apply first principles reasoning to every output. \\nWhen a framework I propose has mathematical limitations, identify \\nthem and offer an alternative grounded in the uploaded material. \\nNever describe patterns without explaining the statistical \\nmechanism that produces them.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":7,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"fgeg4\",\"text\":\"Step 4: Upload the books as Project knowledge. Start with these three if you want immediate results: Probabilistic ML Volume 1, Probabilistic ML Volume 2, and Foundations of Machine Learning. Those three alone will change your outputs within the first conversation.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":7,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"bomep\",\"text\":\"Step 5: Test it with a real question you already know the answer to. The difference in depth will be visible in the first response. Not gradual. Immediate.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":7,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"boejb\",\"text\":\"Step 6: Add your own research notes, your own frameworks, and your own data sources on top of the theoretical foundation. The books give Claude the theory. You give it the context of your specific domain. The combination is what most people are not building.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"cka7j\",\"text\":\"What This System Does That Most Setups Do Not\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"2cl5b\",\"text\":\"Most Claude users are working with a context window and good prompts.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"10qsk\",\"text\":\"This Project has twelve MIT textbooks sitting underneath every single conversation.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"8b4uv\",\"text\":\"The output gap is not subtle.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"1q07c\",\"text\":\"When you ask about a complex analytical problem, Claude is not guessing from general training data alone. It is reasoning from graduate-level probability and ML theory that most professional analysts are paid six figures to understand.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"2ujg2\",\"text\":\"Three specific differences become visible immediately.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"dbsa6\",\"text\":\"First, the depth of explanation changes. Claude stops describing outcomes and starts explaining mechanisms. The why before the what.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"1n412\",\"text\":\"Second, the pushback quality changes. Claude will challenge your frameworks when they have mathematical limitations. This is not common in standard Claude sessions. It happens consistently when the theoretical foundation is in the Project context.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"2js0s\",\"text\":\"Third, the error detection improves. You notice when Claude falls short more quickly because the baseline is higher. That feedback loop alone is worth the afternoon the setup requires.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"2bvas\",\"text\":\"The Caveat That Matters\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"c0hf8\",\"text\":\"This setup does not replace judgment.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"co86r\",\"text\":\"Claude reasoning from MIT textbooks is still Claude. It will make errors. It will miss things. The theoretical grounding does not make it infallible.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"dis7v\",\"text\":\"What it will not do is give you shallow analysis dressed up as depth.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"dohds\",\"text\":\"The quality floor of every output rises. The outputs that fall short are more obviously insufficient. You catch them faster. You iterate faster. You build better systems faster.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"2ms3q\",\"text\":\"That compounding effect is what you are actually setting up when you spend the afternoon on this.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"deuos\",\"text\":\"The Window on This Is Closing\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"ikas\",\"text\":\"Right now the distribution of Claude users looks like this.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"fqh64\",\"text\":\"The majority are using Claude as a chat tool. Ask a question. Get an answer. Close the tab.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"5b0tr\",\"text\":\"A smaller group is building Projects with uploaded context. Using Claude as a system rather than a session.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"bkj6u\",\"text\":\"A much smaller group is uploading primary source ML theory to those Projects and using the outputs for real analytical decisions.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"ccj7\",\"text\":\"That last group is not growing as fast as the opportunity is.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"dcijl\",\"text\":\"The books are free. The Project is free. The setup takes one afternoon.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"a4bft\",\"text\":\"In six months this approach will be significantly more common. The analytical edge it creates will be less rare.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"atlms\",\"text\":\"Right now it is still uncommon enough that the gap between people who build this and people who do not is one of the more visible divides in how serious operators actually work.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"fmcum\",\"text\":\"The books are free.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"e8qcq\",\"text\":\"The Project is free.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"2m1jp\",\"text\":\"The afternoon is yours.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"33nmh\",\"text\":\"Build the system this weekend.\",\"type\":\"unstyled\"},{\"data\":{\"mentions\":[{\"fromIndex\":7,\"text\":\"cyrilXBT\",\"toIndex\":16}]},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"e9c3t\",\"text\":\"Follow @cyrilXBT for every Claude setup, workflow, and research architecture that compounds your analytical edge the moment it surfaces.\",\"type\":\"unstyled\"}],\"entityMap\":[]},\"media_entities\":[]},\"twitter_card\":\"tweet\",\"color\":null,\"provider\":\"twitter\",\"reposted_by\":null}}"