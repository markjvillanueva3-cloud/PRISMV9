                            - text: "# Initialize client and schema client = MilvusClient(\"milvus_binary_quantized.db\") schema = client.create_schema(auto_id=True, enable_dynamic_fields=True)"
                            - text: "# Add fields to schema schema.add_field(field_name=\"context\", datatype=DataType.VARCHAR) schema.add_field(field_name=\"binary_vector\", datatype=DataType.BINARY_VECTOR)"
                            - text: "# Create index parameters for binary vectors index_params = client.prepare_index_params() index_params.add_index( field_name=\"binary_vector\", index_name=\"binary_vector_index\", index_type=\"BIN_FLAT\", # Exact search for binary vectors metric_type=\"HAMMING\" # Hamming distance for binary vectors"
                            - text: )
                            - text: "# Create collection with schema and index client.create_collection( collection_name=\"fastest-rag\", schema=schema, index_params=index_params"
                            - text: )
                            - text: "# Insert data to index client.insert( collection_name=\"fastest-rag\", data=[ {\"context\": context, \"binary_vector\": binary_embedding} for context, binary_embedding in zip(batch_context, binary_embeddings) ]"
