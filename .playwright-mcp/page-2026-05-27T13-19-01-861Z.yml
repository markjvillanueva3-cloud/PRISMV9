                            - text: from llama_index.embeddings.huggingface import HuggingFaceEmbedding embed_model = HuggingFaceEmbedding( model_name="BAAI/bge-large-en-v1.5", trust_remote_code=True, cache_folder='./hf_cache'
                            - text: )
                            - text: "for context in batch_iterate(documents, batch_size=512): # Generate float32 vector embeddings batch_embeds = embed_model.get_text_embedding_batch(context) # Convert float32 vectors to binary vectors embeds_array = np.array(batch_embeds) binary_embeds = np.where(embeds_array > 0, 1, 0).astype(np.uint8) # Convert to bytes array packed_embeds = np.packbits(binary_embeds, axis=1) byte_embeds = [vec.tobytes() for vec in packed_embeds] binary_embeddings.extend(byte_embeds)"
