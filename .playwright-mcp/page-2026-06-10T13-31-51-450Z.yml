        - paragraph [ref=e267]: One of the key features that the standard MCP libraries provide is abstracting various transport methods.
        - paragraph [ref=e268]: The high level MCP tool implementation is the same no matter what low level transport channel/method that the MCP Client uses to connect to a MCP Server.
        - paragraph [ref=e269]: The simplest transport that the SDK supports is the stdio (stdio/stdout) transport — which connects a locally running process. Both the MCP client and MCP Server must be running in the same environment.
