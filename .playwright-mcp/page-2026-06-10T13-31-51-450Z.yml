          - text: The complete report is available in the benchmark_deep_dive.md artifact.
          - text: "### 🔍 Summary of Key Architectural Explanations"
          - text: "1. Memory Bandwidth Bottleneck (Autoregressive Decoding):"
          - text: "• Observation: The L4 baseline flattens out around 80–90 tokens/sec at concurrency levels above 16. The RTX 6000"
          - text: Blackwell scales up to 365 tokens/sec at 128 concurrent users.
          - text: "• Explanation: The autoregressive decode phase is memory-bandwidth bound. The RTX 6000 Blackwell's 960 GB/s GDDR7"
          - text: bandwidth is 3.2x faster than the L4's 300 GB/s, allowing vLLM to process larger batches without memory stalls.
          - text: "2. Compute-Bound Prefill (Time to First Token & Latency):"
          - text: "• Observation: Under high load, average latency on the L4 climbs to ~1.0 second, whereas it stays flat under 0.25"
          - text: seconds on the RTX 6000 Blackwell.
          - text: "• Explanation: Prompt processing (prefill) is compute-bound. The RTX 6000 Blackwell features 24,064 CUDA cores"
          - text: and 1,457 TFLOPS of FP8 performance (vs. 7,424 cores and 242 TFLOPS on L4), computing prompt matrix
          - text: multiplications almost instantaneously.
          - text: "3. VRAM Headroom for Deep Context (16k vs. 32k):"
          - text: "• Observation: The L4 hits a hard limit at a 16,384 context window. The RTX 6000 Blackwell scales up to 32,767"
          - text: tokens with high concurrency.
          - text: "• Explanation: Large context windows require massive VRAM pools to store KV-caches. The RTX 6000 Blackwell's 96"
          - text: GB VRAM easily accommodates the FP8-quantized model and deep KV-caches, maintaining a stable throughput of ~24.66
          - text: tokens/sec at the maximum 32,767 limit.
