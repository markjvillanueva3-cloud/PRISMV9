        - paragraph [ref=e433]: "A full cost analysis was done:"
        - generic [ref=e435]:
          - text: Analyzing Compute Costs
          - text: To compare the cost efficiency of the NVIDIA L4 vs. the NVIDIA RTX PRO 6000 for serving the Gemma 4 (4B-it) model, we
          - text: break down Google Cloud Run resource pricing (Tier 1 regions) and measure it against the benchmarked throughput.
          - text: ──────
          - text: "### 1. Google Cloud Run Resource Rates (Tier 1 Regions)"
          - text: To utilize GPUs on Cloud Run, the CPU and memory must remain allocated during the instance lifecycle.
          - text: Billing Component | Unit Rate (CPU Always Allocated)
          - text: "----------------------------------------------------------|----------------------------------------------------------"
          - text: vCPU | $0.00001800 per vCPU-second
          - text: Memory | $0.00000200 per GiB-second
          - text: NVIDIA L4 GPU (No Zonal Redundancy) | $0.00018670 per GPU-second (~$0.67/hr)
          - text: NVIDIA RTX PRO 6000 | $0.00079170 per GPU-second (~$2.85/hr)
          - text: ──────
          - text: "### 2. Minimum Stack Configurations & Hourly Costs"
          - text: Stack Component | 🟢 NVIDIA L4 Configuration | 🚀 NVIDIA RTX PRO 6000 Configuration
          - text: "---------------------------------------|--------------------------------------|--------------------------------------"
          - text: GPU | 1x NVIDIA L4 ($0.672/hr) | 1x NVIDIA RTX PRO 6000 ($2.85/hr)
          - text: vCPU Allocation | 4 vCPUs ($0.259/hr) | 20 vCPUs ($1.296/hr)
          - text: Memory Allocation | 16 GiB ($0.115/hr) | 80 GiB ($0.576/hr)
          - text: Total Hourly Cost | $1.047 / hour ($0.000291/sec) | $4.722 / hour ($0.001312/sec)
          - text: ──────
          - text: "### 3. Cost Per Token Comparison (Gemma 4 4B-it)"
          - text: "Using the benchmark results for both setups, we calculate the cost per 1 Million Tokens:"
          - text: "#### Scenario A: Peak Throughput (Short Context)"
          - text: "• 🟢 NVIDIA L4: Peak Throughput of 90 tokens/sec"
          - text: "• Time to generate 1M tokens: $11,111\\text{ seconds}$ (~3.09 hours)"
          - text: "• Cost per 1M Tokens: $\\mathbf{\\$3.23}$"
          - text: "• 🚀 NVIDIA RTX PRO 6000: Peak Throughput of 365 tokens/sec"
          - text: "• Time to generate 1M tokens: $2,740\\text{ seconds}$ (~0.76 hours)"
          - text: "• Cost per 1M Tokens: $\\mathbf{\\$3.59}$"
          - text: │ [!NOTE]
          - text: │ For peak throughput workloads, the NVIDIA L4 is slightly cheaper (~10% lower cost per token), but the RTX PRO 6000
          - text: │ delivers the tokens 4x faster with 4x lower latency.
          - text: "#### Scenario B: Deep Context Boundary (16K Context Window)"
          - text: "• 🟢 NVIDIA L4: Throughput of 26 tokens/sec"
          - text: "• Time to generate 1M tokens: $38,462\\text{ seconds}$ (~10.68 hours)"
          - text: "• Cost per 1M Tokens: $\\mathbf{\\$11.18}$"
          - text: "• 🚀 NVIDIA RTX PRO 6000: Throughput of 23 tokens/sec"
          - text: "• Time to generate 1M tokens: $43,478\\text{ seconds}$ (~12.08 hours)"
          - text: "• Cost per 1M Tokens: $\\mathbf{\\$57.03}$"
          - text: ──────
          - text: "### 🏆 Verdict: Which has the best cost per token?"
          - text: "1. Overall Winner: NVIDIA L4 GPU"
          - text: The NVIDIA L4 has the best cost per token across all scenarios. At 16K context windows, it is over 5x more cost-
          - text: effective than the RTX 6000 because the RTX 6000 is bound by a minimum compute footprint of 20 vCPUs and 80 GiB
          - text: memory, making its base running cost significantly higher ($4.72/hr vs. $1.05/hr) even when throughput scales down at
          - text: long contexts.
          - text: "2. Best for Latency/High Concurrency: RTX PRO 6000"
          - text: If sub-second latency under high concurrent load is required, the RTX PRO 6000 is only ~11% more expensive per token
          - text: for short contexts while generating tokens 4x faster.
