        - heading "Where do I start?" [level=3] [ref=e247]
        - paragraph [ref=e248]: The strategy for starting MCP development for model management is a incremental step by step approach.
        - paragraph [ref=e249]: First, the basic development environment is setup with the required system variables, and a working Antigravity CLI configuration.
        - paragraph [ref=e250]: Then, a minimal Python MCP Server is built with stdio transport. This server is validated with Antigravity CLI in the local environment.
        - paragraph [ref=e251]: This setup validates the connection from Antigravity CLI to the local server via MCP. The MCP client (Antigravity CLI) and the Python MCP server both run in the same local environment.
