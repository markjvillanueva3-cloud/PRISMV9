        - heading "Model Lifecycle Management via MCP" [level=3] [ref=e354]
        - paragraph [ref=e355]: The MCP tools provide a complete suite of agent-oriented operations for managing vLLM deployment on Cloud Run or a TPU.
        - paragraph [ref=e356]: "Overview of MCP tools :"
        - generic [ref=e358]:
          - text: "> get mcp tools"
          - text: ● gpu-6000-devops-agent/get_help(MCP Help Retrieval) (ctrl+o to expand)
          - text: "Here are the MCP tools available from the gpu-6000-devops-agent server:"
          - text: "### 🐳 Infrastructure & Deployment"
          - text: "• deploy_vllm : Deploys vLLM to Cloud Run GPU."
          - text: "• destroy_vllm : Deletes the Cloud Run vLLM service."
          - text: "• status_vllm : Checks the status of the Cloud Run vLLM service."
          - text: "• update_vllm_scaling : Updates min/max instances for scaling."
          - text: "• get_vllm_deployment_config : Generates the gcloud deployment command."
          - text: "• get_vllm_gpu_deployment_config : Generates a GKE manifest for GPU (NVIDIA L4)."
          - text: "• check_gpu_quotas : Checks L4 and other GPU quotas for a region."
          - text: "### 📊 Model Management"
          - text: "• list_vertex_models : Lists models in the Vertex AI Registry."
          - text: "• list_bucket_models : Lists model weights in GCS bucket."
          - text: "• save_hf_token : Securely saves a Hugging Face API token to Secret Manager."
          - text: "• get_vertex_ai_model_copy_instructions : Instructions to copy model from Vertex AI Model Garden to GCS."
          - text: "• get_huggingface_model_copy_instructions : Instructions to download model from Hugging Face and upload to GCS."
          - text: "• get_huggingfacehub_download_path : Resolves local cache path using huggingface_hub ."
          - text: "### 📊 Monitoring & Status"
          - text: "• get_system_status : Provides a high-level status dashboard of the Cloud Run service and health."
          - text: "• get_endpoint : Verifies connectivity and returns the active service URL."
          - text: "• get_model_details : Retrieves detailed model metadata and engine state from /v1/models ."
          - text: "• verify_model_health : Deep health check by querying the model with a simple prompt and measuring latency."
          - text: "### 📈 Performance & Benchmarking"
          - text: "• run_benchmark : Runs performance/concurrency benchmark sweeps against the Cloud Run vLLM GPU endpoint."
          - text: "### 💬 Interaction & Diagnostics"
          - text: "• query_gemma4 : Primary tool to query the self-hosted model with standard chat message format."
          - text: "• query_gemma4_with_stats : Queries the model and returns streaming performance statistics (TTFT, throughput)."
          - text: "• query_vllm : Direct text completions querying tool."
          - text: "• analyze_cloud_logging : Fetches logs from GCP Logging and analyzes them using the model."
          - text: "• analyze_gpu_logs : Fetches Cloud Run logs and uses Gemma 4 to analyze them for SRE/DevOps errors."
          - text: "• suggest_sre_remediation : Suggests remediation plans for SRE errors using the model."
