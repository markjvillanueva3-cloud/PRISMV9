                        - 'heading "Layer 3: Community plug-ins worth knowing" [level=2] [ref=e601]':
                          - generic [ref=e603]: "Layer 3: Community plug-ins worth knowing"
                        - generic [ref=e606]: If none of the official 8 fits your use case, or if you want even more on top, the community has built another layer of memory tooling for Hermes. About five of these are production-quality enough to consider seriously, plus a longer tail of experiments to keep eyes on.
                        - generic [ref=e609]: "Two things to know up front about Layer 3:"
                        - list [ref=e610]:
                          - listitem [ref=e611]:
                            - generic [ref=e612]:
                              - generic [ref=e613]: Not every Layer 3 project competes with Layer 2.
                              - generic [ref=e614]: Some are alternative MemoryProvider plug-ins you'd pick instead of one of the official 8 (Mnemosyne is the clearest example). Others occupy a different role entirely - they store a different
                              - generic [ref=e615]: type
                              - generic [ref=e616]: of memory and run alongside your Layer 2 provider, not in place of it (GBrain is the clearest example, storing world facts about people, companies, and projects in a separate brain layer while your Layer 2 provider handles operational memory).
                          - listitem [ref=e617]:
                            - generic [ref=e618]:
                              - generic [ref=e619]: You give up polish to get capability.
                              - generic [ref=e620]: The official 8 ship with Nous's review and tend to "just work." Community plug-ins are typically a bit rougher on the install, have fewer docs, and more chance of hitting a bug. But they unlock things the official set doesn't offer like fully-local sub-millisecond retrieval (Mnemosyne), a markdown-and-Postgres knowledge graph that builds itself with zero LLM calls (GBrain), explainable retrieval rankings (yantrikdb), and cross-agent memory portability (PLUR).
                        - generic [ref=e623]: "The safe path if you're committing to a memory stack for real work: start with one of the official 8 and only reach for Layer 3 when you've identified a specific capability gap a community project fills. The standouts below are GBrain and Mnemosyne."
                        - generic [ref=e625]:
                          - link "GBrain" [ref=e627] [cursor=pointer]:
                            - /url: https://hermesatlas.com/projects/garrytan/gbrain
                            - generic [ref=e628]: GBrain
                          - generic [ref=e629]: (by
                          - link "garrytan" [ref=e631] [cursor=pointer]:
                            - /url: https://x.com/garrytan
                            - generic [ref=e632]: garrytan
                          - generic [ref=e633]: ) -
                          - generic [ref=e634]: this is what I personally use
                        - generic [ref=e636]:
                          - generic [ref=e637]: Open-sourced in April, MIT licensed, ~18k+ stars. TypeScript. Built by Garry Tan to run his own production agents.
                          - generic [ref=e638]: GBrain is structurally different from the official 8.
                          - generic [ref=e639]: GBrain does not subclass MemoryProvider, it plugs in as
                          - generic [ref=e640]: skillpack + MCP server
                          - generic [ref=e641]: "(~30 MCP tools), and occupys a different ontological slot. The explicit doctrine in docs/guides/brain-vs-memory.md:"
                        - generic [ref=e644]: "What makes it special:"
                        - list [ref=e645]:
                          - listitem [ref=e646]:
                            - generic [ref=e648]: "Not just RAG: a full 8-layer knowledge engine for dramatically better memory and recall"
                          - listitem [ref=e649]:
                            - generic [ref=e651]: "Epistemology layer: tracks “who said what, when, and with what confidence” so no more hallucinated facts or lost context"
                          - listitem [ref=e652]:
                            - generic [ref=e654]: "Self-wiring knowledge graph: automatically extracts entities and creates real relationships (e.g., “attended,” “works_at,” “invested_in,” “founded”) with zero extra LLM calls"
                          - listitem [ref=e655]:
                            - generic [ref=e657]: "Dream cycles for autonomous synthesis: runs overnight (or on-demand) so your brain literally gets smarter while you sleep"
                          - listitem [ref=e658]:
                            - generic [ref=e660]: "Hybrid search done right: combines vector, keyword, RRF fusion, multi-query expansion, cosine reranking, compiled-truth boost, and backlink boost for far more accurate results than plain vector search"
                          - listitem [ref=e661]:
                            - generic [ref=e663]: "Specialized + versioned chunking: recursive markdown chunker (v4) that intelligently handles code blocks, frontmatter, transcripts, etc. so edits don’t break memory"
                          - listitem [ref=e664]:
                            - generic [ref=e666]: "Autonomous enrichment + persistent personal memory: tiered enrichment based on how often something is mentioned turning Hermes agent into a “clairvoyant” personal AI that actually knows you"
                        - generic [ref=e669]: Why pick GBrain over the official 8? If you want a graph cheap, git as system of record, overnight maintenance, you already have a markdown vault (migration covers Obsidian / Logseq / Notion / Roam), or you're building a "company of agents."
                        - generic [ref=e671]:
                          - link "Mnemosyne" [ref=e673] [cursor=pointer]:
                            - /url: https://hermesatlas.com/projects/AxDSan/mnemosyne
                            - generic [ref=e674]: Mnemosyne
                          - generic [ref=e676]: (AxDSan/mnemosyne)
                        - generic [ref=e679]: The strongest community alternative when you want a real MemoryProvider plug-in (rather than GBrain, which plays a different role). Runs entirely on your machine - no cloud, no API key, no internet - and recall is fast enough to feel instant (under 2 milliseconds in published tests).
                        - generic [ref=e681]:
                          - generic [ref=e682]: What makes Mnemosyne interesting is its
                          - generic [ref=e683]: tiered memory architecture
                          - generic [ref=e684]: ", modeled loosely on how humans handle short-term vs long-term memory. There's a \"working\" tier for what's actively relevant right now, an \"episodic\" tier for time-stamped events you might want to look up later, and a \"scratchpad\" for things still being considered for promotion. A consolidation pass runs periodically in the background to move useful items into long-term memory and prune the noise."
                        - generic [ref=e686]:
                          - generic [ref=e687]: "The standout feature for serious users:"
                          - generic [ref=e688]: memory has a sense of time
                          - generic [ref=e689]: . You can ask "what did I believe about X last Tuesday?" and get back the agent's understanding
                          - generic [ref=e690]: as it was at that point
                          - generic [ref=e691]: ", not as it is today. No other Hermes plug-in does this as cleanly. One soft adoption signal worth noticing: Mnemosyne is the only community memory plug-in that someone has bothered to write a dedicated Hermes skill wrapper for (a small file that teaches the agent how to use it intelligently). Nobody's done that for the others."
                        - generic [ref=e694]: Others worth knowing about
                        - list [ref=e695]:
                          - listitem [ref=e696]:
                            - generic [ref=e697]:
                              - link "Ladybug Memory" [ref=e699] [cursor=pointer]:
                                - /url: https://github.com/Ladybug-Memory/hermes-memory-plugin
                                - generic [ref=e700]: Ladybug Memory
                              - generic [ref=e701]: "- the local-only option with built-in importance ranking. Every memory gets a score from 1 to 10 so the system surfaces the things that matter first instead of treating everything equally. Pick it if you want fully-local memory and the built-in MEMORY.md cap is too small for your knowledge."
                          - listitem [ref=e702]:
                            - generic [ref=e703]:
                              - link "yantrikdb" [ref=e705] [cursor=pointer]:
                                - /url: https://github.com/yantrikos/yantrikdb-hermes-plugin
                                - generic [ref=e706]: yantrikdb
                              - generic [ref=e708]: "- he one to pick when"
                              - generic [ref=e709]: you need to know why the agent recalled what it did
                              - generic [ref=e710]: . Every retrieval comes back with a "why retrieved" explanation, which is useful for debugging when the agent surfaces the wrong thing or for high-trust contexts where you need to audit what's shaping the agent's responses. Runs embedded out of the box, no separate database to manage.
                          - listitem [ref=e711]:
                            - generic [ref=e712]:
                              - link "hermes-agentmemory" [ref=e714] [cursor=pointer]:
                                - /url: https://github.com/MukundaKatta/hermes-agentmemory
                                - generic [ref=e715]: hermes-agentmemory
                              - generic [ref=e716]: "- a community fix for a real Hermes problem: when you tell the agent to forget something, it doesn't actually forget - it keeps an internal summary that quietly influences future recall. This provider does"
                              - generic [ref=e717]: real deletion
                              - generic [ref=e718]: (gone is gone) and logs every memory operation so you can audit what happened. Pick it if compliance, privacy, or user-controlled forgetting matters.
                          - listitem [ref=e719]:
                            - generic [ref=e720]:
                              - link "PLUR" [ref=e722] [cursor=pointer]:
                                - /url: https://hermesatlas.com/projects/plur-ai/plur
                                - generic [ref=e723]: PLUR
                              - generic [ref=e724]: "- the cross-agent memory bridge. Hermes memory normally doesn't reach Cursor, and Cursor's doesn't reach Claude Code. PLUR stores everything in a shared .plur/ folder that all of them can read, so a fact you teach one agent automatically shows up in the others. Pick it if you work across multiple agents on the same project and don't want to teach each one separately."
                          - listitem [ref=e725]:
                            - generic [ref=e726]:
                              - link "FlowState-QMD" [ref=e728] [cursor=pointer]:
                                - /url: https://github.com/amanning3390/flowstate-qmd
                                - generic [ref=e729]: FlowState-QMD
                              - generic [ref=e730]: "- The \"guess what you'll need next\" provider. It tries to predict the agent's next likely query and warms up that memory in advance, so by the time the agent actually searches, the result is already cached and responses come back faster. Pick it if your agent does repetitive long-horizon work where the next step is usually guessable from context."
                        - generic [ref=e732]:
                          - generic [ref=e733]: "One thing I expected to find that doesn't exist:"
                          - generic [ref=e734]: memory-as-skill is effectively a non-pattern.
                          - generic [ref=e735]: The
                          - link "agentskills.io" [ref=e737] [cursor=pointer]:
                            - /url: //agentskills.io
                            - generic [ref=e738]: agentskills.io
                          - generic [ref=e739]: standard means a "skill" could in principle implement memory. In practice all credible persistent memory flows through the MemoryProvider ABC. Even skills that "do memory" (the Mnemosyne SKILL.md, for instance) are wrappers around plug-ins, telling the agent how to use them.
                        - heading "How to actually pick?" [level=2] [ref=e741]:
                          - generic [ref=e743]: How to actually pick?
                        - generic [ref=e746]: "Step 1: pick your layer strategy"
                        - link "Image" [ref=e753] [cursor=pointer]:
                          - /url: /KSimback/article/2058262328496554021/media/2058260514107498496
                          - generic "Image" [ref=e757]:
                            - img "Image" [ref=e759]
                        - generic [ref=e762]: "Step 2: pick your layer 2 system"
                        - link "Image" [ref=e769] [cursor=pointer]:
                          - /url: /KSimback/article/2058262328496554021/media/2058260871122415616
                          - generic "Image" [ref=e773]:
                            - img "Image" [ref=e775]
                        - generic [ref=e778]: "Warning signs you went too heavy:"
                        - list [ref=e779]:
                          - listitem [ref=e780]:
                            - generic [ref=e781]:
                              - generic [ref=e782]: The agent feels noticeably slower.
                              - generic [ref=e783]: Responses that used to come back in about a second now take 3+ seconds. A heavy memory layer adds work on every turn, and once latency creeps past a few seconds the agent stops feeling responsive.
                          - listitem [ref=e784]:
                            - generic [ref=e785]:
                              - generic [ref=e786]: Your API bill is creeping up for the same usage.
                              - generic [ref=e787]: Memory operations consume tokens, and some providers fire extra background LLM calls every time you save something. If your usage patterns haven't changed but your spend has, suspect the memory layer.
                          - listitem [ref=e788]:
                            - generic [ref=e789]:
                              - generic [ref=e790]: The agent starts contradicting itself.
                              - generic [ref=e791]: It recalls one version of a fact in one session and the opposite in the next, and can't tell you which is right. This usually means memory is accumulating without ever being consolidated - the agent is now drawing from a polluted well.
                          - listitem [ref=e792]:
                            - generic [ref=e793]:
                              - generic [ref=e794]: The agent runs out of context mid-conversation.
                              - generic [ref=e795]: A greedy memory layer eats into the same context budget your actual conversation needs. If you start seeing "context too long" errors, or the agent forgets what you told it five minutes ago, the memory layer is overspending its share.
                          - listitem [ref=e796]:
                            - generic [ref=e797]:
                              - generic [ref=e798]: Your work isn't actually getting better.
                              - generic [ref=e799]: This is the one that matters most. You added memory expecting more accurate, more personalized output. After a couple of weeks, can you point at a specific way the agent is genuinely better than before? If you can't, the memory layer isn't earning its complexity. Pull it.
