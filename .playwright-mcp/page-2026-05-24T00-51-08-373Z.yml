                      - generic [ref=e222]:
                        - blockquote [ref=e223]:
                          - generic [ref=e225]: "TLDR: this is your definitive guide to all things related to memory systems for Hermes Agent. Why create this? Because every week I see new posts or articles describing some new memory tool for Hermes agents and these make me question if my memory setup is the best. So I dug into all of them and broke it down for you."
                        - separator [ref=e227]
                        - generic [ref=e229]:
                          - generic [ref=e230]: Over the past few months my Hermes agent has been mapping the Hermes ecosystem over at
                          - link "hermesatlas.com" [ref=e232] [cursor=pointer]:
                            - /url: https://hermesatlas.com/
                            - generic [ref=e233]: hermesatlas.com
                          - generic [ref=e234]: . One of the key areas it has covered is memory and it even has a dedicated section for it.
                        - generic [ref=e237]:
                          - link "Image" [ref=e241] [cursor=pointer]:
                            - /url: /KSimback/article/2058262328496554021/media/2058205500353679360
                            - generic "Image" [ref=e245]:
                              - img "Image" [ref=e247]
                          - link "hermesatlas.com" [ref=e258] [cursor=pointer]:
                            - /url: //hermesatlas.com
                            - generic [ref=e259]: hermesatlas.com
                        - generic [ref=e262]: And let's be honest, there are a LOT of memory related tools available and there are a LOT of write-ups about them. I see new articles on X every week about some new memory setup. It's hard to keep up, and even harder to know if you're doing it all wrong because they all make claims about how certain memory systems are better than others.
                        - generic [ref=e265]: But many of these write-ups skip the architecture (how memory works in Hermes) or conflate different elements of the memory stack. This article is the culmination of everything I've learned about Hermes agent memory and a guide to help you navigate what makes most sense for your setup.
                        - heading "Memory is arguably the most important element of an agent setup" [level=2] [ref=e267]:
                          - generic [ref=e269]: Memory is arguably the most important element of an agent setup
                        - generic [ref=e272]: Without memory, an agent is just a stateless function and no different than a blank ChatGPT window. Every prompt looks like the first prompt. That works for one-shot questions but breaks down the moment you have a use case that needs to know what happened yesterday, remember your preferences, accumulate skills from prior tasks, or coordinate with another agent.
                        - generic [ref=e275]: A coding session that doesn't remember the conventions you established last Tuesday will reinvent them this Tuesday. A personal assistant agent that doesn't remember your preferences has to ask you the same repeated questions. Without memory, an agent really isn't an agent at all.
                        - generic [ref=e278]: Memory is what turns an chatbot into something that compounds. Which is why every serious agent harness - OpenClaw, Claude Code, Codex, and our beloved Hermes - has memory primitives built in, and why a real product category has emerged around dedicated memory infrastructure or agents (Mem0 raised $24M, Letta $10M, plus Zep, Cipher, Supermemory, Hindsight, etc.).
                        - generic [ref=e280]:
                          - generic [ref=e281]: The Hermes Agent take is interesting because
                          - link "Nous Research" [ref=e283] [cursor=pointer]:
                            - /url: https://x.com/NousResearch
                            - generic [ref=e284]: Nous Research
                          - generic [ref=e285]: treats memory as
                          - generic [ref=e286]: first-class plug-in infrastructure
                          - generic [ref=e287]: ", not a feature. There's a base layer that always runs, a pluggable provider system that lets you choose from 8 architectures (or write your own), and a healthy community plug-in layer on top."
                        - generic [ref=e290]: That 3-layer stack is what I will explore in depth in this article.
                        - heading "Hermes Agent memory architecture at a glance" [level=2] [ref=e292]:
                          - generic [ref=e294]: Hermes Agent memory architecture at a glance
                        - link "Image" [ref=e301] [cursor=pointer]:
                          - /url: /KSimback/article/2058262328496554021/media/2058210419768979456
                          - generic "Image" [ref=e305]:
                            - img "Image" [ref=e307]
                        - generic [ref=e310]: Here's what each layer means for you as a Hermes user.
                        - generic [ref=e312]:
                          - generic [ref=e313]: Layer 1 - what ships in the box.
                          - generic [ref=e314]: You get this whether you do anything or not. Two small markdown files the agent uses as its always-visible notebook, plus a local database that archives every session you've ever had. No setup, no config. For many use cases, this is often all you need.
                        - generic [ref=e316]:
                          - generic [ref=e317]: Layer 2 - the optional plug-in slot.
                          - generic [ref=e318]: When you outgrow the native layer (you want semantic recall across sessions, or a system that models your preferences, or token-efficient retrieval at scale) you pick one of 8 official providers. They each take a different architectural bet about what memory should do, and you can run exactly one at a time. Switching providers is a clean start - the new provider doesn't inherit the old one's data, but the Layer 1 native files keep running underneath either way.
                        - generic [ref=e320]:
                          - generic [ref=e321]: Layer 3 - what the community builds beyond the official 8.
                          - generic [ref=e322]: Two flavors. Some community projects are MemoryProvider plug-ins that compete head-to-head with the Layer 2 picks (Mnemosyne is the standout - fully local, sub-millisecond, with a real tiered cognitive architecture). Others sit alongside the official providers in a different slot entirely (GBrain is the standout here - it stores world facts like people, companies, and projects in a markdown vault, while your Layer 2 provider handles operational memory). Layer 3 usually means more setup and less polish than the official 8, but it's where you go when you need a capability the eight providers don't offer.
                        - generic [ref=e325]: The layers stack rather than replace each other. Switching the Layer 2 provider does not wipe Layer 1. Each provider has its own store, but the native session database and the two markdown files keep running underneath. Layer 3 plug-ins are additive on top of both.
                        - 'heading "Layer 1: Native - what you get out of the box" [level=2] [ref=e327]':
                          - generic [ref=e329]: "Layer 1: Native - what you get out of the box"
                        - generic [ref=e332]: "The native layer is three things that ship with every Hermes install: two small markdown files and one database. They play different roles, and it's worth understanding each before we get to the plug-in providers."
                        - generic [ref=e335]: "Note: if you already understand the out of box setup or want to skip to the optional stuff you can install on top, go to Layer 2."
                        - generic [ref=e338]: The two markdown files
                        - generic [ref=e341]: "When you install Hermes, it creates two text files in your home directory at ~/.hermes/:"
                        - blockquote [ref=e342]:
                          - generic [ref=e343]:
                            - generic [ref=e344]: MEMORY.md
                            - generic [ref=e345]: "- the agent's general knowledge notebook. Project context, technical decisions, things worth remembering across sessions. Capped at about 2,200 characters, roughly a paragraph and a half."
                            - generic [ref=e346]: USER.md
                            - generic [ref=e347]: "- what the agent knows about you specifically. Your preferences, your working style, your role. Capped at about 1,375 characters, roughly one paragraph."
                        - generic [ref=e350]: You can open both files in any text editor. They're plain markdown. You can even edit them by hand if you want, and the agent will read your edits next session.
                        - generic [ref=e353]: The reason they're so small is that they aren't the agent's filing cabinet - they're the agent's sticky notes. At the start of every session, Hermes pastes the entire contents of both files into the prompt sent to the model. So everything in these files is always "in front of" the agent. No retrieval needed, it just sees them.
                        - generic [ref=e356]: "The agent itself decides what goes into these files. When something important comes up in a session - you say \"I prefer bullet points instead of paragraphs\" or the agent figures out that you use Vercel for deployments - the agent calls a tool called memory with one of three actions: add, replace, or remove. There's no read action because the files are already pasted into the prompt; the agent reads them by virtue of looking at its own context."
                        - generic [ref=e359]: What happens when the files fill up?
                        - generic [ref=e362]: "This is where most third-party write-ups get things wrong. They claim Hermes automatically consolidates the files when they hit 80% of the cap. I went into the code at agent/memory_manager.py to verify, and the actual behavior is more interesting:"
                        - generic [ref=e364]:
                          - generic [ref=e365]: There is no automatic consolidation - the 80% rule is a
                          - generic [ref=e366]: prompt instruction
                          - generic [ref=e367]: ", not code. The system prompt header shows the agent a real-time fill gauge - something like \"MEMORY: 1,847/2,200 chars (84 percent)\" - along with the instruction"
                          - generic [ref=e368]: "\"when memory is above 80% capacity, consolidate entries before adding new ones.\""
                          - generic [ref=e369]: The agent reads that, and the agent decides whether to act on it. If the file is already at the cap and the agent tries to add anything anyway, the memory tool returns an error listing the current entries and forces the agent to free space via replace or remove first.
                        - generic [ref=e371]:
                          - generic [ref=e372]: This is a deliberate design choice. Nous trusts the model to manage its own notebook. The upside is full agent control, but the downside is also full agent control
                          - generic [ref=e373]: .
                          - generic [ref=e374]: A poorly-prompted agent can sit at the cap indefinitely, refusing every new add call and quietly losing information that should have replaced something older, but I'm confident this gets resolved soon as there's some PRs around this.
                        - generic [ref=e376]:
                          - generic [ref=e377]: "A related point of confusion worth clearing up before we go on: v0.12 introduced something called the \"Autonomous Curator\" and many write-ups describe it as automatic memory management."
                          - generic [ref=e378]: It is not.
                          - generic [ref=e379]: The Curator operates only on the agent's
                          - generic [ref=e380]: skill library
                          - generic [ref=e381]: at ~/.hermes/skills/ - moving skills from active to stale to archived based on usage. It never touches MEMORY.md or USER.md.
                        - generic [ref=e384]: The database (and how it relates to the markdown files)
                        - generic [ref=e387]: The two markdown files are the agent's always-visible notes. The database is the agent's full archive of everything that has ever happened.
                        - generic [ref=e390]: Hermes stores every session in a SQLite database file at ~/.hermes/hermes_state.db. Every user message, every agent response, every tool call, every reasoning step, plus economic data like token counts and dollar cost per session - all of it lands here. Default retention is 90 days; older sessions get pruned automatically every 24 hours unless you change the setting.
                        - generic [ref=e392]:
                          - generic [ref=e393]: This database is
                          - generic [ref=e394]: not auto-injected into prompts
                          - generic [ref=e395]: . It would be enormous - imagine pasting your entire chat history into every new conversation. Instead, the agent searches it on demand when it needs to find something specific.
                        - generic [ref=e398]: "The search uses SQLite's built-in full-text search (FTS5), and Hermes maintains two parallel indexes: one for normal word-level search (\"did we discuss the content strategy?\") and one for trigram search that handles substrings and code tokens (\"find every session where I mentioned github\")."
                        - generic [ref=e401]: "So the mental model is:"
                        - blockquote [ref=e402]:
                          - generic [ref=e403]:
                            - generic [ref=e404]: The two markdown files = what the agent
                            - generic [ref=e405]: always has in its head
                            - generic [ref=e406]: . Small, curated, always present in every prompt. The session database = what the agent
                            - generic [ref=e407]: can look up if it knows what to look for
                            - generic [ref=e408]: . Huge, raw, searchable on demand.
                        - generic [ref=e411]: These are complementary, not redundant. When something matters across all future sessions, the agent should write it to MEMORY.md so it's always present. When something might matter again but doesn't need to be top-of-mind, it lives in the session database and gets pulled up only when the agent searches for it.
                        - generic [ref=e413]:
                          - generic [ref=e414]: "A nice side-effect of the database design: because Hermes captures every reasoning step and every tool call with full economic data, the database is also a"
                          - generic [ref=e415]: complete training trajectory
                          - generic [ref=e416]: if you ever want to export it. This is beyond the scope of this article but something that aligns with my thesis on
                          - link "where the moats are in agents" [ref=e418] [cursor=pointer]:
                            - /url: https://x.com/compose/articles/edit/2044821377530597376
                            - generic [ref=e419]: where the moats are in agents
                          - generic [ref=e420]: .
                        - 'heading "Layer 2: The pluggable \"MemoryProvider\" system" [level=2] [ref=e422]':
                          - generic [ref=e424]: "Layer 2: The pluggable \"MemoryProvider\" system"
                        - generic [ref=e426]:
                          - generic [ref=e427]: This is the layer that lets you
                          - generic [ref=e428]: graduate
                          - generic [ref=e429]: from "small notebook plus searchable archive" to a real memory system - one that extracts facts from your conversations automatically, builds a profile of you, supports semantic recall across sessions, or handles a large knowledge graph.
                        - generic [ref=e431]:
                          - generic [ref=e432]: Setting this up is quite simple - you run "hermes memory setup", pick a provider from the menu, and from then on the agent has a richer memory layer to draw from on top of the native files.
                          - generic [ref=e433]: "Note: some providers require API keys and paid plans."
                        - generic [ref=e435]:
                          - generic [ref=e436]: The important note is
                          - generic [ref=e437]: you can only run one provider at a time
                          - generic [ref=e438]: . Hermes treats this as a single deliberate choice, not a stack of bolt-ons.
                        - generic [ref=e441]: That keeps your tool surface clean - each provider exposes its own set of agent tools, and the agent would get confused if there were three competing "search memory" tools sitting in front of it - and it makes the configuration easy to reason about. The Layer 1 native files keep running underneath whether you have a provider active or not.
                        - generic [ref=e443]:
                          - generic [ref=e444]: Picking the right provider matters because they make very different architectural bets. Some are aggressive at extracting facts. Some build a model of how you
                          - generic [ref=e445]: think
                          - generic [ref=e446]: rather than what you said. Some are obsessed with token efficiency. Some are graph-first. The full decision tree is later in this article; the technical mechanics below are for readers who want to know what providers actually plug into.
                        - generic [ref=e449]: Let's dive in.
                        - heading "The 8 Official Providers" [level=2] [ref=e451]:
                          - generic [ref=e453]: The 8 Official Providers
                        - generic [ref=e455]:
                          - link "Honcho (Plastic Labs)" [ref=e457] [cursor=pointer]:
                            - /url: https://hermesatlas.com/projects/plastic-labs/honcho
                            - generic [ref=e458]: Honcho (Plastic Labs)
                          - generic [ref=e459]: "-"
                          - generic [ref=e460]: AI-native dialectic user modeling
                        - generic [ref=e462]:
                          - generic [ref=e463]: The only provider in the lineup that tries to model
                          - generic [ref=e464]: how you think
                          - generic [ref=e465]: ", not just what you said. Instead of storing flat facts like \"Kevin uses 4-space indents,\" Honcho runs a multi-step reasoning pass after your conversations to build a profile of your reasoning patterns, preferences, and goals."
                        - generic [ref=e467]:
                          - generic [ref=e468]: That profile evolves over time, so the agent gets better at anticipating what you'd want even on topics you've never discussed. It also lets multiple "AI identities" share the same view of you - useful if you run different specialist agents for coding, writing, and strategy and want all of them to know your style. Most-cited favorite in the Hermes Discord (
                          - link "@offendingcommit" [ref=e470] [cursor=pointer]:
                            - /url: https://x.com/@offendingcommit
                            - generic [ref=e471]: "@offendingcommit"
                          - generic [ref=e472]: ":"
                          - generic [ref=e473]: "\"I've tried them all... I freakin' love Honcho.\""
                          - generic [ref=e474]: ).
                        - generic [ref=e476]:
                          - link "Mem0" [ref=e478] [cursor=pointer]:
                            - /url: https://hermesatlas.com/projects/mem0ai/mem0
                            - generic [ref=e479]: Mem0
                          - generic [ref=e480]: "-"
                          - generic [ref=e481]: fastest 30-second setup, broadest ecosystem
                        - generic [ref=e483]:
                          - generic [ref=e484]: The "
                          - generic [ref=e485]: just give me memory and stop asking questions
                          - generic [ref=e486]: "\" pick. You sign up for Mem0 cloud, paste an API key, and you're done - the provider extracts facts from conversations, deduplicates them, and serves up semantic search automatically in the background."
                        - generic [ref=e489]: It's also the exclusive memory provider for AWS's Strands Agents SDK, which gives it the widest ecosystem reach in the lineup. In April 2026 Mem0 shipped a "v3" algorithm claiming to leapfrog Hindsight on benchmarks (94.8 on LongMemEval, 91.6 on LoCoMo).
                        - generic [ref=e491]:
                          - link "Hindsight" [ref=e493] [cursor=pointer]:
                            - /url: https://hermesatlas.com/projects/vectorize-io/hindsight
                            - generic [ref=e494]: Hindsight
                          - generic [ref=e495]: (
                          - link "Vectorize.io" [ref=e497] [cursor=pointer]:
                            - /url: //Vectorize.io
                            - generic [ref=e498]: Vectorize.io
                          - generic [ref=e499]: ) -
                          - generic [ref=e500]: the benchmark king
                        - generic [ref=e502]:
                          - generic [ref=e503]: The first memory system of any kind to publicly cross 90 on LongMemEval
                          - generic [ref=e504]: (91.4, December 2025). Hindsight thinks about memory as four separate networks - things about the world, things that happened, opinions, and raw observations - and pulls only a handful of high-value facts from each conversation (2 to 5, not one per sentence).
                        - generic [ref=e507]: When you ask it something, it runs four different retrieval strategies in parallel - keyword search, vector similarity, graph traversal across related entities, and a recency pass - then fuses the results. That's how it gets the best recall accuracy in the published lineup.
                        - generic [ref=e510]: It's also the only provider with a reflect tool that lets the agent run a reasoning pass over its own memory. That's uniquely valuable if you're running multiple agents on a shared memory bank and you need an orchestrator to synthesize what all of them know.
                        - generic [ref=e512]:
                          - link "Holographic" [ref=e514] [cursor=pointer]:
                            - /url: https://github.com/NousResearch/hermes-agent/tree/main/plugins/memory/holographic
                            - generic [ref=e515]: Holographic
                          - generic [ref=e516]: "-"
                          - generic [ref=e517]: zero-dependency, fully local, air-gapped
                        - generic [ref=e519]:
                          - generic [ref=e520]: The only provider in the lineup that needs no internet, no API key, and no LLM to function.
                          - generic [ref=e521]: Everything lives in a local SQLite file. It uses a 1991-era technique called Holographic Reduced Representations to do compositional reasoning over facts - you can bind concepts together algebraically and probe for related ones later. Retrieval is sub-millisecond because it's pure local SQL.
                        - generic [ref=e523]:
                          - link "OpenViking" [ref=e525] [cursor=pointer]:
                            - /url: https://openviking.ai/
                            - generic [ref=e526]: OpenViking
                          - generic [ref=e527]: "-"
                          - generic [ref=e528]: tiered filesystem context DB
                        - generic [ref=e531]: "Your memory lives as files in a directory tree on your disk. You can cat them, grep them, edit them by hand. Each piece of stored knowledge has three loading tiers: a one-sentence summary, a paragraph-level overview, and the full content."
                        - generic [ref=e534]: When the agent recalls something, it starts cheap (summaries only) and only loads the deeper tiers if the summary looks relevant. That structure is important if you're cost-sensitive at scale or you want memory you can read and edit like normal files.
                        - generic [ref=e536]:
                          - link "RetainDB" [ref=e538] [cursor=pointer]:
                            - /url: https://www.retaindb.com/
                            - generic [ref=e539]: RetainDB
                          - generic [ref=e540]: "-"
                          - generic [ref=e541]: cheapest paid tier, lowest friction
                        - generic [ref=e544]: "$20/month for 100,000 queries, with a free tier of 10,000 operations to test. The only provider in the lineup that's cloud-only at every price point (no self-host even on enterprise). The hook is convenience: you operate no infrastructure, RetainDB handles everything, and there's a \"Memory Router\" mode that intercepts your LLM calls and adds memory transparently with one config line."
                        - generic [ref=e547]: Pick this option if you want shared memory across team members or agents and you don't want to operate a database.
                        - generic [ref=e549]:
                          - link "ByteRover" [ref=e551] [cursor=pointer]:
                            - /url: https://docs.byterover.dev/autonomous-agents/hermes
                            - generic [ref=e552]: ByteRover
                          - generic [ref=e553]: "-"
                          - generic [ref=e554]: memory as a git repo
                        - generic [ref=e557]: Your memory is plain markdown files in a .brv/context-tree/ directory - grep-able, version-controllable, no database to run. ByteRover layers a 5-tier retrieval system on top, and four of those tiers don't need an LLM call, so most lookups finish in under 100ms with zero token spend.
                        - generic [ref=e559]:
                          - generic [ref=e560]: "The key selling point:"
                          - generic [ref=e561]: you can branch, merge, and roll back memory like code
                          - generic [ref=e562]: with CLI commands. It also uses a special hook to extract high-value insights
                          - generic [ref=e563]: before
                          - generic [ref=e564]: "Hermes compresses context, which is the cleanest fix in the lineup for the \"agent loses memory after restart\" failure mode (noted in issue #17251)."
