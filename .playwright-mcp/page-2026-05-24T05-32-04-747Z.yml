                        - heading "Claude Agent Teams VS Kimi Agent Swarm Explained" [level=2] [ref=e567]:
                          - generic [ref=e569]: Claude Agent Teams VS Kimi Agent Swarm Explained
                        - generic [ref=e572]: If you're evaluating multi-agent systems, the obvious comparison is Anthropic's Claude Agent Teams. Both promise parallel agent execution, but they solve different problems with different architectures.
                        - generic [ref=e575]: The Origin Divide
                        - list [ref=e576]:
                          - listitem [ref=e577]:
                            - generic [ref=e579]: Claude Agent Teams comes from Anthropic, a US-based AI lab.
                          - listitem [ref=e580]:
                            - generic [ref=e582]: Kimi Agent Swarm comes from Moonshot AI, a Chinese AI company backed by Alibaba and Monolith Management.
                        - blockquote [ref=e583]:
                          - generic [ref=e585]: This matters beyond geography — it shapes the product philosophy. Anthropic built agent teams as an extension of Claude Code, a terminal-based developer tool. Moonshot built Agent Swarm as a general-purpose productivity layer accessible through a web interface
                        - generic [ref=e588]: "Scale: What's Actually Under the Hood"
                        - generic [ref=e591]: Claude Agent Teams have no published hard cap, but practical usage centers around 4–6 agents per session, with some users reporting up to 20 agents in parallel cloud containers.
                        - generic [ref=e594]: The system is designed for focused, multi-role coding workflows.
                        - generic [ref=e597]: "Kimi Agent Swarm publishes explicit ceilings: 300 sub-agents and 4,000 coordinated steps per task."
                        - generic [ref=e600]: This isn't a theoretical limit — it's a documented system boundary that the coordinator respects when decomposing tasks.
                        - generic [ref=e603]: What Each System Actually Excels At
                        - generic [ref=e606]: "Claude Agent Teams shine in software engineering workflows:"
                        - list [ref=e607]:
                          - listitem [ref=e608]:
                            - generic [ref=e610]: Large-scale refactoring across multiple modules
                          - listitem [ref=e611]:
                            - generic [ref=e613]: Parallel code review (security, performance, test coverage simultaneously)
                          - listitem [ref=e614]:
                            - generic [ref=e616]: Multi-service debugging with competing hypotheses
                          - listitem [ref=e617]:
                            - generic [ref=e619]: Cross-layer coordination (frontend + backend + tests moving together)
                          - listitem [ref=e620]:
                            - generic [ref=e622]: Research-heavy coding tasks with parallel exploration
                        - generic [ref=e625]: "Kimi Agent Swarm excels in content-heavy, multi-source workflows:"
                        - list [ref=e626]:
                          - listitem [ref=e627]:
                            - generic [ref=e629]: Deep research across dozens of papers or web sources
                          - listitem [ref=e630]:
                            - generic [ref=e632]: Batch content generation at scale (100 CVs, 30 landing pages, 10 magazine covers)
                          - listitem [ref=e633]:
                            - generic [ref=e635]: Multi-file analysis and synthesis into structured reports
                          - listitem [ref=e636]:
                            - generic [ref=e638]: End-to-end deliverable production (report + dataset + charts + copy)
                          - listitem [ref=e639]:
                            - generic [ref=e641]: Tasks requiring broad coverage rather than deep code inspection
                        - generic [ref=e644]: "Communication Model: Shared Mailbox vs. Central Coordinator"
                        - generic [ref=e647]: In Claude Agent Teams, agents communicate laterally. A backend agent can share findings directly with a frontend agent without the orchestrator relaying the message. This makes teams more autonomous but harder to debug when agents conflict.
                        - generic [ref=e650]: In Kimi Agent Swarm, all outputs flow to the coordinator. There's no direct agent-to-agent communication. This creates a cleaner audit trail and simpler conflict resolution, but it means the coordinator's context window becomes the bottleneck for very large syntheses.
