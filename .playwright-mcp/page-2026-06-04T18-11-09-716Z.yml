                              - generic [ref=e217]:
                                - generic [ref=e218]: Here’s what changed, why it matters, and the complete step-by-step guide to running Hermes Agent on your own computer in about 30 minutes.
                                - generic [ref=e219]: In May NVIDIA published a blog post that should be making more noise than it is.
                              - link "Image" [ref=e226] [cursor=pointer]:
                                - /url: /leopardracer/article/2062142384578654602/media/2062095467085692929
                                - generic "Image" [ref=e230]:
                                  - img "Image" [ref=e232]
                              - generic [ref=e235]: "The headline is about hardware Hermes Agent running on RTX PCs and the new DGX Spark workstation. The actual story underneath is something much bigger. Three things just converged that, taken together, change what’s possible:"
                              - list [ref=e236]:
                                - listitem [ref=e237]:
                                  - generic [ref=e238]:
                                    - generic [ref=e239]: Hermes Agent
                                    - generic [ref=e240]: (Nous Research) an open-source agent framework that creates and refines its own skills from experience. Crossed 140,000 GitHub stars in three months. Now the most-used agent in the world, according to OpenRouter.
                                - listitem [ref=e241]:
                                  - generic [ref=e242]:
                                    - generic [ref=e243]: Qwen 3.6
                                    - generic [ref=e244]: (Alibaba) a new open-weight model where the 35B version outperforms last year’s 120B models, and the 27B matches what used to require 400B parameters. Runs on roughly 20GB of memory.
                                - listitem [ref=e245]:
                                  - generic [ref=e246]:
                                    - generic [ref=e247]: DGX Spark
                                    - generic [ref=e248]: (NVIDIA) a desk-sized workstation with 128GB unified memory and 1 petaflop of AI performance. Purpose-built to run agents continuously, 24/7, locally.
                              - generic [ref=e251]: Pair these three and you get a personal AI agent that lives on your desk (not in a data center), runs continuously (not session-by-session), learns from your workflows and accumulates capability, never sends your data anywhere, and costs roughly $0/month to operate after the hardware.
                              - generic [ref=e253]:
                                - generic [ref=e254]: "The conversation about “where AI is going” usually assumes the answer is cloud. This is the first credible answer that says:"
                                - generic [ref=e255]: actually, maybe not.
                              - generic [ref=e258]: "This article covers two things: (1) why Hermes specifically matters what’s structurally different about it from every other agent framework you’ve heard of, and (2) the complete, current step-by-step guide to running it yourself on your own machine in about 30 minutes."
                              - generic [ref=e260]:
                                - generic [ref=e261]: If you only want the setup steps, jump to the “How to actually run it” section. If you want the
                                - generic [ref=e262]: why
                                - generic [ref=e263]: first the part that makes the setup worth doing read on.
                              - heading "What Hermes actually does (the part that matters)" [level=2] [ref=e265]:
                                - generic [ref=e267]: What Hermes actually does (the part that matters)
                              - generic [ref=e269]:
                                - generic [ref=e270]: Most “AI agents” you’ve heard about are wrappers around an LLM call. You give them a task, they do it, you give them another task, they start from scratch. They forget what worked yesterday. They don’t get better. They’re useful, but they’re not really
                                - generic [ref=e271]: agents
                                - generic [ref=e272]: in any meaningful sense they’re functions with personalities.
                              - generic [ref=e274]:
                                - generic [ref=e275]: "Hermes is different in a specific, technical way:"
                                - generic [ref=e276]: it writes its own skills.
                              - generic [ref=e278]:
                                - generic [ref=e279]: When Hermes completes a complex task say, “research five competitors and produce a comparison” it doesn’t just hand you the output. It saves the
                                - generic [ref=e280]: procedure
                                - generic [ref=e281]: as a skill file on disk. Next time you ask for something similar, it doesn’t start over. It opens its own skill, runs it, and improves it based on what worked and what didn’t.
                              - generic [ref=e284]: This isn’t a marketing claim. Nous Research ships infrastructure that uses DSPy + GEPA (Genetic-Pareto Prompt Evolution) to automatically optimize Hermes’s own skills, tool descriptions, and system prompts. Mutations get evaluated. The best ones get promoted. The improvements are measurable.
                              - generic [ref=e286]:
                                - generic [ref=e287]: "Independent benchmarks back this up: agents running on Hermes with 20+ self-created skills complete similar future tasks roughly"
                                - generic [ref=e288]: 40% faster
                                - generic [ref=e289]: than fresh instances. That’s not “40% better output.” That’s “40% less time and tokens to get the same result.”
                              - generic [ref=e291]:
                                - generic [ref=e292]: The key word in the architecture is
                                - generic [ref=e293]: persistent
                                - generic [ref=e294]: . Hermes runs continuously on your laptop, on a server, on DGX Spark and its memory and skills accumulate. After a month of use, your Hermes is genuinely different from anyone else’s. It knows your codebase. It knows your conventions. It knows how you like things explained.
                              - generic [ref=e297]: "Visually, the difference looks like this:"
                              - link "Image" [ref=e304] [cursor=pointer]:
                                - /url: /leopardracer/article/2062142384578654602/media/2062095638683160576
                                - generic "Image" [ref=e308]:
                                  - img "Image" [ref=e310]
                              - blockquote [ref=e311]:
                                - generic [ref=e313]: "Top: a typical chatbot loses everything between sessions. Bottom: Hermes writes skills from experience and builds memory of your patterns. Capability compounds."
                              - generic [ref=e315]:
                                - generic [ref=e316]: "There’s also a memory architecture worth mentioning: Hermes uses a three-layer system."
                                - generic [ref=e317]: Persistent notes
                                - generic [ref=e318]: (your preferences, project conventions, who’s who in your work life),
                                - generic [ref=e319]: searchable session history
                                - generic [ref=e320]: (everything that’s happened, indexed for retrieval), and
                                - generic [ref=e321]: procedural skills
                                - generic [ref=e322]: (the actual learned workflows). This three-layer model is what other frameworks have been trying to nail down for two years. Hermes shipped one that works.
                              - heading "How Hermes is built" [level=2] [ref=e324]:
                                - generic [ref=e326]: How Hermes is built
                              - generic [ref=e329]: "Here’s the architecture in one picture:"
                              - link "Image" [ref=e336] [cursor=pointer]:
                                - /url: /leopardracer/article/2062142384578654602/media/2062095775161528320
                                - generic "Image" [ref=e340]:
                                  - img "Image" [ref=e342]
                              - blockquote [ref=e343]:
                                - generic [ref=e345]: You talk to Hermes through the CLI or messaging gateways. Hermes orchestrates the work planning, calling tools, writing skills and calls a local model server for inference. Everything persists to ~/.hermes/ on your disk.
                              - generic [ref=e348]: "The three things to notice in the diagram:"
                              - generic [ref=e350]:
                                - generic [ref=e351]: "One:"
                                - generic [ref=e352]: the local model server is a separate piece from Hermes itself. Hermes is the orchestration layer the planner, tool runner, and skill writer. The model (Qwen 3.6 in the recommended setup) does the actual thinking. They’re connected via an OpenAI-compatible API on localhost.
                              - generic [ref=e354]:
                                - generic [ref=e355]: "Two:"
                                - generic [ref=e356]: the skills and memory live in ~/.hermes/. Plain markdown files on disk. You can read them. You can edit them. You can back them up. When Anthropic, OpenAI, or any other company changes their terms tomorrow, none of this changes it’s yours.
                              - generic [ref=e358]:
                                - generic [ref=e359]: "Three:"
                                - generic [ref=e360]: the gateways are optional but transformative. Once you connect Hermes to Telegram or Slack, you stop thinking of it as “a CLI thing on my laptop” and start thinking of it as “my personal AI that I can text from anywhere.”
                              - heading "Why Qwen 3.6 makes this possible" [level=2] [ref=e362]:
                                - generic [ref=e364]: Why Qwen 3.6 makes this possible
                              - generic [ref=e367]: "Here’s the part that gets lost in the announcement: Hermes is model-agnostic. You can point it at GPT, Claude, or any local model. But there’s a reason NVIDIA’s blog post pairs it with Qwen 3.6 specifically."
                              - generic [ref=e370]: "Until very recently, running serious agentic workflows locally meant accepting one of two compromises:"
                              - list [ref=e371]:
                                - listitem [ref=e372]:
                                  - generic [ref=e374]: Use a small fast model and watch the agent fumble multi-step tasks
                                - listitem [ref=e375]:
                                  - generic [ref=e377]: Use a big smart model and accept that one inference cycle takes 90 seconds
                              - generic [ref=e379]:
                                - generic [ref=e380]: Qwen 3.6 changed the math. The 35B model outperforms previous-generation 120B parameter models at roughly
                                - generic [ref=e381]: one-third the memory footprint
                                - generic [ref=e382]: . The 27B dense model matches the accuracy of older 400B parameter models. We’re talking about a 16x improvement in efficiency per intelligence unit in less than a year.
                              - generic [ref=e385]: "What that means in practice: a model smart enough to plan, decompose tasks, write its own skills, and self-correct now fits in 20GB of memory. That’s a high-end consumer GPU. It’s also exactly what a single DGX Spark holds comfortably with room left over for the agent itself."
                              - generic [ref=e388]: This is the gap that closed. Last year, “self-improving local agent” required data center hardware. This year, it doesn’t.
                              - heading "What this means for normal people" [level=2] [ref=e390]:
                                - generic [ref=e392]: What this means for normal people
                              - generic [ref=e394]:
                                - generic [ref=e395]: Most coverage of this announcement is treating it as enterprise news. It’s not. It’s
                                - generic [ref=e396]: consumer infrastructure
                                - generic [ref=e397]: news. Here’s what it means depending on who you are.
                              - generic [ref=e399]:
                                - generic [ref=e400]: "If you’re a knowledge worker:"
                                - generic [ref=e401]: Within 12 months, you’ll be choosing between subscribing to a cloud agent service ($30/month?) and running a comparable local agent on your own hardware ($0 ongoing after setup). For privacy-sensitive work consulting, healthcare, finance, legal it’s becoming the obvious choice.
                              - generic [ref=e403]:
                                - generic [ref=e404]: "If you’re a developer:"
                                - generic [ref=e405]: Hermes is open source under MIT license. You can install it today on your existing laptop and pair it with LM Studio or Ollama running Qwen 3.6. No DGX Spark required. The hardware question is about
                                - generic [ref=e406]: quality of life
                                - generic [ref=e407]: ", not capability. Start with what you have."
                              - generic [ref=e409]:
                                - generic [ref=e410]: "If you’re a founder or operator:"
                                - generic [ref=e411]: This puts pressure on the entire SaaS agentic market. Tools selling “AI-powered X” at $20/month now compete with a local agent that does the same thing for free. The defensible SaaS plays are the ones with networks, data, or workflows that can’t be replicated locally. The vulnerable ones are the ones that are just “Claude with a coat of paint.”
                              - generic [ref=e413]:
                                - generic [ref=e414]: "If you’re in security or regulated industries:"
                                - generic [ref=e415]: The data-sovereignty story for AI just got vastly stronger. Telling someone “you can’t use AI for this work because it sends data to OpenAI” stops being a constraint when a comparable agent runs entirely on-premises.
                              - generic [ref=e418]: Now the part most coverage skips. How to actually run this yourself.
