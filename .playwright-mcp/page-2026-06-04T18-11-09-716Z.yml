                              - heading "What can go wrong (the 5 most common setup issues)" [level=2] [ref=e866]:
                                - generic [ref=e868]: What can go wrong (the 5 most common setup issues)
                              - generic [ref=e870]:
                                - generic [ref=e871]: "Issue 1: “Model context too small” error at startup."
                                - generic [ref=e872]: "Fix: Set context to at least 64K on your model server (see Step 3). This is the single most common failure."
                              - generic [ref=e874]:
                                - generic [ref=e875]: "Issue 2: Hermes can’t connect to your local model."
                                - generic [ref=e876]: "Fix: Confirm your model server is running and accessible. Test with curl <http://localhost:1234/v1/models> (LM Studio) or curl <http://localhost:11434/v1/models> (Ollama). If you get JSON back, the server is fine re-check your Hermes URL configuration."
                              - generic [ref=e878]:
                                - generic [ref=e879]: "Issue 3: WSL2 can’t reach a Windows-host model server."
                                - generic [ref=e880]: "Fix: On Windows 11 22H2+, enable WSL2 mirrored networking mode. Or run your model server inside WSL2 instead of on the Windows host."
                              - generic [ref=e882]:
                                - generic [ref=e883]: "Issue 4: Hermes is slow."
                                - generic [ref=e884]: "Fix: Almost certainly the model, not Hermes. Try a smaller model (Qwen 3.6 8B instead of 35B) or a more aggressive quantization (Q4 instead of Q6). If you’re CPU-only, expect slowness this is a workload that wants a GPU."
                              - generic [ref=e886]:
                                - generic [ref=e887]: "Issue 5: Hermes “forgets” things between sessions."
                                - generic [ref=e888]: "Fix: Check that ~/.hermes/ actually has files in it. If it’s empty, your install didn’t complete properly. Re-run the install script."
                              - heading "The cloud API shortcut (if your hardware can’t handle local)" [level=2] [ref=e890]:
