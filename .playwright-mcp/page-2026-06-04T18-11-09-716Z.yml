                              - heading "The honest concerns" [level=2] [ref=e918]:
                                - generic [ref=e920]: The honest concerns
                              - generic [ref=e923]: Three things to think about before you assume this changes everything overnight.
                              - generic [ref=e925]:
                                - generic [ref=e926]: Self-improving has failure modes.
                                - generic [ref=e927]: The same loop that makes Hermes better can make it weirder. An agent that optimizes its own prompts can quietly drift away from your actual goals. Nous Research ships guardrails regression tests, evaluation gates, “block bad mutations” workflows but those guardrails require active maintenance. If you deploy Hermes and stop watching, you may not notice when it starts being subtly wrong.
                              - generic [ref=e929]:
                                - generic [ref=e930]: Security is a real question.
                                - generic [ref=e931]: Agents that write their own skills, install MCP servers, and execute code on your machine are a new attack surface. Skill poisoning, prompt injection through fetched content, malicious tools these are not theoretical concerns. Treat the agent like executable software, not a friendly assistant.
                              - generic [ref=e933]:
                                - generic [ref=e934]: The hardware story is still rough at the edges.
                                - generic [ref=e935]: DGX Spark is a real product, but it’s also expensive, supply-constrained, and most reviewers haven’t gotten their hands on one yet. The Hermes-on-laptop story is fine today; the Hermes-on-DGX-Spark story will take a quarter to mature.
                              - generic [ref=e938]: None of these undermine the bigger thesis. They’re just the asterisks every honest practitioner should know.
                              - heading "What I’d actually do this weekend" [level=2] [ref=e940]:
                                - generic [ref=e942]: What I’d actually do this weekend
                              - generic [ref=e945]: "If you’re new to Hermes and have decent hardware, here’s the path I’d take:"
                              - list [ref=e946]:
                                - listitem [ref=e947]:
                                  - generic [ref=e948]:
                                    - generic [ref=e949]: Install LM Studio + Qwen 3.6 27B
                                    - generic [ref=e950]: 15 minutes
                                - listitem [ref=e951]:
                                  - generic [ref=e952]:
                                    - generic [ref=e953]: Install Hermes
                                    - generic [ref=e954]: 5 minutes
                                - listitem [ref=e955]:
