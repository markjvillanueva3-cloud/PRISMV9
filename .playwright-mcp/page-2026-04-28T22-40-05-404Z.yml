                    - img "MIT License" [ref=e790]
                - paragraph [ref=e791]:
                  - text: 🐙
                  - strong [ref=e792]: Research, build, review, and ship — with eight AI providers checking each other's work.
                  - text: Say what you need, and the right workflow runs. Claude-native handles the ordinary path; Octopus handles the escalated path. A 75% consensus gate catches disagreements before they reach production. No single model's blind spots slip through.
                - paragraph [ref=e793]:
                  - text: 🧠
                  - strong [ref=e794]: Remembers across sessions.
                  - text: Integrates with
                  - link "claude-mem" [ref=e795] [cursor=pointer]:
                    - /url: https://github.com/thedotmack/claude-mem
                  - text: for persistent memory — past decisions, research, and context survive session boundaries.
                - paragraph [ref=e796]:
                  - text: ⚡
                  - strong [ref=e797]: Spec in, software out.
                  - text: Dark Factory mode takes a spec and autonomously runs the full pipeline — research, define, develop, deliver. You review the output, not every step.
                - paragraph [ref=e798]:
                  - text: 🔄
                  - strong [ref=e799]: Four-phase methodology, not just tools.
                  - text: Every task moves through Discover → Define → Develop → Deliver, with quality gates between phases. Other orchestrators give you infrastructure. Octopus gives you the workflows.
                - paragraph [ref=e800]:
                  - text: 🐙
                  - strong [ref=e801]: 32 specialized personas
                  - text: (role-specific AI agents like security-auditor, backend-architect),
                  - strong [ref=e802]: 48 commands
                  - text: (slash commands you type),
                  - strong [ref=e803]: 52 skills
                  - text: (reusable workflow modules). Say "audit my API" and the right expert activates. Don't know the command? The smart router figures it out.
                - paragraph [ref=e804]:
                  - text: 🐙
                  - strong [ref=e805]: Works with just Claude. Scales to eight.
                  - text: Zero providers needed to start. Add them one at a time — each activates automatically when detected.
                - paragraph [ref=e806]:
                  - text: 💰
                  - strong [ref=e807]: Five providers cost nothing extra.
                  - text: Codex and Gemini use OAuth (included with subscriptions). Qwen has 1,000-2,000 free requests/day. Copilot uses your GitHub subscription. Ollama runs locally for free.
                - separator [ref=e808]
