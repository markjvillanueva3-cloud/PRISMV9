              - article [ref=e762]:
                - generic [ref=e763]:
                  - heading "🐙 Claude Octopus" [level=1] [ref=e764]
                  - 'link "Permalink: 🐙 Claude Octopus" [ref=e765] [cursor=pointer]':
                    - /url: "#-claude-octopus"
                    - img [ref=e766]
                - paragraph [ref=e768]: Every AI model has blind spots. Claude Octopus puts up to eight of them on every task, so blind spots surface before you ship — not after. It orchestrates Codex, Gemini, Copilot, Qwen, Ollama, Perplexity, and OpenRouter alongside Claude Code, with consensus gates that flag any disagreements.
                - paragraph [ref=e769]:
                  - strong [ref=e770]: Claude-native first, Octopus for escalation.
                  - text: Use Claude-native
                  - code [ref=e771]: /init
                  - text: ","
                  - code [ref=e772]: /review
                  - text: ", and"
                  - code [ref=e773]: /security-review
                  - text: when Claude is enough. Use Octopus when you want multiple model opinions, adversarial review, or stricter multi-LLM workflows.
                - paragraph [ref=e774]:
                  - link "Claude Octopus Demo — debate and research with multiple AI providers" [ref=e776] [cursor=pointer]:
                    - /url: /nyldn/claude-octopus/blob/main/docs/assets/demo.gif
