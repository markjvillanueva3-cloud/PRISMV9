                - paragraph [ref=e1335]:
                  - strong [ref=e1336]: Do I need all three AI providers?
                  - text: No. One external provider plus Claude gives you multi-AI features. No external providers still gives you personas, workflows, and skills.
                - paragraph [ref=e1337]:
                  - strong [ref=e1338]: Will this break my existing Claude Code setup?
                  - text: No. Activates only with the
                  - code [ref=e1339]: octo
                  - text: prefix. Results stored separately. Uninstalls cleanly.
                - paragraph [ref=e1340]:
                  - strong [ref=e1341]: What happens if a provider times out?
                  - text: The workflow continues with available providers. You'll see the status in the visual indicators.
                - paragraph [ref=e1342]:
                  - strong [ref=e1343]: Why "octopus"?
                  - text: 🐙
                  - emphasis [ref=e1344]: "Fun fact: a real octopus has three hearts, blue blood, and 500 million neurons — two-thirds of which live in its eight arms."
                  - text: "Each arm can taste, touch, and act independently. Claude Octopus works the same way: each tentacle (command) operates autonomously with its own squeeze of logic, then ink flows back as the final deliverable. The crossfire review? That's the squeeze — adversarial pressure that untangles everything before it ships."
                - paragraph [ref=e1345]:
                  - strong [ref=e1346]: How do I debug when something goes wrong?
                  - text: Run commands with the
                  - code [ref=e1347]: "--verbose"
                  - text: flag to get detailed debugging output. Logs are stored in
                  - code [ref=e1348]: ~/.claude-octopus/logs/
                  - text: for inspection. You can also use
                  - code [ref=e1349]: /octo:doctor
                  - text: to run diagnostics and identify potential issues.
