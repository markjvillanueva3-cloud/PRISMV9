                            - generic [ref=e215]:
                              - generic [ref=e218]: How Anthropic, OpenAI, and DeepSeek are converging on a single idea of using the system prompt as the reward function. A full breakdown of the RL evolution from RLHF to RULER, with code.
                              - separator [ref=e220]
                              - generic [ref=e223]: "Reinforcement learning, at its core, is straightforward: a system takes an action, the environment rewards it, and the agent updates its behavior to maximize that reward over time."
                              - generic [ref=e226]: "The interaction above works in discrete steps. At each step, three things happen in order:"
                              - link "Image" [ref=e233] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048506606695149568
                                - generic "Image" [ref=e237]:
                                  - img "Image" [ref=e239]
                              - list [ref=e240]:
                                - listitem [ref=e241]:
                                  - generic [ref=e243]: The agent observes the current state of the environment (S). A state is a description of the situation the agent is in, enough to decide what to do next. For instance, in chess, the state is the board position, and in a dialogue model, the state is the conversation history so far.
                                - listitem [ref=e244]:
                                  - generic [ref=e246]: The agent picks an action (A) based on what it sees. The action is the agent's output, the only way it can influence the environment. For instance, in chess, an action is a legal move. For an LLM, an action is the generated response.
                                - listitem [ref=e247]:
                                  - generic [ref=e249]: "The environment then does two things: it transitions to a new state (S'), and it emits a reward (R), a scalar number that evaluates the action. The next step begins, and the loop continues."
                              - generic [ref=e252]: "Stringing these steps together gives a trajectory:"
                              - link "Image" [ref=e259] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048291914454294529
                                - generic "Image" [ref=e263]:
                                  - img "Image" [ref=e265]
                              - generic [ref=e268]: Reading left to right, this is the entire history of the agent's interaction with the environment. Each (S, A, R, S') quartet is one transition, and much of RL is about learning from these transitions.
                              - separator [ref=e270]
                              - heading "Applying RL to LLMs" [level=1] [ref=e272]:
                                - generic [ref=e274]: Applying RL to LLMs
                              - generic [ref=e277]: When RL was first applied to LLMs, the environment was human preference.
                              - generic [ref=e280]: "OpenAI's InstructGPT (2022) introduced RLHF (Reinforcement Learning from Human Feedback), where:"
                              - link "Image" [ref=e287] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048506864443510784
                                - generic "Image" [ref=e291]:
                                  - img "Image" [ref=e293]
                              - list [ref=e294]:
                                - listitem [ref=e295]:
                                  - generic [ref=e297]: humans ranked model outputs
                                - listitem [ref=e298]:
                                  - generic [ref=e300]: those rankings trained a reward model
                                - listitem [ref=e301]:
                                  - generic [ref=e303]: and PPO (Proximal Policy Optimization) used that reward model to fine-tune the LLM.
                              - generic [ref=e306]: ChatGPT was built on this exact pipeline.
                              - generic [ref=e309]: But humans can't sit in the training loop rating every output in real time. If the model generates 16 responses per prompt across thousands of training steps, that's hundreds of thousands of evaluations.
                              - generic [ref=e312]: OpenAI solved this by splitting the process into two phases.
                              - link "Image" [ref=e319] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048508406429057024
                                - generic "Image" [ref=e323]:
                                  - img "Image" [ref=e325]
                              - list [ref=e326]:
                                - listitem [ref=e327]:
                                  - generic [ref=e329]: First, the offline phase. Here, humans ranked a relatively small set of model outputs and generated pairwise comparisons. This was the expensive human labor part, but it was a one-time cost.
                                - listitem [ref=e330]:
                                  - generic [ref=e332]: Second, they trained a reward model on those rankings, which was a separate LLM that learned to predict what humans would prefer. Now you had a neural network that could score any output instantly, without waiting for a human. The reward model was a compressed approximation of human judgment, fast enough to sit inside the training loop.
                              - generic [ref=e335]: With the reward model in place, PPO could run the actual RL training at GPU speed. The model generated responses, the reward model scored them, and PPO updated the weights, without extensive need for humans.
                              - generic [ref=e338]: The cost, however, was that PPO required four full-size models in memory simultaneously.
                              - link "Image" [ref=e345] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048509465658552320
                                - generic "Image" [ref=e349]:
                                  - img "Image" [ref=e351]
                              - list [ref=e352]:
                                - listitem [ref=e353]:
                                  - generic [ref=e355]: The policy (the LLM being trained).
                                - listitem [ref=e356]:
                                  - generic [ref=e358]: The reference policy (a frozen copy of the original, used to prevent training from drifting too far via a KL divergence penalty).
                                - listitem [ref=e359]:
                                  - generic [ref=e361]: The reward model (the human-preference approximator discussed above to score every output).
                                - listitem [ref=e362]:
                                  - generic [ref=e364]: And the critic, also called the value model (more about it below).
                              - generic [ref=e367]: "The critic exists to answer one question:"
                              - blockquote [ref=e368]:
                                - generic [ref=e370]: Was this reward good or bad relative to what we'd normally expect for this prompt?
                              - generic [ref=e373]: We need this because a raw reward of 0.7 means nothing in isolation. For instance, on a simple factual question where most responses score 0.9, a 0.7 is below average.
                              - generic [ref=e376]: But on a complex open-ended question where most responses score 0.4, a 0.7 is excellent.
                              - link "Image" [ref=e383] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048509860015460352
                                - generic "Image" [ref=e387]:
                                  - img "Image" [ref=e389]
                              - generic [ref=e392]: The critic learns this baseline by observing thousands of (prompt, reward) pairs during training.
                              - generic [ref=e395]: PPO's actual training signal is the advantage, which is estimated as the reward minus the critic's predicted baseline.
                              - generic [ref=e398]: This makes the signal stable across prompts of different difficulty. But the cost involved here is that the critic is a full-size LLM itself, adding another model's worth of memory.
                              - generic [ref=e401]: For a 7B parameter LLM, that meant roughly 28B parameters in memory at once.
                              - separator [ref=e403]
                              - heading "DeepSeek R1 breakthrough using verifiable rewards" [level=1] [ref=e405]:
                                - generic [ref=e407]: DeepSeek R1 breakthrough using verifiable rewards
                              - generic [ref=e410]: In January 2025, DeepSeek released R1 with a fundamentally different approach to the reward signal.
                              - generic [ref=e413]: Instead of training a reward model from human preferences (Phases 1 and 2 of the RLHF pipeline), they used RLVR (Reinforcement Learning with Verifiable Rewards).
                              - generic [ref=e416]: It's a simple, rule-based verification where the environment itself provides the signal.
                              - link "Image" [ref=e423] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048510818875314176
                                - generic "Image" [ref=e427]:
                                  - img "Image" [ref=e429]
                              - generic [ref=e432]: "For instance:"
                              - list [ref=e433]:
                                - listitem [ref=e434]:
                                  - generic [ref=e436]: For math problems, the verifier checked if the model's answer matched the known solution.
                                - listitem [ref=e437]:
                                  - generic [ref=e439]: "For code, a compiler ran the output and returned pass or fail. Binary rewards: 1 for correct, 0 for wrong."
                              - generic [ref=e442]: There are no human rankings or explicit reward models required since the ground truth was available (or inferable) to be used as the reward.
                              - generic [ref=e445]: The RL optimizer was GRPO (Group Relative Policy Optimization), which stripped away most of PPO's infrastructure.
                              - generic [ref=e448]: It removed the critic model entirely.
                              - generic [ref=e451]: Instead of training a separate model to predict expected reward per prompt, GRPO generated multiple responses to the same prompt (typically 16) and normalized rewards within each group.
                              - link "Image" [ref=e458] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048300162758664192
                                - generic "Image" [ref=e462]:
                                  - img "Image" [ref=e464]
                              - generic [ref=e467]: If 4 out of 16 responses got the math problem right, those 4 received a positive advantage, and the other 12 received a negative advantage.
                              - generic [ref=e470]: This step cut an entire full-size model from memory.
                              - generic [ref=e473]: GRPO also removed the need for the learned reward model, since RLVR's verifier handled scoring directly.
                              - generic [ref=e476]: So the four-model PPO setup (policy + reference + critic + reward model) collapsed to just two, i.e., the policy being trained and a reference copy for KL regularization.
                              - generic [ref=e479]: In fact, in practice, some implementations fold the reference into the policy checkpoint, bringing it close to a single-model setup.
                              - generic [ref=e482]: With this setup. DeepSeek R1-Zero, trained with just GRPO and verifiable rewards (no supervised fine-tuning at all), went from 15.6% to 77.9% on AIME 2024 math problems.
                              - generic [ref=e485]: With majority voting, it hit 86.7%, matching OpenAI's o1.
                              - generic [ref=e488]: The model developed self-verification, reflection, and chain-of-thought reasoning on its own, purely from the binary correct/incorrect signal, and nobody taught it to reason step by step.
                              - generic [ref=e491]: The RL training loop discovered that reasoning improved the reward, so the model learned to reason.
                              - generic [ref=e494]: RLVR with GRPO became the dominant approach for training reasoning models through 2025.
                              - generic [ref=e497]: Every major lab released a reasoning variant following this recipe.
                              - separator [ref=e499]
                              - heading "The problem" [level=1] [ref=e501]:
                                - generic [ref=e503]: The problem
                              - generic [ref=e506]: GRPO itself is general-purpose.
                              - generic [ref=e509]: It doesn't care whether the reward comes from a math verifier, a code compiler, a human, or a Python script.
                              - link "Image" [ref=e516] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048651679537741824
                                - generic "Image" [ref=e520]:
                                  - img "Image" [ref=e522]
                              - generic [ref=e525]: It just needs a number for each response, and it normalizes within each group to produce the training signal.
                              - generic [ref=e528]: But a clear bottleneck here is where these reward comes from.
                              - generic [ref=e531]: For math and code, this is fine since the environment provides a deterministic signal.
                              - generic [ref=e534]: But agents that interact with real-world tools and data don't produce outputs you can string-match against a gold answer.
                              - generic [ref=e537]: A RAG agent retrieves context and generates a response. There's no single correct answer to compare against. A customer support agent drafts a reply. There's no compiler to run it through. A summarization agent condenses a 20-page document. There are many valid summaries, and no string-matching verifier can distinguish a good one from a mediocre one.
                              - link "Image" [ref=e544] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048653649241587712
                                - generic "Image" [ref=e548]:
                                  - img "Image" [ref=e550]
                              - generic [ref=e553]: In these cases, the environment doesn't hand you a reward signal the way a math problem does.
                              - generic [ref=e556]: Of course, some agent tasks do have verifiable outcomes, and for these, RLVR works just fine, even with multi-step tool use. The verifiability depends on the task's outcome, not on whether the model is acting as an agent.
                              - generic [ref=e559]: But for the majority of agent workflows, the outcome is subjective or multi-dimensional.
                              - generic [ref=e562]: Intuitively, GRPO is still the right fit here because Agents that take multiple steps, call tools, and compose responses would benefit from learning through exploration, trying different approaches, and getting reinforced for what works.
                              - generic [ref=e565]: So, while the RL framework is the right fit, the missing piece is the scoring function.
                              - generic [ref=e568]: One solution is to write custom reward functions where Python code scores each output based on hand-defined criteria.
                              - link "Image" [ref=e575] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048652896452153345
                                - generic "Image" [ref=e579]:
                                  - img "Image" [ref=e581]
                              - list [ref=e582]:
                                - listitem [ref=e583]:
                                  - generic [ref=e585]: A RAG reward function might check whether the response used the retrieved context (faithfulness), penalize content that wasn't in the context (hallucination), reward completeness, and handle cases where the context itself is ambiguous.
                                - listitem [ref=e586]:
                                  - generic [ref=e588]: A tool-use reward function might score partial progress through a multi-step task, penalize unnecessary API calls, and measure whether the agent reached the correct final state.
                              - generic [ref=e591]: Each criterion returns a partial score, and these get summed or weighted into a final reward.
                              - generic [ref=e594]: This works, but it introduces its own set of problems.
                              - generic [ref=e597]: Writing a good reward function takes days of iteration. Researchers need to anticipate edge cases, calibrate the weights between different criteria, and test that the function actually rewards the behavior you want.
                              - generic [ref=e600]: A reward function that over-weights format compliance and under-weights faithfulness will train an agent that produces beautifully formatted hallucinations.
                              - generic [ref=e603]: Reward functions are also brittle. If you change the retrieval pipeline, add a new tool, or modify the system prompt, the reward function needs to be rewritten.
                              - generic [ref=e606]: Debugging is problematic too.
                              - generic [ref=e609]: When the agent learns bad behavior during training, the cause could be the reward function, the training hyperparameters, the data, or something else entirely.
                              - generic [ref=e612]: But because the reward function is custom code, you often can't tell whether the function is measuring what you think it's measuring until you've already trained a model on it and evaluated the outputs.
                              - separator [ref=e614]
                              - generic [ref=e617]: This is the primary reason RL has been widely adopted for verifiable tasks (math, code, logic) but not for agent workflows (RAG, customer support, tool use, summarization).
                              - generic [ref=e620]: RLVR gave reasoning models a general-purpose, automatic reward signal where they could check the answer and return 0 or 1. No such equivalent exists for most agentic workflows.
                              - generic [ref=e623]: The distinction isn't about the model. The same Qwen 2.5 14B can serve both roles.
                              - generic [ref=e626]: The distinction is about the task. Can we verify if an Agent is producing an output that can be automatically checked?
                              - separator [ref=e628]
                              - heading "How are AI labs approaching this?" [level=1] [ref=e630]:
                                - generic [ref=e632]: How are AI labs approaching this?
                              - generic [ref=e635]: This isn't a gap that only open-source practitioners are noticing.
                              - generic [ref=e638]: The major AI labs have been converging on the same problem from different directions.
                              - generic [ref=e641]: Anthropic demonstrated that you don't need humans in the RL loop at all.
                              - generic [ref=e644]: Their Constitutional AI work showed that if you write down a set of principles (a "constitution"), an AI can evaluate outputs against those principles and generate preference data for RL training.
                              - link "Image" [ref=e651] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048697173286817792
                                - generic "Image" [ref=e655]:
                                  - img "Image" [ref=e657]
                              - generic [ref=e660]: The AI judged its own outputs against the written principles and used those judgments as the RL signal. This was a significant conceptual shift that a document of rules replaced an army of human evaluators.
                              - generic [ref=e663]: OpenAI has been working on something similar internally. They are developing "Universal Verifiers," a technique to extend RL beyond math and code into domains like biology, medicine, and general knowledge, where answers can't be checked with a simple string match.
                              - generic [ref=e666]: The details aren't public, but the direction is clear that we need general-purpose reward signals that work across any domain, not just the ones with deterministic verifiers.
                              - generic [ref=e669]: Karpathy has been pointing in this direction too.
                              - link "Image" [ref=e676] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2049030951548944384
                                - generic "Image" [ref=e680]:
                                  - img "Image" [ref=e682]
                              - generic [ref=e685]: He argued in 2025 that we're missing a major learning paradigm for LLMs, something he tentatively called "system prompt learning."
                              - generic [ref=e688]: The core idea is that the system prompt carries a richer signal than a scalar reward, and RL training should be finding ways to leverage that signal rather than relying solely on hand-crafted reward functions.
                              - separator [ref=e690]
                              - heading "RULER" [level=1] [ref=e692]:
                                - generic [ref=e694]: RULER
                              - generic [ref=e696]:
                                - generic [ref=e697]: If you want to see this in practice, RULER, built into
                                - link "OpenPipe's ART framework" [ref=e699] [cursor=pointer]:
                                  - /url: https://github.com/OpenPipe/ART
                                  - generic [ref=e700]: OpenPipe's ART framework
                                - generic [ref=e701]: (open-source with 9k+ stars) is a general-purpose reward function that replaces all of that custom scoring code with a single function call.
                              - link "Image" [ref=e708] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048500891721125888
                                - generic "Image" [ref=e712]:
                                  - img "Image" [ref=e714]
                              - generic [ref=e717]: It uses an LLM-as-judge to rank multiple trajectories, and it works by exploiting the same property that makes GRPO powerful, i.e., only relative rankings matter.
                              - generic [ref=e720]: "Here's how it works step-by-step:"
                              - link "Image" [ref=e727] [cursor=pointer]:
                                - /url: /_avichawla/article/2049037299334472015/media/2048655454755332096
                                - generic "Image" [ref=e731]:
                                  - img "Image" [ref=e733]
                              - list [ref=e734]:
                                - listitem [ref=e735]:
                                  - generic [ref=e737]: For each training step, you generate N trajectories for the same scenario (typically 4 to 8).
                                - listitem [ref=e738]:
                                  - generic [ref=e740]: RULER sends all N to a judge LLM (like o3, o4-mini, or even a local Qwen3 32B).
                                - listitem [ref=e741]:
                                  - generic [ref=e743]: The judge reads the agent's system prompt to understand what the agent was supposed to do, then scores each trajectory from 0 to 1 relative to the others.
                              - generic [ref=e746]: "Two properties make this work:"
                              - generic [ref=e749]: 1) Relative scoring is easier than absolute scoring.
                              - generic [ref=e752]: LLMs struggle with absolute scoring because there's no shared calibration.
                              - generic [ref=e755]: But asking "which of these 4 responses best follows the system prompt's instructions" is a comparison task, and LLMs do those consistently well.
                              - generic [ref=e758]: RULER leans into this by presenting all trajectories together and asking the judge to rank them against each other.
                              - generic [ref=e761]: 2) GRPO normalizes within each group anyway.
                              - generic [ref=e765]: Whether the best trajectory scored 0.9 or 0.3 in absolute terms doesn't matter.
                              - generic [ref=e768]: GRPO takes the scores within a group, computes the mean and standard deviation, and normalizes.
                              - generic [ref=e771]: The training signal comes from the relative ordering by understanding which trajectories were above average and which were below. RULER's relative rankings map directly onto what GRPO expects.
                              - separator [ref=e773]
                              - heading "A rough walkthrough" [level=2] [ref=e775]:
                                - generic [ref=e777]: A rough walkthrough
                              - generic [ref=e780]: "Before jumping into code, let's trace what happens conceptually. Say you're training a RAG agent. At each training step, GRPO generates multiple responses for the same query:"
                              - generic [ref=e783]:
                                - generic [ref=e784]:
                                  - generic [ref=e785]: plaintext
                                  - button "Copy to clipboard" [ref=e787] [cursor=pointer]:
                                    - img [ref=e789]
                                - code [ref=e793]: "Scenario: \"What is the refund policy?\" Retrieved context: \"Refunds within 30 days. Digital products non-refundable...\" (Faithful) Response A: \"Refunds within 30 days. Email support@example.com.\" (hallucinated) Response B: \"Refunds within 30 days. Also store credit for 90 days.\" (ignored context) Response C: \"Not sure, check the website.\" (verbose but accurate) Response D: \"The policy states that refunds are available within...\""
                              - generic [ref=e796]: "In a traditional setup, you'd write a reward function to score each of these:"
                              - generic [ref=e799]:
                                - generic [ref=e800]:
                                  - generic [ref=e801]: python
                                  - button "Copy to clipboard" [ref=e803] [cursor=pointer]:
                                    - img [ref=e805]
                                - code [ref=e809]: "def reward_function(response, context): score = 0.0 if uses_context(response, context): score += 0.4 if not has_hallucination(response, context): score += 0.3 if is_complete(response, context): score += 0.2 if is_concise(response): score += 0.1 return score"
                              - generic [ref=e812]: Each of those helper functions (uses_context, has_hallucination, is_complete, is_concise) is its own engineering project.
                              - generic [ref=e815]: You need to define what "uses context" means precisely, decide thresholds, handle edge cases, and test everything.
                              - generic [ref=e818]: "With RULER, you replace all of that with:"
                              - generic [ref=e821]:
                                - generic [ref=e822]:
                                  - generic [ref=e823]: python
                                  - button "Copy to clipboard" [ref=e825] [cursor=pointer]:
                                    - img [ref=e827]
                                - code [ref=e831]: scored_group = await ruler_score_group(group, "openai/o3")
