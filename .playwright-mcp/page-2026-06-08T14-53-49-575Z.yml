                              - generic [ref=e884]: "1) The lower-level `ruler` function works with plain message dictionaries, so no ART-specific objects are needed."
                              - generic [ref=e887]: This is the fastest way to see what RULER actually does.
                              - generic [ref=e890]: Let's look at a minimal example with three trajectories for the same RAG query.
                              - generic [ref=e893]: "Below, we have defined three message lists: one is faithful, one hallucinates, and one ignores the context entirely."
