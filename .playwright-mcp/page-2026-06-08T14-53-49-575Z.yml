                              - generic [ref=e1056]: If you notice closely...
                              - list [ref=e1057]:
                                - listitem [ref=e1058]:
                                  - generic [ref=e1060]: The concise faithful response (0.98) scored just above the verbose accurate one (0.96). Both used only the retrieved context, both were correct, but the system prompt said "Answer using ONLY the retrieved context," and the concise version did that more directly. The judge recognized verbosity as a minor quality issue, not a correctness issue. That's a nuanced distinction that would be hard to encode in a scoring function because how do you write a rule that says "technically correct but unnecessarily wordy, penalize by 0.02"?
                                - listitem [ref=e1061]:
                                  - generic [ref=e1063]: The hallucinated response dropped from 0.45 in the first experiment to 0.20 here. The difference is the system prompt. The first experiment said "Use the retrieved context to answer accurately." This one says "Do not add information that is not in the context." The stricter instruction produced stricter scoring. The judge adapted automatically. If you tighten your system prompt, RULER tightens its evaluation to match, without you changing any scoring code.
                                - listitem [ref=e1064]:
                                  - generic [ref=e1066]: The context-ignoring response scored 0.05 in both experiments. When the answer is right there in the retrieved context, and the agent says "I'm not sure," there's no ambiguity regardless of how the system prompt is worded.
                              - generic [ref=e1069]: "These scored trajectories are exactly what `model.train()` expects, so let's look at that ahead."
                              - separator [ref=e1071]
                              - heading "The full training loop" [level=1] [ref=e1073]:
                                - generic [ref=e1075]: The full training loop
                              - generic [ref=e1078]: To actually train with these scores, you replace the hardcoded responses with real model inference.
                              - generic [ref=e1081]: "ART's `gather_trajectory_groups` handles the orchestration."
                              - generic [ref=e1084]: "Essentially, for each scenario, it generates a group of trajectories using the model's current weights, scores them with RULER, and collects the results for GRPO:"
                              - generic [ref=e1087]:
                                - generic [ref=e1088]:
                                  - generic [ref=e1089]: python
                                  - button "Copy to clipboard" [ref=e1091] [cursor=pointer]:
                                    - img [ref=e1093]
                                - code [ref=e1097]: "for step in range(num_steps): groups = await art.gather_trajectory_groups( ( art.TrajectoryGroup( rollout(model, scenario) for _ in range(4) ) for scenario in scenarios ), after_each=lambda g: ruler_score_group( g, \"openai/o3\"), ) await model.train(groups) # GRPO updates LoRA weights"
                              - generic [ref=e1100]: In every step, the model generates 4 responses per scenario using its current weights, RULER ranks them relatively, and GRPO reinforces the high-scoring behavior while suppressing the low-scoring behavior.
                              - generic [ref=e1103]: The agent gets better at following the system prompt's instructions with every iteration.
                              - generic [ref=e1106]: Over multiple steps, the model learns the patterns that score well (faithfulness, conciseness, grounding in context) and unlearns the patterns that score poorly (hallucination, ignoring context, verbosity).
                              - generic [ref=e1109]: And notice that no reward function was defined anywhere in this code.
                              - separator [ref=e1111]
                              - heading "Custom rubrics" [level=1] [ref=e1113]:
                                - generic [ref=e1115]: Custom rubrics
                              - generic [ref=e1118]: "For most tasks, the system prompt provides enough signal for RULER to score effectively. But when you need more specific evaluation criteria, RULER supports custom rubrics:"
                              - generic [ref=e1121]:
                                - generic [ref=e1122]:
                                  - generic [ref=e1123]: python
                                  - button "Copy to clipboard" [ref=e1125] [cursor=pointer]:
                                    - img [ref=e1127]
                                - code [ref=e1131]:
                                  - text: custom_rubric = """ - Prioritize responses that are concise and clear - Penalize responses that include emojis or informal language - Reward responses that cite sources """
                                  - text: await ruler_score_group(group, "openai/o3", rubric=custom_rubric)
                              - generic [ref=e1134]: The rubric is natural language, not Python, so iterating on it is fast.
                              - generic [ref=e1137]: You just change a sentence, rerun, and check the scores.
                              - generic [ref=e1140]: Compare this to editing a reward function where a misplaced weight or a buggy condition can silently teach the agent bad behavior that you won't notice until after training.
                              - separator [ref=e1142]
                              - heading "Application to non-verifiable tasks" [level=1] [ref=e1144]:
                                - generic [ref=e1146]: Application to non-verifiable tasks
                              - generic [ref=e1149]: RULER is general-purpose. It works on any task, not just freeform ones where custom rewards are painful.
                              - generic [ref=e1152]: The practical question is when RULER adds value over simpler alternatives.
                              - generic [ref=e1155]: For purely deterministic tasks (did the SQL query return the right rows?), a binary verifier is cheaper and gives a cleaner signal.
                              - generic [ref=e1158]: "For purely subjective tasks (was the summary good?), RULER is the only automatic option. For tasks that sit in between (did the agent find the right answer AND explain it well?), you can combine both:"
                              - generic [ref=e1161]:
                                - generic [ref=e1162]:
                                  - generic [ref=e1163]: python
                                  - button "Copy to clipboard" [ref=e1165] [cursor=pointer]:
                                    - img [ref=e1167]
                                - code [ref=e1171]:
                                  - text: judged_group = await ruler_score_group(group, "openai/o3")
                                  - text: "for traj in judged_group.trajectories: independent_reward = verify_correctness(traj) # binary 0/1 traj.reward += independent_reward"
                              - generic [ref=e1174]: RULER preserves any rewards you assign during rollout under a separate metric, so you can layer LLM-judge scoring on top of deterministic verification without losing either signal.
                              - separator [ref=e1176]
                              - heading "Practical details" [level=1] [ref=e1178]:
                                - generic [ref=e1180]: Practical details
                              - generic [ref=e1183]: "Here are some practical insights I have gathered based on using RULER:"
                              - generic [ref=e1186]: → You don't need the most expensive model as the judge. Cheaper models like Qwen3 32B often work well. You can also use Claude, local models through Ollama, or any model supported by LiteLLM. The choice is a cost-quality tradeoff, not a hard requirement.
                              - generic [ref=e1189]: → 4 to 8 trajectories per group is the recommended range. Fewer than 4 gives the judge too little to compare against. More than 8 can confuse the judge and increase the cost without proportional benefit.
                              - generic [ref=e1192]: → When all trajectories in a group share the same system prompt and user message (which they usually do), RULER deduplicates the common prefix automatically. The judge only sees the shared context once, followed by the different responses. This cuts token usage significantly for long system prompts or multi-turn conversations.
                              - generic [ref=e1195]: → RULER caches judge responses to disk. If you rerun the same trajectories, it won't hit the API again. This matters during debugging when you're iterating on the system prompt or rubric.
                              - separator [ref=e1197]
                              - generic [ref=e1200]: The bottleneck in applying RL to agents was never the optimization algorithm.
                              - generic [ref=e1203]: GRPO handles that well.
                              - generic [ref=e1206]: It was always the reward signal.
                              - generic [ref=e1209]: RLVR solved this for verifiable tasks by letting the environment score outputs directly.
                              - generic [ref=e1212]: RULER solves it for every task (verifiable or non-verifiable) by letting an LLM judge score outputs relatively.
                              - generic [ref=e1215]: The full implementation is in the ART repo, along with Colab notebooks that walk through the training loop end to end.
