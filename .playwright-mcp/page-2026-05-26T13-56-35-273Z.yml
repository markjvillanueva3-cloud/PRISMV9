                      - generic [ref=e221]:
                        - generic [ref=e224]: Most people's agents are goldfish. They start from zero every session, rediscover the same things, and make the same mistakes on run 100 that they made on run 1. Here is how to fix that in four layers you can build this week.
                        - separator [ref=e226]
                        - generic [ref=e229]: Every time you open a new Claude chat, it starts from nothing.
                        - generic [ref=e232]: It doesn't know your name. It doesn't remember the three corrections you made yesterday, the workaround it discovered last week, or the fact that you hate bullet-point summaries. Each session it rediscovers the same context, makes the same mistakes, and asks the questions you already answered.
                        - generic [ref=e235]: "Example: your coding agent discovers that the export tool fails on files over 50MB, fixes it by splitting files first, and you move on. Next week, in a fresh session, it hits the same failure again. Without memory, that lesson died with the chat."
                        - generic [ref=e238]: For a casual chatbot, that's fine. For an agent doing real, repeating work, it's the single biggest reason your setup plateaus. An agent with no memory is exactly as useful on its hundredth run as it was on its first.
                        - generic [ref=e241]: Memory isn't one switch. It's four layers, each solving a problem the one below it can't. Layer 1 is a sticky note. Layer 4 is an employee who reviews the week every Friday and comes back sharper. The hard part is not the technology. It is deciding what deserves to survive into the next session.
                        - link "Image" [ref=e248] [cursor=pointer]:
                          - /url: /dunik_7/article/2058905748579418615/media/2058836628240576512
                          - generic "Image" [ref=e252]:
                            - img "Image" [ref=e254]
                        - separator [ref=e256]
                        - heading "Layer 1 Tell Claude who you are" [level=1] [ref=e258]:
                          - generic [ref=e260]: Layer 1 Tell Claude who you are
                        - generic [ref=e263]: "Start with what already exists. Claude can keep a memory of you across conversations: your role, your projects, how you like to communicate. If your account has a memory setting, turn it on."
                        - generic [ref=e265]:
                          - generic [ref=e266]: "But here's the part most people miss: don't wait for Claude to"
                          - generic [ref=e267]: infer
                          - generic [ref=e268]: your preferences from past chats. State them directly, in one message, in a fresh conversation. Explicit beats inferred every time, and it lands immediately instead of whenever the next background sync runs.
                        - generic [ref=e271]:
                          - generic [ref=e272]:
                            - generic [ref=e273]: plaintext
                            - button "Copy to clipboard" [ref=e275] [cursor=pointer]:
                              - img [ref=e277]
                          - code [ref=e281]: "Remember the following about me for future conversations: - I work in [field]; my main projects are [X, Y]. - I prefer [direct prose / no bullet points / short replies]. - My writing style is [describe it]. - Never [the thing you always have to correct]."
                        - generic [ref=e284]: One message eliminates an entire category of repeated explanation. This is the sticky note. It's not much, but it's the floor everything else stands on.
                        - link "Image" [ref=e291] [cursor=pointer]:
                          - /url: /dunik_7/article/2058905748579418615/media/2058905041780551680
                          - generic "Image" [ref=e295]:
                            - img "Image" [ref=e297]
                        - separator [ref=e299]
                        - heading "Layer 2 Projects, and the trap inside them" [level=1] [ref=e301]:
                          - generic [ref=e303]: Layer 2 Projects, and the trap inside them
                        - generic [ref=e306]: A Project is a persistent workspace. The custom instructions you write there load into every conversation you start inside it the agent's role, your standards, your constraints. Set it up once and every session inherits it.
                        - generic [ref=e308]:
                          - generic [ref=e309]: "Now the trap, because this is where most people get burned:"
                          - generic [ref=e310]: Projects persist instructions, not conversation history.
                        - generic [ref=e313]: "You set up a Project, give it rich instructions and project knowledge, work through a few sessions then open a new chat in the same Project and the details of what you discussed are not automatically carried forward. The architecture decision, the half-finished task, the debugging thread: gone unless you saved them somewhere persistent. The Project remembers its rules and knowledge. It does not remember your week by default."
                        - generic [ref=e316]: That gap is exactly what the next layer fills.
                        - separator [ref=e318]
                        - heading "Layer 3 A living memory file" [level=1] [ref=e320]:
                          - generic [ref=e322]: Layer 3 A living memory file
                        - generic [ref=e324]:
                          - generic [ref=e325]: The simplest persistent memory that actually works is a single file the agent reads at the start of a session and updates at the end, if your workflow tells it to. In Claude Code this is
                          - generic [ref=e326]: "`CLAUDE.md`"
                          - generic [ref=e327]: . In any other agent it can be a
                          - generic [ref=e328]: "`memory.md`"
                          - generic [ref=e329]: in the project's knowledge.
                        - generic [ref=e332]: The discipline here is the whole game, and it has two rules.
                        - generic [ref=e334]:
                          - generic [ref=e335]: "Rule one: keep it lean."
                          - generic [ref=e336]: A fresh session can spend thousands of tokens loading instructions before you type a word. Don't treat the file like a wiki dump. If you auto-generate a starter file, the counterintuitive next step is to delete most of it it usually states things the model already sees.
                        - generic [ref=e338]:
                          - generic [ref=e339]: "Rule two: give it structure."
                          - generic [ref=e340]: "A file that grows without sections becomes noise. Sections turn it into something the agent can actually consult:"
                        - generic [ref=e343]:
                          - generic [ref=e344]:
                            - generic [ref=e345]: markdown
                            - button "Copy to clipboard" [ref=e347] [cursor=pointer]:
                              - img [ref=e349]
                          - code [ref=e353]:
                            - text: Preferences
                            - text: "- Prose over bullets for status updates"
                            - text: "- Always cite the source file for any claim Decisions"
                            - text: "- 2026-04-18 - chose Postgres over Mongo (relational reporting) Known workarounds"
                            - text: "- Export tool chokes on files >50MB; split first Mistakes to avoid"
                            - text: "- Don't auto-approve PRs touching the auth module"
                        - generic [ref=e355]:
                          - generic [ref=e356]: "Then comes the filter that makes the whole thing work. Not everything should be saved. After each meaningful session, ask one question of every candidate entry:"
                          - generic [ref=e357]: would this change how the agent acts next time?
                          - generic [ref=e358]: If yes, store it. If no, let it go. Memory that stores everything is as useless as memory that stores nothing.
                        - link "Image" [ref=e365] [cursor=pointer]:
                          - /url: /dunik_7/article/2058905748579418615/media/2058905717243826176
                          - generic "Image" [ref=e369]:
                            - img "Image" [ref=e371]
                        - separator [ref=e373]
                        - heading "Layer 4 The agent that consolidates while you sleep" [level=1] [ref=e375]:
                          - generic [ref=e377]: Layer 4 The agent that consolidates while you sleep
                        - generic [ref=e380]: A memory file that only ever grows eventually rots. Duplicates pile up. Yesterday's decision contradicts last month's. The signal drowns.
                        - generic [ref=e383]: "Layer 4 closes the loop: a scheduled background process that reads the existing memory plus recent session transcripts you have explicitly saved, then rewrites the memory clean duplicates merged, stale entries replaced with the current value, genuinely new patterns surfaced. People sometimes borrow a word from neuroscience for this and call it the agent \"dreaming,\" because it's the consolidation that happens between work, not during it."
                        - generic [ref=e385]:
                          - generic [ref=e386]: "You don't need a special product to do it. It's an ordinary scheduled job a nightly or weekly cron that hands the model the old memory file and the latest transcripts with an instruction:"
                          - generic [ref=e387]: "\"Consolidate this into a clean memory store. Merge duplicates, replace stale entries, surface new recurring patterns. Here are the criteria.\""
                        - generic [ref=e389]:
                          - generic [ref=e390]: "One rule keeps it safe:"
                          - generic [ref=e391]: write the result to a new file and keep the old one read-only until you've reviewed it.
                          - generic [ref=e392]: Check that the merges are correct, that the "replaced" entries really were stale, and that the surfaced insights are real signal and not noise. Only then swap the agent over to the new store. Because you opt into a brand-new file, a bad consolidation can never silently corrupt what you already have.
                        - generic [ref=e395]: "One condition decides whether this is worth it: Layer 4 only helps agents that run the same kind of task repeatedly. It consolidates patterns across many sessions, so a one-off agent has nothing to consolidate. Run it on a workhorse, not a tourist."
                        - separator [ref=e397]
                        - heading "The four mistakes that break agent memory" [level=1] [ref=e399]:
                          - generic [ref=e401]: The four mistakes that break agent memory
                        - list [ref=e402]:
                          - listitem [ref=e403]:
                            - generic [ref=e404]:
                              - generic [ref=e405]: Treating Projects as memory.
                              - generic [ref=e406]: They persist instructions, not history. Assume otherwise and you'll lose context without understanding why.
                          - listitem [ref=e407]:
                            - generic [ref=e408]:
                              - generic [ref=e409]: Dumping everything into the memory file.
                              - generic [ref=e410]: A bloated file wastes tokens and buries the signal. Lean and structured beats long and complete.
                          - listitem [ref=e411]:
                            - generic [ref=e412]:
                              - generic [ref=e413]: Storing with no filter.
                              - generic [ref=e414]: If everything is worth remembering, nothing is. Save only what changes future behavior.
                          - listitem [ref=e415]:
                            - generic [ref=e416]:
                              - generic [ref=e417]: Auto-deploying a consolidation you didn't read.
                              - generic [ref=e418]: he whole point of writing to a new file is the review step. Skip it and you lose the safety net.
                        - separator [ref=e420]
                        - heading "The point" [level=1] [ref=e422]:
                          - generic [ref=e424]: The point
                        - generic [ref=e427]: Layer 1 is a sticky note. Layer 4 is a colleague who reflects on the week every Friday and comes back sharper no retraining, no manual reconfiguration, just a loop that compounds.
                        - generic [ref=e430]: "Most people will keep opening Claude the way they always have: a fresh, forgetful chat every time, re-explaining themselves on every run, wondering why their agent never gets better."
                        - generic [ref=e433]: Set up the first three layers tonight. That alone will change how your next session feels. Add the fourth when your agent finally has a week worth remembering.
