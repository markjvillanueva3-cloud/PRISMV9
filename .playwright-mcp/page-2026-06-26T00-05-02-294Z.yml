                                  - generic [ref=e1220]: "The mistake:"
                                  - generic [ref=e1221]: Using expensive cloud STT for routine voice messages. Local faster-whisper handles most languages well and costs nothing. Save paid STT for complex audio or noisy environments.
                                - generic [ref=e1223]:
                                  - generic [ref=e1224]: "Example:"
