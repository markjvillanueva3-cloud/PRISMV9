                                - generic [ref=e1207]:
                                  - generic [ref=e1208]: "What it unlocks:"
                                  - generic [ref=e1209]: Talk to Hermes through voice messages on Telegram, Discord, WhatsApp. The agent transcribes, processes, and can respond with synthesized speech. Full voice conversations without typing.
                                - generic [ref=e1211]:
                                  - generic [ref=e1212]: "STT providers:"
                                  - generic [ref=e1213]: → faster-whisper (free, runs on-device) → local command wrapper → Groq (fast cloud) → OpenAI Whisper API → Mistral → xAI
                                - generic [ref=e1215]:
