                                - generic [ref=e1568]: "the pattern across all of these: push work off the expensive model onto free code, cheap models, and compressed context. the agent reasons. everything else runs for free."
                                - generic [ref=e1571]: START WITH BLANK SLATE
                                - generic [ref=e1573]:
                                  - generic [ref=e1574]: if you care about token control from day one, install with Blank Slate mode (
                                  - generic [ref=e1575]: hermes setup
                                  - generic [ref=e1576]: → Blank Slate). everything disabled except provider, model, file tools, terminal. add features one by one as you need them. nothing loads that you didn't explicitly enable. this is the cheapest and most controlled starting point.
