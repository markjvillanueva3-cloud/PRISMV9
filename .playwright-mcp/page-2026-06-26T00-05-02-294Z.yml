                                - heading "WHERE MOST PEOPLE STOP" [level=2] [ref=e1580]:
                                  - generic [ref=e1582]: WHERE MOST PEOPLE STOP
                                - generic [ref=e1585]: Levels 1-2. They install Hermes, write a SOUL.md, and use it as a smart chatbot. The agent saves them 30 minutes a day.
                                - generic [ref=e1588]: The jump from level 3 to level 7 is where daily time savings go from minutes to hours. /background, skills with the right models, cron jobs with wakeAgent gates. These compound.
                                - generic [ref=e1591]: The jump from level 7 to level 10+ is where the agent stops being a tool and becomes a system. Multi-profile architecture, self-improving knowledge, Kanban orchestration. You review work that happened without you.
