                                - generic [ref=e362]: You are using Hermes. The agent responds to what you ask.
                                - separator [ref=e364]
                                - generic [ref=e367]: LEVEL 1 — ONE-SHOT PROMPTS
                                - generic [ref=e369]:
                                  - generic [ref=e370]: "What it is:"
                                  - generic [ref=e371]: You installed Hermes. You type prompts. The agent responds with tool calls, file edits, web searches, terminal commands. Basic interaction.
                                - generic [ref=e373]:
                                  - generic [ref=e374]: "What it unlocks:"
                                  - generic [ref=e375]: Hermes executes tasks across your file system, terminal, and the web. It reads files, writes code, searches the internet, runs shell commands. It does things. A chatbot talks about things.
                                - generic [ref=e378]: "Setup:"
                                - generic [ref=e380]:
                                  - generic [ref=e381]: "Desktop app: download from"
                                  - link "hermes-agent.nousresearch.com" [ref=e383] [cursor=pointer]:
                                    - /url: //hermes-agent.nousresearch.com
                                    - generic [ref=e384]: hermes-agent.nousresearch.com
                                  - generic [ref=e385]: ". One-click install. CLI:"
                                  - generic [ref=e386]: hermes setup
                                - generic [ref=e389]: "Three setup modes: → Quick Setup (Nous Portal): OAuth login, model + Tool Gateway in one command → Full Setup: walk through every provider, tool, and option yourself → Blank Slate: everything starts OFF except provider, model, file tools, and terminal. No web search, no browser, no memory, no delegation, no cron, no skills, no plugins, no MCP. You enable only what you need. Nothing loads that you didn't choose, even after updates."
                                - generic [ref=e392]: Blank Slate is the cleanest starting point for users who want full control over what the agent can and cannot do.
                                - generic [ref=e395]: Connect a model provider. Start chatting.
                                - generic [ref=e397]:
                                  - generic [ref=e398]: "The mistake:"
                                  - generic [ref=e399]: Treating Hermes as a search engine. "Tell me about X" wastes an agent that can DO things. "Research X, write a report, save it to ~/reports/" uses the tools.
                                - generic [ref=e401]:
                                  - generic [ref=e402]: "Example:"
                                  - generic [ref=e403]: "\"research the top 5 CRMs for solo founders, compare pricing and features, save a report to ~/reports/crm-comparison.html\" — agent searches, compares, writes the file. done in 3 minutes."
                                - separator [ref=e405]
                                - generic [ref=e408]: LEVEL 2 — MEMORY + SOUL.MD
                                - generic [ref=e410]:
                                  - generic [ref=e411]: "What it is:"
                                  - generic [ref=e412]: Hermes remembers you across sessions. SOUL.md defines who the agent is. MEMORY.md and USER.md store durable facts about your projects, preferences, and business context.
                                - generic [ref=e414]:
                                  - generic [ref=e415]: "What it unlocks:"
                                  - generic [ref=e416]: The agent stops asking you to re-explain things. Two people asking the same question get different answers because Hermes knows their different contexts. Your instructions, preferences, and business details persist across every session.
                                - generic [ref=e419]: "v0.17.0 added atomic memory operations: the agent can batch add, replace, and remove memory entries in one call. Memory updates no longer fail mid-edit when the budget is tight."
                                - generic [ref=e422]: "Setup:"
                                - generic [ref=e424]:
                                  - generic [ref=e425]: "Desktop app / Dashboard: Profile → SOUL.md → edit CLI: open"
                                  - generic [ref=e426]: ~/.hermes/SOUL.md
                                  - generic [ref=e427]: in any editor
                                - generic [ref=e430]: Write 50-80 lines covering identity, voice, operations, and restrictions. The agent reads this on every session start.
                                - generic [ref=e432]:
                                  - generic [ref=e433]: "The mistake:"
                                  - generic [ref=e434]: Leaving SOUL.md empty and expecting personalized output. Hermes without a SOUL.md is generic by design. The identity file is the difference between a general assistant and YOUR assistant.
