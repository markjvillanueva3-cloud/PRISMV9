                                - separator [ref=e1453]
                                - generic [ref=e1456]: every level above 3 costs tokens. here are the controls that keep spending predictable.
                                - generic [ref=e1459]: RIGHT MODEL PER TASK (Level 4+)
                                - generic [ref=e1462]: not every task needs your most expensive model. web search = DeepSeek V4 Flash ($0.10/M). synthesis = Sonnet ($3/$15/M). final review = Opus 4.8 ($5/$25/M). assign models per skill, per profile, per cron job. see Level 4 for the full model-per-task reference.
                                - generic [ref=e1465]: WAKEAGENT GATES (Level 7+)
                                - generic [ref=e1468]: script runs every tick for free. checks if anything changed. nothing changed = agent never wakes = $0. the agent only spends tokens when there is work to do.
                                - generic [ref=e1471]: NO_AGENT MODE (Level 7+)
                                - generic [ref=e1474]: when the script IS the job. uptime checks, disk alerts, file watchers. output goes directly to Telegram. zero LLM calls. zero tokens. ever.
                                - generic [ref=e1477]: PRE-RUN SCRIPTS (Level 7+)
                                - generic [ref=e1480]: script gathers data for free. output injected into the prompt as context. the model summarizes what the script fetched instead of burning tool calls to find the data itself.
                                - generic [ref=e1483]: LEAN TOOL SETS (Level 5+)
                                - generic [ref=e1486]: set --skills web,file per cron job. fewer tool schemas in context = smaller prompt = cheaper. a news digest job does not need browser, delegation, or kanban tools.
                                - generic [ref=e1489]: TOOL SEARCH (Level 5+)
                                - generic [ref=e1492]: auto-enabled when tool schemas eat 10%+ of context. replaces full tool definitions with 3 bridge tools. ~300 tokens instead of thousands. the agent discovers tools on demand instead of loading all at once.
                                - generic [ref=e1495]: COMPRESSION THRESHOLD (Level 7+)
                                - generic [ref=e1498]: "set in Desktop app, Dashboard, or config.yaml:"
                                - blockquote [ref=e1499]:
                                  - generic [ref=e1501]: "compression: threshold: 0.40 # default 0.50"
                                - generic [ref=e1504]: fires context compression earlier. keeps long /goal runs and cron sessions within token budget even at 20+ turns.
                                - generic [ref=e1507]: CURATOR — FREE BY DEFAULT (v0.17.0)
                                - generic [ref=e1510]: "deterministic skill pruning still runs for free. LLM-powered consolidation is now opt-in only:"
                                - generic [ref=e1513]: "set in Desktop app, Dashboard, or config.yaml:"
                                - blockquote [ref=e1514]:
                                  - generic [ref=e1516]: "curator: consolidate: true # opt-in, default false"
                                - generic [ref=e1519]: routine background curation costs zero tokens. enable consolidation only when your skill library needs deep cleanup.
                                - generic [ref=e1522]: "LOSSLESS DENSIFICATION (PR #47866 by teknium)"
                                - generic [ref=e1524]:
