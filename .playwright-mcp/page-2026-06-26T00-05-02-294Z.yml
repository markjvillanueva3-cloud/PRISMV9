                                - generic [ref=e325]: Most people install Hermes Agent and use it as a chatbot. They type a prompt, get a response, close the tab. That covers maybe 10% of what the agent can do.
                                - generic [ref=e328]: This article maps every level of Hermes Agent usage, from the first prompt to a system that runs your business without you. 15 levels, grouped into three phases. Each level builds on the one before it, but you can jump to any level that fits your setup.
                                - generic [ref=e331]: "The structure is the same for every level: what it is, what it unlocks, how to set it up, and the mistake that trips people up at that stage."
