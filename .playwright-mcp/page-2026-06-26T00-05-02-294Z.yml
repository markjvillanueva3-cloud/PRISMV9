                                - generic [ref=e579]: LEVEL 3 — SLASH COMMANDS
                                - generic [ref=e581]:
                                  - generic [ref=e582]: "What it is:"
                                  - generic [ref=e583]: Commands that change how the agent works mid-session. Most users never type these.
                                - generic [ref=e585]:
                                  - generic [ref=e586]: "What it unlocks:"
                                  - generic [ref=e587]: Parallel work inside a single session. You stop waiting for one task to finish before starting the next.
                                - generic [ref=e590]: "The commands:"
                                - generic [ref=e593]: /background <prompt> Fires a task in the background. Your main session stays free. Result appears as a panel when done.
                                - generic [ref=e596]: /steer <prompt> Injects a message into the current run without interrupting it. Redirects the agent mid-execution.
                                - generic [ref=e599]: /queue <prompt> Queues a follow-up. Waits until the current task finishes, then runs automatically.
                                - generic [ref=e602]: /model <name> Switches models mid-session. Start with Sonnet for planning. Switch to DeepSeek for execution. Switch to Opus for review.
                                - generic [ref=e605]: "v0.17.0 added grok-composer-2.5-fast via Grok OAuth: the 200K context coding model behind Cursor's Composer, accessible through your Grok subscription."
                                - generic [ref=e608]: "Configure default behavior when you type while the agent is busy:"
                                - generic [ref=e611]: "set in Desktop app, Dashboard, or config.yaml:"
                                - blockquote [ref=e612]:
                                  - generic [ref=e614]: "display: busy_input_mode: steer # or queue, or interrupt"
                                - generic [ref=e616]:
                                  - generic [ref=e617]: "The mistake:"
                                  - generic [ref=e618]: Not knowing these exist. Most users type a prompt, wait for it to finish, type another prompt. /background alone doubles your throughput per session.
                                - generic [ref=e620]:
                                  - generic [ref=e621]: "Example:"
                                  - generic [ref=e622]: "you're drafting a proposal. mid-session:"
                                  - generic [ref=e623]: /background research [competitor] pricing and positioning
                                  - generic [ref=e624]: . you keep writing. 5 minutes later a panel appears with the competitive analysis. you paste it into the proposal without breaking flow.
                                - separator [ref=e626]
                                - heading "PHASE 2 — LEVERAGE (Levels 4-7)" [level=2] [ref=e628]:
                                  - generic [ref=e630]: PHASE 2 — LEVERAGE (Levels 4-7)
                                - generic [ref=e633]: Hermes works smarter. You stop doing tasks the agent can handle.
                                - separator [ref=e635]
                                - generic [ref=e638]: LEVEL 4 — SKILLS + RIGHT MODEL PER SKILL
                                - generic [ref=e640]:
                                  - generic [ref=e641]: "What it is:"
                                  - generic [ref=e642]: Skills are on-demand knowledge documents and tool collections the agent loads when needed. Each skill can run on a different model.
                                - generic [ref=e644]:
                                  - generic [ref=e645]: "What it unlocks:"
                                  - generic [ref=e646]: The agent becomes a specialist on demand. A research skill loads research methodology. A code review skill loads security patterns. Each skill uses the model best suited for its job.
                                - generic [ref=e649]: "Setup:"
                                - generic [ref=e651]:
                                  - generic [ref=e652]: "Desktop app / Dashboard: Skills Hub → Browse → Install CLI:"
                                  - generic [ref=e653]: /skills search [topic]
                                - generic [ref=e656]: "v0.17.0 rehauled the Skills Hub: connected hubs (OpenAI, Anthropic, HuggingFace, NVIDIA), featured section, full skill previews before install, and security scan on each skill."
                                - generic [ref=e659]: "v0.17.0 also added image editing: image_generate now edits source images (\"make this logo blue\", \"remove the background\"). Same tool, new mode."
                                - generic [ref=e662]: "Assign a model per skill in the Desktop app or config.yaml:"
                                - generic [ref=e665]: "research/web search → DeepSeek V4 Flash ($0.10/M tokens, cheapest) code review → Claude Opus 4.8 ($5/$25/M, best coding benchmarks) content writing → Claude Sonnet 4.6 ($3/$15/M, strongest prose + tool calling) coding (value) → GPT-5.5 ($2/$12/M, #1 Chatbot Arena, 2M context) research with grounding → Gemini 2.5 Pro ($1.25/$10/M, Google Search built in) bulk sub-agent work → DeepSeek V4 ($0.30/$0.50/M, 90% cache discount) /goal judge → Gemini Flash (cheapest, fast enough for binary done/not-done) self-hosted (free) → Qwen 3 8B via Ollama (8GB RAM, handles routine tasks)"
                                - generic [ref=e668]: MiniMax M2.7 is also worth testing. Nous Research and MiniMax are collaborating to optimize future releases for Hermes. One of the most-used models inside Hermes as of mid-2026.
                                - generic [ref=e670]:
                                  - generic [ref=e671]: "The mistake:"
                                  - generic [ref=e672]: Running every skill on your most expensive model. A routine web search skill burning Opus tokens is money wasted. Match model cost to task complexity.
                                - generic [ref=e674]:
                                  - generic [ref=e675]: "Example:"
                                  - generic [ref=e676]: you run a competitive research skill on DeepSeek V4 Flash instead of Opus 4.8. comparable quality for web search. 30-50x cheaper per call. over 30 runs a month the savings add up fast.
                                - separator [ref=e678]
                                - generic [ref=e681]: LEVEL 5 — MCPs (CONNECT YOUR WORLD)
                                - generic [ref=e683]:
                                  - generic [ref=e684]: "What it is:"
                                  - generic [ref=e685]: MCP (Model Context Protocol) servers connect Hermes to external tools. Gmail, Calendar, Notion, Slack, ClickUp, GitHub, databases, APIs.
                                - generic [ref=e687]:
                                  - generic [ref=e688]: "What it unlocks:"
                                  - generic [ref=e689]: The agent works with YOUR data, not just the open web. It reads your emails, checks your calendar, pulls from your project board, and answers questions using context from the tools you already use.
                                - generic [ref=e692]: "Setup:"
                                - generic [ref=e694]:
                                  - generic [ref=e695]: "Desktop app / Dashboard: MCP → Catalog → browse and install CLI:"
                                  - generic [ref=e696]: hermes mcp
                                - generic [ref=e698]:
                                  - generic [ref=e699]: "The mistake:"
                                  - generic [ref=e700]: Connecting 15 MCPs at once. Every MCP adds tool schemas to the context window. 15 MCPs with 10 tools each = 150 tool definitions the model reads every turn. Install what you use. Disable what you don't. Tool Search (auto-enabled when schemas eat 10%+ context) helps manage this, but fewer MCPs is still better.
                                - generic [ref=e702]:
                                  - generic [ref=e703]: "Example:"
                                  - generic [ref=e704]: "\"what happened in Slack this week while I was heads-down coding?\" Agent reads your Slack channels, filters by mentions and key topics, cross-references with your goals in memory. delivers a 10-line summary. no tab switching. no scrolling through 200 messages."
                                - separator [ref=e706]
                                - generic [ref=e709]: LEVEL 6 — SUB-AGENTS + PARALLEL EXECUTION
                                - generic [ref=e711]:
                                  - generic [ref=e712]: "What it is:"
                                  - generic [ref=e713]: delegate_task spawns isolated sub-agents with their own context window, terminal session, and toolset.
                                - generic [ref=e715]:
                                  - generic [ref=e716]: "What it unlocks:"
                                  - generic [ref=e717]: Parallel work across multiple agents. One researches. One critiques. One codes. Parent orchestrates. Each child can run a different model.
                                - generic [ref=e720]: "Setup:"
                                - generic [ref=e723]: "The agent uses delegate_task automatically when the task benefits from isolation. You can also ask directly:"
                                - generic [ref=e726]: "\"spin up a sub-agent on DeepSeek to research X while another on GPT-5.5 critiques the findings\""
                                - generic [ref=e729]: "Configuration:"
                                - generic [ref=e732]: "set in Desktop app, Dashboard, or config.yaml:"
                                - blockquote [ref=e733]:
                                  - generic [ref=e735]: "delegation: max_concurrent_children: 3 # default max_spawn_depth: 2 # bounds recursion"
                                - generic [ref=e737]:
                                  - generic [ref=e738]: "Roles:"
                                  - generic [ref=e739]: "→ leaf (default): executes, cannot re-delegate → orchestrator: can spawn its own workers"
                                - generic [ref=e741]:
                                  - generic [ref=e742]: "Background mode (v0.17.0):"
                                  - generic [ref=e743]: delegate_task(background=true) dispatches the sub-agent and returns immediately. Your session stays live. Result re-enters as a new turn when it finishes.
                                - generic [ref=e745]:
                                  - generic [ref=e746]: "The mistake:"
                                  - generic [ref=e747]: Using sub-agents for simple tasks. Delegation has overhead (context setup, tool allocation). A task the main agent can handle in 3 turns should not spawn a sub-agent.
                                - generic [ref=e749]:
                                  - generic [ref=e750]: "Example:"
                                  - generic [ref=e751]: "\"research three competitors in parallel. one agent per competitor. use DeepSeek for research. parent on Sonnet synthesizes all three.\" three reports in 10 minutes instead of 30. each agent works isolated so one slow research task doesn't block the others."
                                - separator [ref=e753]
                                - generic [ref=e756]: LEVEL 7 — ASYNC OPERATIONS
                                - generic [ref=e758]:
                                  - generic [ref=e759]: "What it is:"
                                  - generic [ref=e760]: Three features that let Hermes work without you typing.
                                - generic [ref=e762]:
                                  - generic [ref=e763]: "What it unlocks:"
                                  - generic [ref=e764]: The shift from "I ask, it responds" to "it works, I review."
                                - generic [ref=e766]:
                                  - generic [ref=e767]: "/goal — persistent objectives:"
                                  - generic [ref=e768]: "Set a goal. A judge model evaluates after every turn: done or not done? Agent continues automatically until the goal is achieved, you pause it, or the turn budget (default 20) runs out."
                                - blockquote [ref=e769]:
                                  - generic [ref=e771]: /goal find 100 clinics in Toronto, build a landing page for each, draft personalized emails to each clinic.
                                - generic [ref=e774]: /subgoal adds criteria mid-run without resetting the loop.
                                - generic [ref=e776]:
                                  - generic [ref=e777]: "Cron jobs — scheduled tasks:"
                                  - generic [ref=e778]: "Gateway ticks every 60 seconds. Fires due jobs in fresh isolated sessions. Delivers results to 27+ platforms: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, iMessage, Microsoft Teams, Google Chat, LINE, email, SMS, and more."
                                - generic [ref=e781]: "v0.17.0 additions: → WhatsApp Business Cloud API (official Meta adapter, no QR bridge) → iMessage via Photon Spectrum (no Mac relay needed) → Telegram rich messages (Bot API 10.1, native formatting) → Automation Blueprints: one-click cron templates in the Dashboard (morning briefing, weekly review, news digest, reminder). No cron syntax needed."
                                - generic [ref=e784]: "Three cost layers: → no_agent mode: script IS the job, $0 forever → wakeAgent gate: script decides if LLM is needed, $0 until something changes → context_from: chain job outputs into pipelines without a framework"
                                - generic [ref=e786]:
                                  - generic [ref=e787]: "Safety net — checkpoints:"
                                  - generic [ref=e788]: Enable checkpoints before running autonomous operations. The agent snapshots your working directory before changes.
                                  - generic [ref=e789]: /rollback
                                  - generic [ref=e790]: restores state if something goes wrong overnight.
