                                - generic [ref=e1124]: LEVEL 9 — SELF-IMPROVING KNOWLEDGE BASE
                                - generic [ref=e1126]:
                                  - generic [ref=e1127]: "What it is:"
                                  - generic [ref=e1128]: The LLM Wiki skill, based on Andrej Karpathy's pattern. A self-improving knowledge base built as interlinked markdown files. Ships bundled with Hermes.
                                - generic [ref=e1130]:
                                  - generic [ref=e1131]: "What it unlocks:"
                                  - generic [ref=e1132]: "Long-term knowledge that compounds beyond the memory cap. Hermes's built-in memory handles conversational context. The wiki handles domain knowledge: articles, transcripts, meeting notes, research findings. Cross-references stay linked. Contradictions get flagged automatically."
                                - generic [ref=e1135]: "Setup:"
                                - generic [ref=e1138]: "set in Desktop app, Dashboard, or config.yaml:"
                                - blockquote [ref=e1139]:
                                  - generic [ref=e1141]: WIKI_PATH=~/obsidian-wiki
                                - generic [ref=e1144]: On first run, the skill asks for your domain to build SCHEMA.md with the right tag taxonomy.
                                - generic [ref=e1147]: "Connect to Obsidian for graph view: set OBSIDIAN_VAULT_PATH to the same directory."
                                - generic [ref=e1150]: "Feed it: \"index this article into my wiki: [paste URL or text]\""
                                - generic [ref=e1152]:
                                  - generic [ref=e1153]: "The mistake:"
                                  - generic [ref=e1154]: "Never feeding the wiki. An empty knowledge base adds nothing. The value comes from accumulation. Month 1: 50 entries. Month 3: 300+ entries with cross-references. The agent gets sharper because the knowledge base got sharper."
                                - generic [ref=e1156]:
                                  - generic [ref=e1157]: "Example:"
                                  - generic [ref=e1158]: "you ask \"how does competitor X handle onboarding?\" Without wiki: agent searches the web, gives you generic info. With 3 months of wiki entries: agent pulls your own research notes, meeting transcripts where a client mentioned competitor X, and an article you indexed last month. answer includes context no web search could find."
                                - separator [ref=e1160]
                                - generic [ref=e1163]: LEVEL 10 — KANBAN ORCHESTRATION
                                - generic [ref=e1165]:
                                  - generic [ref=e1166]: "What it is:"
                                  - generic [ref=e1167]: A durable SQLite task board shared across all profiles. Statuses flow from triage → todo → ready → running → blocked → done → archived. Dispatcher fires every 60 seconds.
                                - generic [ref=e1169]:
                                  - generic [ref=e1170]: "What it unlocks:"
                                  - generic [ref=e1171]: Complex multi-step projects with dependency chains. Each card can run its own /goal loop (goal_mode). Cards with unfinished parent cards wait automatically. Multiple profiles pick up cards assigned to them.
                                - generic [ref=e1174]: "Setup:"
                                - blockquote [ref=e1175]:
                                  - generic [ref=e1177]: /kanban create "Research 100 clinics" \ --assignee scout --goal --goal-max-turns 15 /kanban create "Build landing pages" \ --assignee coder --goal --goal-max-turns 20 \ --depends-on "Research 100 clinics"
                                - generic [ref=e1179]:
                                  - generic [ref=e1180]: "CLI:"
                                  - generic [ref=e1181]: hermes kanban
                                  - generic [ref=e1182]: or
                                  - generic [ref=e1183]: /kanba
                                  - generic [ref=e1184]: n in chat.
                                - generic [ref=e1186]:
                                  - generic [ref=e1187]: "Kanban vs cron vs delegate_task:"
                                  - generic [ref=e1188]: "→ Kanban: durable work queue, persists across restarts, multi-profile → Cron: time-based scheduling, repeating tasks → delegate_task: one-off parallel execution within a session"
                                - generic [ref=e1190]:
                                  - generic [ref=e1191]: "The mistake:"
                                  - generic [ref=e1192]: Using Kanban for simple linear pipelines. Three profiles in a straight line (Scout → Analyst → Briefer) work fine with file-based coordination. Kanban adds value when you have dependency trees, parallel branches, or 10+ tasks that need tracking.
                                - generic [ref=e1194]:
                                  - generic [ref=e1195]: "Example:"
                                  - generic [ref=e1196]: "quarterly competitive analysis as a Kanban project. 12 cards: 3 competitors × 4 dimensions (pricing, features, positioning, hiring signals). pricing card depends on web scraping card. hiring card depends on LinkedIn research card. agents pick up work as dependencies clear. you review the final synthesized report."
