- generic [ref=e2]: "{\"code\":200,\"message\":\"OK\",\"tweet\":{\"url\":\"https://x.com/0x_rody/status/2063295395434831922\",\"id\":\"2063295395434831922\",\"text\":\"\",\"raw_text\":{\"text\":\"https://t.co/fpVriNKKq4\",\"display_text_range\":[0,23],\"facets\":[]},\"author\":{\"screen_name\":\"0x_rody\",\"url\":\"https://x.com/0x_rody\",\"id\":\"1386319613391253504\",\"followers\":1460,\"following\":54,\"likes\":506,\"media_count\":20,\"name\":\"rody\",\"description\":\"AI tools analyst | Code & consciousness | @zscdao\",\"raw_description\":{\"text\":\"AI tools analyst | Code & consciousness | @zscdao\",\"facets\":[]},\"location\":\"San Diego, CA\",\"banner_url\":\"https://pbs.twimg.com/profile_banners/1386319613391253504/1775673301\",\"avatar_url\":\"https://pbs.twimg.com/profile_images/2041947351120572416/4IBmZ3QT_200x200.jpg\",\"joined\":\"Sun Apr 25 14:02:14 +0000 2021\",\"protected\":false,\"website\":null,\"verification\":{\"verified\":true,\"verified_at\":null,\"type\":\"individual\"},\"avatar_color\":null},\"replies\":8,\"retweets\":29,\"likes\":256,\"bookmarks\":1159,\"quotes\":10,\"created_at\":\"Sat Jun 06 16:22:11 +0000 2026\",\"created_timestamp\":1780762931,\"possibly_sensitive\":false,\"views\":344416,\"is_note_tweet\":false,\"community_note\":null,\"lang\":null,\"replying_to\":null,\"replying_to_status\":null,\"source\":\"Twitter Web App\",\"article\":{\"created_at\":\"2026-06-06T16:22:11.000Z\",\"modified_at\":\"2026-06-06T16:27:15.000Z\",\"id\":\"2063292070828093440\",\"title\":\"How to Make Claude Code Stop Making Stuff Up When It Doesn't Know (Exact Setup Inside) \",\"preview_text\":\"Claude Code lies to your face every day. Made-up functions, fake imports, \\\"tests pass\\\" when nothing ran. The fix is a 4-layer setup that makes lying expensive.\\nClaude tells you the bug is fixed. Two\",\"cover_media\":{\"id\":\"QXBpTWVkaWE6DAAFCgABHKJMI9zXcAAKAAITPTJX5VewAAAA\",\"media_id\":\"2063295296201781248\",\"media_info\":{\"__typename\":\"ApiImage\",\"color_info\":{\"palette\":[{\"percentage\":67.97,\"rgb\":{\"blue\":238,\"green\":243,\"red\":244}},{\"percentage\":24,\"rgb\":{\"blue\":30,\"green\":30,\"red\":30}},{\"percentage\":1.72,\"rgb\":{\"blue\":143,\"green\":124,\"red\":177}},{\"percentage\":1.07,\"rgb\":{\"blue\":41,\"green\":43,\"red\":66}},{\"percentage\":0.97,\"rgb\":{\"blue\":37,\"green\":67,\"red\":33}}]},\"original_img_height\":578,\"original_img_url\":\"https://pbs.twimg.com/media/HKJMI9zXcAAvJn4.jpg\",\"original_img_width\":1446},\"media_key\":\"3_2063295296201781248\"},\"content\":{\"blocks\":[{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"6fg1t\",\"text\":\"Claude Code lies to your face every day. Made-up functions, fake imports, \\\"tests pass\\\" when nothing ran. The fix is a 4-layer setup that makes lying expensive.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"el1mr\",\"text\":\"Claude tells you the bug is fixed. Two hours later you find out the function it called never existed.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"f2uap\",\"text\":\"Most devs learn to double-check everything and blame the model. The real fix catches every lie before it leaves your machine.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":0,\"length\":1,\"offset\":30}],\"inlineStyleRanges\":[{\"length\":31,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"cge6i\",\"text\":\"Here's the full honesty setup 👇\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":1,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"et2sl\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"faa2\",\"text\":\"Why Claude makes stuff up in the first place\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"ace17\",\"text\":\"Claude is a text predictor. When it doesn't know something, it predicts text that looks right. Made-up function names look like real ones. Confidently delivered nonsense reads the same as confidently delivered truth.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"2fvr0\",\"text\":\"You can't tell the difference until your code breaks two hours later in a way that takes another hour to debug.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"6a12l\",\"text\":\"The fix isn't a smarter model. It's making Claude's output checkable in real time and making \\\"I don't know\\\" cheaper than guessing. \",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"44pmo\",\"text\":\"4 layers below. Together they cut fabrication to roughly zero.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":2,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"fuu7u\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"b70nd\",\"text\":\"Layer 1: The CLAUDE.md honesty rules\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"bsf75\",\"text\":\"The first layer is a set of rules in CLAUDE.md that tell Claude exactly when to admit uncertainty and exactly how. Drop this in your project root:\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":3,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"2hscm\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"aof0c\",\"text\":\"These rules look obvious. \",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"5opmp\",\"text\":\"They aren't, because by default Claude is optimized to look helpful, and \\\"I don't know\\\" feels unhelpful unless you give it explicit permission.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"e9vu5\",\"text\":\"The last line is the most important one. It's the \\\"I don't know\\\" license, and most people never grant it.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"bimld\",\"text\":\"Layer 2: The verification-before-write pattern\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"bmqba\",\"text\":\"The second layer forces Claude to verify before it writes. Add this to CLAUDE.md under the honesty rules:\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":4,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"41ebv\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"8o1eg\",\"text\":\"This costs Claude a few extra tool calls per session. It saves you the hours you would've spent debugging fake function calls.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"5eieb\",\"text\":\"Layer 3: The hooks that catch lies in real time\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":13,\"offset\":28,\"style\":\"Bold\"}],\"key\":\"fe1q8\",\"text\":\"The third layer is hooks in settings.json that run a type checker or linter every time Claude writes a file. If Claude invented an import, the checker fails instantly, and Claude has to fix it before claiming the task is done.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":5,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"dj04s\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":11,\"offset\":172,\"style\":\"Bold\"}],\"key\":\"64jeh\",\"text\":\"Hook output goes back to Claude as context. If tsc says \\\"Cannot find module 'foo'\\\", Claude sees it immediately and fixes the fabricated import. No invented code survives a PostToolUse check.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":4,\"offset\":33,\"style\":\"Bold\"}],\"key\":\"6d5s6\",\"text\":\"For tasks involving tests, add a Stop hook that runs the suite before Claude can declare the session done:\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":6,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"mqu2\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"cd8qo\",\"text\":\"Now Claude can't say \\\"done, tests pass\\\" without actually running them. The hook runs them. \",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"1vptn\",\"text\":\"The result goes back to Claude. If they fail, Claude has to fix them or admit they don't pass.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"9jd52\",\"text\":\"Layer 4: The fact-checker subagent\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"e9f0r\",\"text\":\"The fourth layer is a subagent whose only job is to review Claude's claims before they ship. \",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":31,\"offset\":13,\"style\":\"Bold\"}],\"key\":\"985s3\",\"text\":\"Drop this in .claude/agents/fact-checker.md:\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":7,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"aauhm\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"ef171\",\"text\":\"Invoke this agent before commits or before sharing results with your team. It catches the lies the other 3 layers missed.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":8,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"bscha\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"ath9l\",\"text\":\"The \\\"I don't know\\\" license\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"1u6k8\",\"text\":\"Claude was trained to be helpful, and admitting ignorance feels unhelpful. So it guesses, and the guess looks right.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"3i7ac\",\"text\":\"The fix is granting permission to not know. CLAUDE.md is half of it. Your reaction is the other half. Reward \\\"I haven't verified this\\\" with patience and you get honest Claude every session. Punish it with frustration and Claude goes back to guessing.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"eqhc9\",\"text\":\"Not a config, a habit. The most underrated fix in the stack.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"2fg3u\",\"text\":\"How to tell it's actually working\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"fge20\",\"text\":\"Three signs in your daily sessions.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":12,\"offset\":94,\"style\":\"Bold\"}],\"key\":\"dmifc\",\"text\":\"Claude asks before adding dependencies. \\\"Should I add X or use the stdlib?\\\" instead of silent npm install.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":13,\"offset\":64,\"style\":\"Bold\"},{\"length\":32,\"offset\":81,\"style\":\"Bold\"}],\"key\":\"2jpkq\",\"text\":\"Claude references file:line when it talks about existing code. \\\"validateToken in src/auth/middleware.ts:47 does Y\\\" instead of \\\"the validateToken function does Y.\\\"\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"48ahl\",\"text\":\"tsc and your linter stop screaming. Hooks catch the rare fabrications instantly and Claude self-corrects, so by the time you look, the lies are gone.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"dsn3j\",\"text\":\"Not seeing these after a day or two? One layer isn't loaded. Usually CLAUDE.md, wrong location or wrong name.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":9,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"911d0\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"a9im3\",\"text\":\"Common mistakes that keep Claude lying\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":22,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"52k3v\",\"text\":\"CLAUDE.md is too long. Claude reads the first part and skims the rest. Honesty rules in the first 50 lines.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":19,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"61ru0\",\"text\":\"Hooks log silently. If output doesn't reach stdout, Claude doesn't know it lied. Make sure hook output goes back to the session.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":19,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"87sj4\",\"text\":\"You skip plan mode. That's where Claude exposes wrong assumptions before writing. Skip it and you skip the cheapest moment to catch lies.\",\"type\":\"unstyled\"},{\"data\":{\"mentions\":[{\"fromIndex\":87,\"text\":\"fact\",\"toIndex\":92}]},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":32,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"6pn83\",\"text\":\"You don't call the fact-checker. A subagent only works if you actually invoke it. Make @fact-checker part of your commit flow.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":34,\"offset\":0,\"style\":\"Bold\"}],\"key\":\"9fnd4\",\"text\":\"You react badly to \\\"I don't know.\\\" Punish honesty once and Claude goes back to guessing. The other 3 layers don't stick without this one.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":10,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"40vlu\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"eco5b\",\"text\":\"The 5-minute honesty audit\",\"type\":\"header-two\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"fpho7\",\"text\":\"1 minute: copy the CLAUDE.md honesty rules and verification protocol into your project root.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":23,\"offset\":36,\"style\":\"Bold\"}],\"key\":\"8m6ag\",\"text\":\"1 minute: copy the hooks block into ~/.claude/settings.json or .claude/settings.json.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[{\"length\":30,\"offset\":18,\"style\":\"Bold\"}],\"key\":\"8s60c\",\"text\":\"2 minutes: create .claude/agents/fact-checker.md with the template above.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"4fjg7\",\"text\":\"1 minute: run a task you'd normally double-check. Watch for tsc output coming back to Claude. Confirm Claude says \\\"verified\\\" or \\\"I haven't verified this\\\" explicitly.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"9abcv\",\"text\":\"Done. Fabrication drops from \\\"every other session\\\" to \\\"rare and caught immediately.\\\" The model didn't get smarter. Your setup did.\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"5b2gk\",\"text\":\"Thanks for reading!\",\"type\":\"unstyled\"},{\"data\":{},\"entityRanges\":[{\"key\":11,\"length\":1,\"offset\":0}],\"inlineStyleRanges\":[],\"key\":\"f053i\",\"text\":\" \",\"type\":\"atomic\"},{\"data\":{},\"entityRanges\":[],\"inlineStyleRanges\":[],\"key\":\"8dhsb\",\"text\":\"\",\"type\":\"unstyled\"}],\"entityMap\":[{\"key\":\"8\",\"value\":{\"data\":{\"entityKey\":\"ef1a965e-5950-4fda-ae7c-ed5951dbdb5f\",\"mediaItems\":[{\"localMediaId\":\"5\",\"mediaCategory\":\"DraftTweetImage\",\"mediaId\":\"2063293548112338944\"}]},\"mutability\":\"Immutable\",\"type\":\"MEDIA\"}},{\"key\":\"4\",\"value\":{\"data\":{\"entityKey\":\"f20d6a00-5375-4dc1-91b7-3992119f37c6\",\"markdown\":\"```markdown\\n## Verification protocol\\n\\nBefore writing or editing code that uses a symbol (function, class, type,\\nconstant), do one of:\\n\\n1. Read the file where it's defined and confirm the signature\\n2. Run `grep -r \\\"symbolName\\\" .` or use the Glob tool to find it\\n3. Check package.json, requirements.txt, Cargo.toml, or equivalent for\\n the dependency\\n\\nIf you skip verification, prefix the code with a comment:\\n`// UNVERIFIED: I have not confirmed this symbol exists`\\n\\nPlan-then-execute mode is preferred for any task touching more than one\\nfile. Use Shift+Tab to enter plan mode before starting.\\n```\"},\"mutability\":\"Mutable\",\"type\":\"MARKDOWN\"}},{\"key\":\"11\",\"value\":{\"data\":{\"entityKey\":\"5a6ada0c-2a78-47f1-8927-872a0a84c188\",\"mediaItems\":[{\"localMediaId\":\"6\",\"mediaCategory\":\"DraftTweetImage\",\"mediaId\":\"2063296636952920064\"}]},\"mutability\":\"Immutable\",\"type\":\"MEDIA\"}},{\"key\":\"9\",\"value\":{\"data\":{\"entityKey\":\"7ed105a5-6cc5-4e01-82f4-496a6085eff2\",\"mediaItems\":[{\"localMediaId\":\"7\",\"mediaCategory\":\"DraftTweetImage\",\"mediaId\":\"2063294676887547904\"}]},\"mutability\":\"Immutable\",\"type\":\"MEDIA\"}},{\"key\":\"5\",\"value\":{\"data\":{\"entityKey\":\"14619fd0-3897-44f2-bc80-a138a67eb16d\",\"markdown\":\"```json\\n{\\n \\\"hooks\\\": {\\n \\\"PostToolUse\\\": [\\n {\\n \\\"matcher\\\": \\\"Write(*.ts|*.tsx)|Edit(*.ts|*.tsx)\\\",\\n \\\"hooks\\\": [\\n { \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"npx tsc --noEmit --pretty false 2>&1 | head -20\\\" }\\n ]\\n },\\n {\\n \\\"matcher\\\": \\\"Write(*.py)|Edit(*.py)\\\",\\n \\\"hooks\\\": [\\n { \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"ruff check --quiet $file && pyright $file 2>&1 | head -20\\\" }\\n ]\\n },\\n {\\n \\\"matcher\\\": \\\"Write(*.rs)|Edit(*.rs)\\\",\\n \\\"hooks\\\": [\\n { \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"cargo check --message-format=short 2>&1 | head -20\\\" }\\n ]\\n }\\n ]\\n }\\n}\\n```\"},\"mutability\":\"Mutable\",\"type\":\"MARKDOWN\"}},{\"key\":\"10\",\"value\":{\"data\":{\"entityKey\":\"87fb8f70-b41a-4167-b783-8218b965e747\",\"mediaItems\":[{\"localMediaId\":\"9\",\"mediaCategory\":\"DraftTweetImage\",\"mediaId\":\"2063294839483994112\"}]},\"mutability\":\"Immutable\",\"type\":\"MEDIA\"}},{\"key\":\"6\",\"value\":{\"data\":{\"entityKey\":\"ca96a282-4734-40f0-a062-8bae3b0ce913\",\"markdown\":\"```json\\n\\\"Stop\\\": [\\n {\\n \\\"hooks\\\": [\\n { \\\"type\\\": \\\"command\\\", \\\"command\\\": \\\"npm test 2>&1 | tail -30\\\" }\\n ]\\n }\\n]\\n\\n```\"},\"mutability\":\"Mutable\",\"type\":\"MARKDOWN\"}},{\"key\":\"1\",\"value\":{\"data\":{\"entityKey\":\"7f00e37a-571c-48a5-aaca-4f62b2dd9b93\",\"mediaItems\":[{\"localMediaId\":\"1\",\"mediaCategory\":\"DraftTweetImage\",\"mediaId\":\"2063292459581362176\"}]},\"mutability\":\"Immutable\",\"type\":\"MEDIA\"}},{\"key\":\"0\",\"value\":{\"data\":{\"url\":\"https://abs.twimg.com/emoji/v2/svg/1f447.svg\"},\"mutability\":\"Immutable\",\"type\":\"TWEMOJI\"}},{\"key\":\"2\",\"value\":{\"data\":{\"entityKey\":\"003c803d-e391-4f0d-a081-680b4beabaab\",\"mediaItems\":[{\"localMediaId\":\"3\",\"mediaCategory\":\"DraftTweetImage\",\"mediaId\":\"2063292689261494272\"}]},\"mutability\":\"Immutable\",\"type\":\"MEDIA\"}},{\"key\":\"7\",\"value\":{\"data\":{\"entityKey\":\"ab5d6487-60b4-47b5-9ec3-92995275efe9\",\"markdown\":\"```yaml\\n---\\nname: fact-checker\\ndescription: Use this agent after Claude has made claims about what code does, what tests passed, or what a library supports. Invoke before any commit, before any user-facing summary, and after any task that involved new dependencies.\\ntools: Read, Grep, Glob, Bash\\nmodel: sonnet\\n---\\n\\nYou verify claims, you do not write code.\\n\\nWhen invoked, do this:\\n\\n1. Identify every factual claim in the recent conversation. Examples:\\n \\\"the function X does Y\\\", \\\"the tests pass\\\", \\\"library Z supports W\\\",\\n \\\"this import is correct\\\".\\n\\n2. For each claim, verify it independently:\\n - Code claims: read the actual file and confirm\\n - Test claims: run the tests yourself\\n - Library claims: check the actual package or its docs\\n - Import claims: confirm the package is in the dependency manifest\\n\\n3. Produce a report:\\n - VERIFIED: claim, evidence (file:line or command output)\\n - WRONG: claim, what's actually true\\n - UNVERIFIABLE: claim, why you couldn't check it\\n\\nNever accept \\\"trust me\\\" claims. Never make claims of your own. If you\\ncan't verify, the correct output is UNVERIFIABLE.\\n```\"},\"mutability\":\"Mutable\",\"type\":\"MARKDOWN\"}},{\"key\":\"3\",\"value\":{\"data\":{\"entityKey\":\"2f1b2108-8bc9-4d39-a258-40434e83a114\",\"markdown\":\"```markdown\\n## Honesty rules (read every turn)\\n\\nBefore claiming a function, class, or import exists, verify it by reading\\nthe file or running a grep. Never fabricate symbols.\\n\\nIf you cannot verify something, say \\\"I haven't verified this\\\" explicitly.\\nDo not write code that depends on the unverified claim.\\n\\nIf a task asks you to use a library you've never seen referenced in this\\nproject, ask before adding it.\\n\\nIf a task involved tests or builds, do not claim success unless you\\nactually ran the test or build command in this session.\\n\\nNever invent error messages, API responses, or stack traces. If you\\ndidn't see them, say so.\\n\\nWhen you genuinely don't know, the correct answer is \\\"I don't know\\\" or\\n\\\"I need to check first.\\\" Both are better than a confident guess.\\n```\"},\"mutability\":\"Mutable\",\"type\":\"MARKDOWN\"}}]}