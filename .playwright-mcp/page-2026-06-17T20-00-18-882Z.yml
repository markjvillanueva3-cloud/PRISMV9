                                  - heading "1. Build a tokenizer from scratch" [level=2] [ref=e468]:
                                    - generic [ref=e470]: 1. Build a tokenizer from scratch
                                  - generic [ref=e473]: Before you train a model, you decide how the world becomes symbols. That decision affects compression, multilingual behavior, rare words, code, math, emojis, latency, context usage, and model quality.
                                  - generic [ref=e476]: Start by implementing byte-pair encoding. Train a tiny subword vocabulary on a small corpus. Then compare it with unigram/SentencePiece-style tokenization. BPE became central because it handles rare words by composing them from subword units, while SentencePiece made tokenization trainable directly from raw text without assuming pre-tokenized whitespace-separated words.
                                  - heading "2. One-hot vectors, learned embeddings, and semantic geometry" [level=2] [ref=e478]:
                                    - generic [ref=e480]: 2. One-hot vectors, learned embeddings, and semantic geometry
                                  - generic [ref=e483]: A token ID by itself has no meaning. Meaning starts when IDs become vectors. Build the simplest possible embedding table and learn it on a next-token objective.
                                  - 'heading "Part II: Position Gives Tokens Order" [level=1] [ref=e485]':
                                    - generic [ref=e487]: "Part II: Position Gives Tokens Order"
                                  - link "Image" [ref=e494] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744281020432384
                                    - generic "Image" [ref=e498]:
                                      - img "Image" [ref=e500]
                                  - heading "3. Implement sinusoidal, learned, RoPE, and ALiBi positional methods" [level=2] [ref=e502]:
                                    - generic [ref=e504]: 3. Implement sinusoidal, learned, RoPE, and ALiBi positional methods
                                  - generic [ref=e507]: Attention alone is permutation-invariant. Without position, "dog bites man" and "man bites dog" look too similar. The original Transformer used sinusoidal positional encodings; later systems often use learned positions, rotary position embeddings, ALiBi, or RoPE-scaling variants. RoPE encodes relative position through rotations in embedding space, while ALiBi biases attention scores based on distance and was designed to improve length extrapolation.
                                  - 'heading "Part III: Attention Makes Context Useful" [level=1] [ref=e509]':
                                    - generic [ref=e511]: "Part III: Attention Makes Context Useful"
                                  - link "Image" [ref=e518] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744314809741312
                                    - generic "Image" [ref=e522]:
                                      - img "Image" [ref=e524]
                                  - heading "4. Hand-wire scaled dot-product attention for one token" [level=2] [ref=e526]:
                                    - generic [ref=e528]: 4. Hand-wire scaled dot-product attention for one token
                                  - generic [ref=e531]: Before implementing a Transformer block, implement attention for a single query. Compute Q, K, V manually. Take the dot product. Scale it. Softmax it. Use it to form a weighted sum of values.
                                  - generic [ref=e534]: The Transformer replaced recurrence with attention, making it possible to parallelize training over sequences while letting every token attend to other tokens. That design choice is still the foundation of most LLMs.
                                  - heading "5. Scale attention to multi-head attention" [level=2] [ref=e536]:
                                    - generic [ref=e538]: 5. Scale attention to multi-head attention
                                  - generic [ref=e541]: Multi-head attention lets different subspaces learn different relational patterns. Some heads may specialize in local syntax, induction-like copying, delimiter tracking, or long-range dependencies.
                                  - 'heading "Part IV: The Transformer Block" [level=1] [ref=e543]':
                                    - generic [ref=e545]: "Part IV: The Transformer Block"
                                  - link "Image" [ref=e552] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744354525626368
                                    - generic "Image" [ref=e556]:
                                      - img "Image" [ref=e558]
                                  - heading "6. Build a single Transformer decoder block" [level=2] [ref=e560]:
                                    - generic [ref=e562]: 6. Build a single Transformer decoder block
                                  - generic [ref=e565]: "Now stack the pieces: Token embedding, positional method, masked multi-head attention, residual connection, normalization, feed-forward network, and output projection."
                                  - generic [ref=e568]: Modern decoder blocks are typically pre-norm, use RMSNorm or LayerNorm variants, and often use gated MLPs such as SwiGLU rather than the oldest ReLU-style feed-forward block. RMSNorm simplifies LayerNorm by focusing on rescaling, and GLU/SwiGLU-style feed-forward layers have been shown to improve Transformer performance in several settings.
                                  - heading "7. Stack blocks into a \"mini-former\"" [level=2] [ref=e570]:
                                    - generic [ref=e572]: 7. Stack blocks into a "mini-former"
                                  - generic [ref=e575]: Train a tiny decoder-only model on toy text. The point is not to build a useful chatbot. The point is to understand the training loop.
                                  - 'heading "Part V: Objectives Define What The Model Learns" [level=1] [ref=e577]':
                                    - generic [ref=e579]: "Part V: Objectives Define What The Model Learns"
                                  - link "Image" [ref=e586] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744401740857344
                                    - generic "Image" [ref=e590]:
                                      - img "Image" [ref=e592]
                                  - heading "8. Compare causal LM, masked LM, prefix LM, and denoising objectives" [level=2] [ref=e594]:
                                    - generic [ref=e596]: 8. Compare causal LM, masked LM, prefix LM, and denoising objectives
                                  - generic [ref=e599]: Different objectives produce different capabilities. BERT used masked language modeling to build bidirectional representations. GPT-style models use causal next-token prediction. T5 framed many NLP tasks as text-to-text generation with denoising objectives. UL2 mixed several denoising modes to cover causal, prefix, and bidirectional behavior.
                                  - 'heading "Part VI: Decoding Turns Probabilities Into Text" [level=1] [ref=e601]':
                                    - generic [ref=e603]: "Part VI: Decoding Turns Probabilities Into Text"
                                  - link "Image" [ref=e610] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744448155086848
                                    - generic "Image" [ref=e614]:
                                      - img "Image" [ref=e616]
                                  - heading "9. Build a sampling dashboard" [level=2] [ref=e618]:
                                    - generic [ref=e620]: 9. Build a sampling dashboard
                                  - generic [ref=e623]: A model outputs logits. A product outputs text. Decoding is the bridge.
                                  - heading "10. Implement speculative decoding" [level=2] [ref=e625]:
                                    - generic [ref=e627]: 10. Implement speculative decoding
                                  - generic [ref=e630]: "Autoregressive decoding is sequential: One token depends on the previous token. Speculative decoding accelerates generation by using a smaller draft model to propose tokens that a larger model verifies, preserving the target distribution when implemented correctly."
                                  - generic [ref=e633]: Newer variants reduce or remove the need for a separate draft model. Medusa adds extra decoding heads to propose multiple future tokens, while lookahead decoding explores parallel candidate n-grams without an auxiliary model.
                                  - 'heading "Part VII: KV Cache And Memory-Bound Inference" [level=1] [ref=e635]':
                                    - generic [ref=e637]: "Part VII: KV Cache And Memory-Bound Inference"
                                  - link "Image" [ref=e644] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744518602543104
                                    - generic "Image" [ref=e648]:
                                      - img "Image" [ref=e650]
                                  - heading "11. Build a KV cache" [level=2] [ref=e652]:
                                    - generic [ref=e654]: 11. Build a KV cache
                                  - generic [ref=e657]: During autoregressive inference, past keys and values do not need to be recomputed every step. KV caching stores them. This is one of the most important practical differences between training and inference.
                                  - heading "12. Implement MQA, GQA, and study MLA" [level=2] [ref=e659]:
                                    - generic [ref=e661]: 12. Implement MQA, GQA, and study MLA
                                  - generic [ref=e664]: Standard multi-head attention gives every query head its own key and value heads. Multi-query attention shares keys and values across query heads to reduce memory bandwidth. Grouped-query attention is a middle ground that keeps several KV heads rather than one, often preserving more quality while improving inference efficiency.
                                  - generic [ref=e667]: By 2026, KV-cache reduction is a major architecture design axis. DeepSeek-V2 introduced Multi-head Latent Attention, a low-rank KV compression approach, and DeepSeek-V3 continued combining MLA with sparse MoE scaling.
                                  - 'heading "Part VIII: Long Context Is A Systems Problem" [level=1] [ref=e669]':
                                    - generic [ref=e671]: "Part VIII: Long Context Is A Systems Problem"
                                  - link "Image" [ref=e678] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744561942351872
                                    - generic "Image" [ref=e682]:
                                      - img "Image" [ref=e684]
                                  - heading "13. Build sliding-window attention and attention-sink experiments" [level=2] [ref=e686]:
                                    - generic [ref=e688]: 13. Build sliding-window attention and attention-sink experiments
                                  - generic [ref=e691]: Long context is not solved by increasing a number in a config file. Models can lose information, over-attend to irrelevant tokens, collapse on long sequences, or become too expensive to serve.
                                  - generic [ref=e694]: Mistral 7B popularized a practical combination of sliding-window attention and grouped-query attention in an open model. StreamingLLM showed that preserving early "attention sink" tokens can stabilize streaming generation over very long token streams.
                                  - heading "14. Extend context with RoPE scaling, YaRN-style interpolation, and memory mechanisms" [level=2] [ref=e696]:
                                    - generic [ref=e698]: 14. Extend context with RoPE scaling, YaRN-style interpolation, and memory mechanisms
                                  - generic [ref=e701]: Context extension often combines positional interpolation, fine-tuning, efficient attention, and evaluation. YaRN showed that RoPE-based context extension can be much more data- and compute-efficient than some previous approaches. Infini-attention introduced a compressive memory mechanism designed to scale Transformer-like models to unbounded input lengths with bounded memory and computation.
                                  - 'heading "Part IX: Efficient Attention And Hardware-Aware Modeling" [level=1] [ref=e703]':
                                    - generic [ref=e705]: "Part IX: Efficient Attention And Hardware-Aware Modeling"
                                  - link "Image" [ref=e712] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744609237352448
                                    - generic "Image" [ref=e716]:
                                      - img "Image" [ref=e718]
                                  - heading "15. Compare naive attention, PyTorch SDPA, and FlashAttention" [level=2] [ref=e720]:
                                    - generic [ref=e722]: 15. Compare naive attention, PyTorch SDPA, and FlashAttention
                                  - generic [ref=e725]: The same mathematical operation can have radically different runtime depending on memory access patterns. FlashAttention made attention faster by reducing high-bandwidth-memory reads and writes. FlashAttention-3 further optimized attention for NVIDIA Hopper GPUs using hardware-aware scheduling, asynchronous operations, and FP8 support.
                                  - 'heading "16. Learn the hardware budget: FLOPs, bandwidth, memory, and precision" [level=2] [ref=e727]':
                                    - generic [ref=e729]: "16. Learn the hardware budget: FLOPs, bandwidth, memory, and precision"
                                  - generic [ref=e732]: By 2026, LLM engineering is deeply hardware-constrained. NVIDIA Blackwell systems emphasize FP4/FP8 inference and large NVLink domains; DGX B200-class systems expose massive HBM capacity and bandwidth. Google's Ironwood TPU generation is positioned heavily around inference. AMD's MI300X carries 192GB HBM3 per accelerator for memory-heavy workloads.
                                  - 'heading "Part X: Mixture Of Experts" [level=1] [ref=e734]':
                                    - generic [ref=e736]: "Part X: Mixture Of Experts"
                                  - link "Image" [ref=e743] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744646805647360
                                    - generic "Image" [ref=e747]:
                                      - img "Image" [ref=e749]
                                  - heading "17. Build a two-expert router" [level=2] [ref=e751]:
                                    - generic [ref=e753]: 17. Build a two-expert router
                                  - generic [ref=e756]: Sparse Mixture-of-Experts models increase parameter count without activating every parameter for every token. Switch Transformer showed that sparse expert routing could scale model capacity efficiently. Mixtral demonstrated a practical open sparse MoE design where each token routes to a subset of experts, and DeepSeek's MoE work explored finer-grained experts and shared experts.
                                  - heading "18. Reproduce modern sparse-model trade-offs" [level=2] [ref=e758]:
                                    - generic [ref=e760]: 18. Reproduce modern sparse-model trade-offs
                                  - generic [ref=e763]: Recent frontier and open-weight systems use sparse activation heavily. DeepSeek-V3 reports 671B total parameters with 37B activated per token, using MLA, DeepSeekMoE, auxiliary-loss-free load balancing, and multi-token prediction. Llama 4 introduced Meta's first open-weight natively multimodal MoE model family. Qwen3 open-weighted two MoE models, Qwen3-235B-A22B and Qwen3-30B-A3B, plus six dense models.
                                  - generic [ref=e766]: Moonshot's Kimi K2 line continued the large sparse-model trend. The Kimi K2.6 model card describes a native multimodal agentic MoE model with 1T total parameters, 32B activated parameters, 256K context window, and a MoonViT vision encoder.
                                  - 'heading "Part XI: Beyond Vanilla Transformers" [level=1] [ref=e768]':
                                    - generic [ref=e770]: "Part XI: Beyond Vanilla Transformers"
                                  - link "Image" [ref=e777] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744730347782145
                                    - generic "Image" [ref=e781]:
                                      - img "Image" [ref=e783]
                                  - heading "19. Implement a toy state-space or linear-attention model" [level=2] [ref=e785]:
                                    - generic [ref=e787]: 19. Implement a toy state-space or linear-attention model
                                  - generic [ref=e790]: Transformers dominate, but they are not the only serious sequence architecture. Mamba introduced selective state-space models with linear-time sequence scaling and strong throughput claims. Mamba-2 connected state-space models and attention more directly through state-space duality. RetNet proposed retention mechanisms that can train in parallel while supporting recurrent-style inference.
                                  - heading "20. Build a diffusion-style language model toy" [level=2] [ref=e792]:
                                    - generic [ref=e794]: 20. Build a diffusion-style language model toy
                                  - generic [ref=e797]: Autoregressive generation is not the only possible decoding paradigm. LLaDA trained a diffusion-style language model from scratch using masking and denoising, challenging the assumption that high-quality language modeling must be autoregressive. Dream explored open diffusion language modeling with parallel denoising. Inception's Mercury models marketed diffusion LLMs around very high generation speed.
                                  - 'heading "Part XII: Data Is The Real Pretraining Substrate" [level=1] [ref=e799]':
                                    - generic [ref=e801]: "Part XII: Data Is The Real Pretraining Substrate"
                                  - link "Image" [ref=e808] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744773372956672
                                    - generic "Image" [ref=e812]:
                                      - img "Image" [ref=e814]
                                  - heading "21. Build a pretraining data pipeline" [level=2] [ref=e816]:
                                    - generic [ref=e818]: 21. Build a pretraining data pipeline
                                  - generic [ref=e821]: Data quality is one of the highest-impact parts of the stack. FineWeb released a 15-trillion-token dataset built from Common Crawl snapshots with filtering and deduplication choices aimed at strong open pretraining. Dolma provided the open corpus behind OLMo. DataComp-LM showed how standardized data curation experiments can substantially improve model quality at fixed compute.
                                  - 'heading "22. Synthetic data: Generate, filter, and prove it helped" [level=2] [ref=e823]':
                                    - generic [ref=e825]: "22. Synthetic data: Generate, filter, and prove it helped"
                                  - generic [ref=e828]: Synthetic data can help when it is targeted, filtered, and evaluated honestly. The phi-1 work showed that small models trained on high-quality "textbook-like" and synthetic code data could perform surprisingly well on coding benchmarks. But synthetic data can also amplify mistakes, collapse diversity, or contaminate evaluations if used carelessly.
                                  - 'heading "Part XIII: Scaling Laws And Capacity" [level=1] [ref=e830]':
                                    - generic [ref=e832]: "Part XIII: Scaling Laws And Capacity"
                                  - link "Image" [ref=e839] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744814112280576
                                    - generic "Image" [ref=e843]:
                                      - img "Image" [ref=e845]
                                  - heading "23. Train tiny, small, and medium models and fit scaling curves" [level=2] [ref=e847]:
                                    - generic [ref=e849]: 23. Train tiny, small, and medium models and fit scaling curves
                                  - generic [ref=e852]: Scaling laws quantify how loss changes with model size, data size, and compute. Kaplan-style scaling laws showed smooth power-law relationships over several orders of magnitude. Chinchilla later argued that many large models were undertrained and that compute-optimal training should scale parameters and tokens together more carefully.
                                  - 'heading "Part XIV: Post-Training Turns A Base Model Into An Assistant" [level=1] [ref=e854]':
                                    - generic [ref=e856]: "Part XIV: Post-Training Turns A Base Model Into An Assistant"
                                  - link "Image" [ref=e863] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744847192801280
                                    - generic "Image" [ref=e867]:
                                      - img "Image" [ref=e869]
                                  - heading "24. Fine-tune, instruction-tune, and preference-tune" [level=2] [ref=e871]:
                                    - generic [ref=e873]: 24. Fine-tune, instruction-tune, and preference-tune
                                  - generic [ref=e876]: A base model predicts text. An assistant follows instructions. InstructGPT showed that human-feedback fine-tuning can make models more aligned with user intent than simply scaling pretrained models. Direct Preference Optimization later simplified preference training by avoiding an explicit reward model and RL loop in many settings.
                                  - heading "25. Build a toy RLHF, PPO, GRPO, and RLVR lab" [level=2] [ref=e878]:
                                    - generic [ref=e880]: 25. Build a toy RLHF, PPO, GRPO, and RLVR lab
                                  - generic [ref=e883]: Reinforcement learning became especially important for reasoning models. OpenAI's o1 system card emphasized that performance improves with more reinforcement learning and more inference-time thinking. DeepSeek-R1 popularized an open discussion of reasoning-oriented RL, including a pure-RL R1-Zero stage and a multi-stage pipeline for the final model. DeepSeekMath introduced Group Relative Policy Optimization as a PPO-style alternative that reduces memory overhead by avoiding a separate critic model.
                                  - 'heading "Part XV: Quantization And Compression" [level=1] [ref=e885]':
                                    - generic [ref=e887]: "Part XV: Quantization And Compression"
                                  - link "Image" [ref=e894] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744909868216320
                                    - generic "Image" [ref=e898]:
                                      - img "Image" [ref=e900]
                                  - heading "26. Quantize a model and measure the damage" [level=2] [ref=e902]:
                                    - generic [ref=e904]: 26. Quantize a model and measure the damage
                                  - generic [ref=e907]: Quantization is not just "make it smaller." It changes numerical behavior, latency, memory bandwidth, and sometimes model quality.
                                  - generic [ref=e910]: GPTQ demonstrated one-shot post-training quantization for very large language models. AWQ showed that protecting a small fraction of salient weights can improve low-bit quantization. GGUF became a widely used file format in the llama.cpp ecosystem for local inference.
                                  - 'heading "Part XVI: Serving Systems" [level=1] [ref=e912]':
                                    - generic [ref=e914]: "Part XVI: Serving Systems"
                                  - link "Image" [ref=e921] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058744958484377600
                                    - generic "Image" [ref=e925]:
                                      - img "Image" [ref=e927]
                                  - heading "27. Serve the same model through multiple inference stacks" [level=2] [ref=e929]:
                                    - generic [ref=e931]: 27. Serve the same model through multiple inference stacks
                                  - generic [ref=e934]: LLM serving is its own discipline. vLLM introduced PagedAttention to reduce KV-cache memory waste and support efficient serving. TensorRT-LLM includes features such as in-flight batching, paged attention, quantization, and multi-GPU execution. SGLang emphasizes fast structured generation with features such as RadixAttention, prefix caching, scheduling, speculative decoding, and disaggregated serving.
                                  - 'heading "Part XVII: Evaluation Stops Guessing" [level=1] [ref=e936]':
                                    - generic [ref=e938]: "Part XVII: Evaluation Stops Guessing"
                                  - link "Image" [ref=e945] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058745008228814849
                                    - generic "Image" [ref=e949]:
                                      - img "Image" [ref=e951]
                                  - heading "28. Build an evaluation harness" [level=2] [ref=e953]:
                                    - generic [ref=e955]: 28. Build an evaluation harness
                                  - generic [ref=e958]: If you cannot measure a model, you cannot improve it. HELM argued for broad evaluation across accuracy, calibration, robustness, fairness, bias, toxicity, and efficiency. MMLU became a standard benchmark for broad knowledge and reasoning across many subjects. The EleutherAI language-model evaluation harness became a common open tool for standardized evaluation.
                                  - 'heading "Part XVIII: Retrieval, Tools, And Agents As Capstones" [level=1] [ref=e960]':
                                    - generic [ref=e962]: "Part XVIII: Retrieval, Tools, And Agents As Capstones"
                                  - link "Image" [ref=e969] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058745042609557504
                                    - generic "Image" [ref=e973]:
                                      - img "Image" [ref=e975]
                                  - heading "29. Build retrieval-augmented generation from scratch" [level=2] [ref=e977]:
                                    - generic [ref=e979]: 29. Build retrieval-augmented generation from scratch
                                  - generic [ref=e982]: RAG combines parametric memory in the model with non-parametric memory in an external corpus. The original RAG work showed that retrieval can improve knowledge-intensive tasks and make outputs easier to update or ground.
                                  - heading "30. Build tool use and agent loops only after you understand the stack" [level=2] [ref=e984]:
                                    - generic [ref=e986]: 30. Build tool use and agent loops only after you understand the stack
                                  - generic [ref=e989]: Agents are not fake, but they are fragile when treated as magic. ReAct showed that interleaving reasoning traces with actions can improve task solving and interpretability. Toolformer showed that models can learn to use external APIs from self-supervised signals. DSPy reframed LM pipelines as programs whose prompts and weights can be optimized.
                                  - 'heading "Part XIX: Multimodal LLMs" [level=1] [ref=e991]':
                                    - generic [ref=e993]: "Part XIX: Multimodal LLMs"
                                  - link "Image" [ref=e1000] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058745086888841216
                                    - generic "Image" [ref=e1004]:
                                      - img "Image" [ref=e1006]
                                  - heading "31. Build a tiny vision-language adapter" [level=2] [ref=e1008]:
                                    - generic [ref=e1010]: 31. Build a tiny vision-language adapter
                                  - generic [ref=e1013]: Modern LLMs increasingly consume text, images, audio, video, and structured tool outputs. CLIP showed the power of contrastive image-text pretraining. Flamingo connected frozen vision and language models for few-shot multimodal learning. LLaVA demonstrated visual instruction tuning by connecting a vision encoder to an LLM. By 2026, systems such as Llama 4 and Kimi K2.6 emphasize native multimodality rather than treating vision as a side feature.
                                  - 'heading "Part XX: Interpretability And Failure Modes" [level=1] [ref=e1015]':
                                    - generic [ref=e1017]: "Part XX: Interpretability And Failure Modes"
                                  - link "Image" [ref=e1024] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058745128076926977
                                    - generic "Image" [ref=e1028]:
                                      - img "Image" [ref=e1030]
                                  - heading "32. Study circuits, probes, and sparse autoencoders" [level=2] [ref=e1032]:
                                    - generic [ref=e1034]: 32. Study circuits, probes, and sparse autoencoders
                                  - generic [ref=e1037]: Mechanistic interpretability tries to understand what models compute internally. Transformer-circuits work decomposed attention and MLP behavior into more interpretable components. Anthropic's sparse-autoencoder work showed that learned features can be more interpretable than individual neurons and can sometimes isolate concepts across large models.
                                  - heading "33. Build a red-team and safety evaluation suite" [level=2] [ref=e1039]:
                                    - generic [ref=e1041]: 33. Build a red-team and safety evaluation suite
                                  - generic [ref=e1044]: As models become more capable, safety evaluation becomes part of engineering. Constitutional AI explored using a written set of principles plus AI feedback to reduce reliance on direct human labels. Red-teaming research has shown how manual and automated adversarial attacks can uncover harmful behaviors. Broader AI safety reports synthesize risks across misuse, malfunction, systemic impacts, and loss of control.
                                  - 'heading "Part XXI: The Final Capstone Builds A Complete Small LLM System" [level=1] [ref=e1046]':
                                    - generic [ref=e1048]: "Part XXI: The Final Capstone Builds A Complete Small LLM System"
                                  - link "Image" [ref=e1055] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058745210885038080
                                    - generic "Image" [ref=e1059]:
                                      - img "Image" [ref=e1061]
                                  - heading "34. Train, tune, quantize, serve, evaluate, and document one model" [level=2] [ref=e1063]:
                                    - generic [ref=e1065]: 34. Train, tune, quantize, serve, evaluate, and document one model
                                  - generic [ref=e1068]: Your final project should connect the entire stack.
                                  - heading "A realistic lock-in plan" [level=1] [ref=e1070]:
                                    - generic [ref=e1072]: A realistic lock-in plan
                                  - generic [ref=e1075]: A few weeks is enough to change your instincts. A few months is enough to build a serious foundation.
                                  - generic [ref=e1078]: "Weeks 1-2: Representations and attention"
                                  - generic [ref=e1081]: Build the tokenizer, embeddings, positional encodings, attention, masking, multi-head attention, and a one-block Transformer.
                                  - generic [ref=e1084]: "Weeks 3-4: Training and objectives"
                                  - generic [ref=e1087]: Train a mini-former, compare objectives, build sampling tools, study normalization and activations, and run your first ablations.
                                  - generic [ref=e1090]: "Weeks 5-6: Inference systems"
                                  - generic [ref=e1093]: Implement KV cache, MQA/GQA, speculative decoding, quantization, and serving benchmarks.
                                  - generic [ref=e1096]: "Weeks 7-8: Long context, MoE, and data"
                                  - generic [ref=e1099]: Build sliding-window attention, context-extension tests, a toy MoE, and a real data pipeline.
                                  - generic [ref=e1102]: "Weeks 9-10: Post-training and evaluation"
                                  - generic [ref=e1105]: Run SFT, LoRA/QLoRA, DPO, toy RL, benchmark harnesses, and safety evals.
                                  - generic [ref=e1108]: "Weeks 11-12: Capstone"
                                  - generic [ref=e1111]: Train or fine-tune one small model, quantize it, serve it, add RAG/tools, evaluate it, red-team it, and publish the full write-up.
                                  - generic [ref=e1114]: "The exact schedule matters less than the loop: Build, plot, break, explain."
                                  - heading "What to publish after every project" [level=1] [ref=e1116]:
                                    - generic [ref=e1118]: What to publish after every project
                                  - generic [ref=e1121]: "For each project, produce five artifacts:"
                                  - list [ref=e1122]:
                                    - listitem [ref=e1123]:
                                      - generic [ref=e1124]:
                                        - generic [ref=e1125]: "Implementation:"
                                        - generic [ref=e1126]: clean code with tests.
                                    - listitem [ref=e1127]:
                                      - generic [ref=e1128]:
                                        - generic [ref=e1129]: "Notebook:"
                                        - generic [ref=e1130]: one reproducible experiment.
                                    - listitem [ref=e1131]:
                                      - generic [ref=e1132]:
                                        - generic [ref=e1133]: "Plots:"
                                        - generic [ref=e1134]: at least three charts showing behavior.
                                    - listitem [ref=e1135]:
                                      - generic [ref=e1136]:
                                        - generic [ref=e1137]: "Failure gallery:"
                                        - generic [ref=e1138]: examples where the system breaks.
                                    - listitem [ref=e1139]:
                                      - generic [ref=e1140]:
                                        - generic [ref=e1141]: "Short write-up:"
                                        - generic [ref=e1142]: what you learned and what changed your mind.
                                  - generic [ref=e1145]: Do not just post "I implemented attention." Post the heatmaps. Post the mask bug. Post the entropy curve. Post the latency chart. Post the weird repetition loop. Post the expert-routing collapse. Post the quantization regression. Post the safety failure you did not expect.
                                  - generic [ref=e1148]: That is how fundamentals compound.
                                  - heading "The mindset" [level=1] [ref=e1150]:
                                    - generic [ref=e1152]: The mindset
                                  - generic [ref=e1155]: Do not get stuck in theory forever. But also do not mistake demos for understanding.
                                  - generic [ref=e1158]: An agent framework can hide the model. A serving framework can hide the cache. A benchmark can hide leakage. A product can hide the failure modes. A wrapper can hide the fact that the model is doing all the work.
                                  - generic [ref=e1161]: Fundamentals remove the hiding places.
                                  - generic [ref=e1164]: Learn tokenization. Learn embeddings. Learn position. Learn attention. Learn residual streams. Learn normalization. Learn objectives. Learn sampling. Learn KV cache. Learn long context. Learn MoE. Learn quantization. Learn data. Learn scaling. Learn post-training. Learn serving. Learn evaluation. Learn safety. Learn failure modes.
                                  - generic [ref=e1167]: Then build agents. Build products. Build companies. Build labs.
                                  - generic [ref=e1170]: But build them on bedrock.
                                  - generic [ref=e1173]: Your future self will thank you.
                                  - generic [ref=e1176]: Until next time.
