                                    - generic [ref=e453]: "Part I: Text Becomes Tensors"
                                  - link "Image" [ref=e460] [cursor=pointer]:
                                    - /url: /TheAhmadOsman/article/2058745340895870985/media/2058743781537538048
                                    - generic "Image" [ref=e464]:
