# ============================================================================
# DRAFT PROPOSAL — Phase 1 of INFRA-SYNERGY-RESEARCH-2026-06-25 (slot:bravo)
# Single TLS-terminating reverse proxy in front of the PRISM Docker stack.
#
# NOT wired into the default compose. Deploy EXPLICITLY (reversible — just stop
# the service / drop the overlay to revert; no app code changes):
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d nginx
#
# Solves P5 (one secure ingress: TLS + rate-limit + cache + LB) from the research.
# Upstreams use compose SERVICE NAMES (resolved on prism-net), verified against
# docker-compose.yml: prism-server:3000, grafana:3000.
# Ollama/Qdrant/Postgres/Prometheus are deliberately NOT exposed here.
# ============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
  # ── logging (compact, request-time included) ──
  log_format prism '$remote_addr $status "$request" ${request_time}s ua="$http_user_agent"';
  access_log /var/log/nginx/access.log prism;

  # ── compression ──
  gzip on;
  gzip_types application/json application/javascript text/css text/plain;
  gzip_min_length 512;

  # ── rate-limit zones (P5) — cost-bearing endpoints get a tighter bucket ──
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=quote_sfc:10m  rate=3r/s;
  limit_req_status 429;

  # ── upstreams (compose service names on prism-net) ──
  upstream prism_api     { server prism-server:3000; keepalive 32; }
  upstream prism_grafana { server grafana:3000; }

  # HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    # TLS — operator provides certs at deploy/nginx/certs (mounted read-only).
    # Local-dev self-signed:
    #   openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj "/CN=prism.local" \
    #     -keyout deploy/nginx/certs/prism.key -out deploy/nginx/certs/prism.crt
    ssl_certificate     /etc/nginx/certs/prism.crt;
    ssl_certificate_key /etc/nginx/certs/prism.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── security headers ──
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── shared proxy settings (inherited by all locations) ──
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 120s;

    client_max_body_size 25m;   # drawing/PDF uploads route through here

    # health passthrough (never rate-limited)
    location = /health { proxy_pass http://prism_api; }

    # cost-bearing quote/SFC endpoints — tighter bucket
    location ~ ^/api/v1/(quotes|sfc) {
      limit_req zone=quote_sfc burst=10 nodelay;
      proxy_pass http://prism_api;
    }

    # general API
    location /api/ {
      limit_req zone=public_api burst=20 nodelay;
      proxy_pass http://prism_api;
    }

    # Grafana dashboards (consider an auth layer in front before public exposure)
    location /grafana/ { proxy_pass http://prism_grafana/; }

    # NOTE: Ollama (:11434), Qdrant (:6333), Postgres (:5432), Prometheus (:9090)
    # are intentionally NOT proxied — internal-only services on prism-net.
  }
}
