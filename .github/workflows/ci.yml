name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          FAIL_COUNT=0
          find . -name '*.json' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './archives/*' \
            -not -path './state/externalized/*' \
            -not -path './state/inference-logs/*' \
            -not -path './state/ralph_loops/*' \
            -not -path '*/node_modules/*' \
            -not -path './.claude-flow/*' \
            -not -path './.swarm/*' \
            -not -path './logs/*' \
            | while read f; do
            if python3 -c "import json; json.load(open('$f', encoding='utf-8-sig'))" 2>/dev/null; then
              echo "  OK: $f"
            else
              echo "  FAIL: $f"
              exit 1
            fi
          done
          echo "All JSON files valid."

      - name: Lint shell scripts with shellcheck
        run: |
          if command -v shellcheck &>/dev/null; then
            echo "shellcheck found"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          shopt -s globstar nullglob
          scripts=(.claude/**/*.sh SCRIPTS/*.sh mcp-server/**/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found, skipping."
          else
            shellcheck --severity=error "${scripts[@]}" && echo "shellcheck passed."
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Lint Python (syntax check)
        run: |
          pip install flake8 --quiet
          shopt -s globstar nullglob
          pyfiles=(SCRIPTS/*.py)
          if [ ${#pyfiles[@]} -eq 0 ]; then
            echo "No Python files found, skipping."
          else
            flake8 --select=E9,F63,F7,F82 "${pyfiles[@]}" && echo "Python syntax OK."
          fi

      - name: Compile-check Python files
        run: |
          shopt -s globstar nullglob
          pyfiles=(SCRIPTS/*.py)
          if [ ${#pyfiles[@]} -eq 0 ]; then
            echo "No Python files found, skipping."
          else
            for f in "${pyfiles[@]}"; do
              python3 -m py_compile "$f" && echo "  OK: $f"
            done
          fi

      - name: Run verify_features (if exists)
        run: |
          if [ -f "SCRIPTS/verify_features.py" ] && [ -d "_BUILD" ]; then
            python3 SCRIPTS/verify_features.py _BUILD/
          else
            echo "verify_features.py or _BUILD/ not found, skipping."
          fi

      - name: Rebuild and verify PROJECT_INDEX.json
        run: |
          if [ -f "SCRIPTS/rebuild_project_index.py" ]; then
            python3 SCRIPTS/rebuild_project_index.py
            python3 -c "import json; idx=json.load(open('PROJECT_INDEX.json')); assert '_meta' in idx and 'extraction' in idx; print('PROJECT_INDEX.json valid.')"
          fi

      - name: Run extraction validation
        run: |
          if [ -f "SCRIPTS/validate_extractions.py" ]; then
            python3 SCRIPTS/validate_extractions.py || echo "Validation completed with warnings."
          fi

      - name: Run test suite
        run: |
          if [ -d "tests" ]; then
            python3 -m pytest tests/ -v --tb=short 2>/dev/null || python3 -m unittest discover tests -v
          else
            echo "No tests directory found, skipping."
          fi

      - name: Run CAD engine tests (pytest)
        run: |
          if [ -d "cad-engine" ]; then
            pip install cadquery build123d pytest pytest-cov --quiet 2>/dev/null || echo "CAD deps install skipped (platform may not support OCP)."
            if python3 -c "import cadquery" 2>/dev/null; then
              python3 -m pytest cad-engine/tests/ -v --tb=short
            else
              echo "CadQuery not importable — skipping CAD engine tests."
            fi
          fi

  # TypeScript build and test job for mcp-server
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=16384'

      - name: Run Vitest tests
        run: npx vitest run --cache

      - name: Test legitimacy gate (block new fake/placeholder tests)
        # CI is the only test-integrity gate that env flags (PRISM_ALLOW_*)
        # cannot bypass. Scans only test files CHANGED vs the base ref, so the
        # pre-existing legacy violators are reported as advisory, not failing.
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.base_ref || 'main' }}" || true
          node "$GITHUB_WORKSPACE/scripts/ci-test-legitimacy-scan.mjs" --base "origin/${{ github.base_ref || 'main' }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-dist
          path: mcp-server/dist/
          retention-days: 7

  # Test coverage job
  test-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: mcp-server/coverage/
          retention-days: 30

      - name: Coverage summary
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.json | head -50 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # Bundle size tracking
  bundle-size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build:fast

      - name: Check bundle size
        run: npx size-limit

      - name: Bundle size summary
        run: |
          echo "### Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "dist/index.js" ]; then
            SIZE=$(stat -c%s "dist/index.js" 2>/dev/null || stat -f%z "dist/index.js" 2>/dev/null)
            SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
            echo "| Bundle | Size |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
            echo "| dist/index.js | ${SIZE_MB} MB |" >> $GITHUB_STEP_SUMMARY
          fi

  # Dependency security audit
  security-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "### Dependency Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Run audit and capture output
          npm audit --audit-level=moderate 2>&1 | tee audit-output.txt || true

          # Check for critical/high vulnerabilities
          if npm audit --audit-level=high 2>/dev/null; then
            echo "No high or critical vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          else
            echo "Vulnerabilities detected. Review audit-output.txt for details." >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -100 audit-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Fail on high/critical vulnerabilities in production dependencies
            npm audit --audit-level=high --omit=dev
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: mcp-server/audit-output.txt
          retention-days: 30

  # Docker Scout — paid-tier base-image CVE scan for the PRISM runtime image.
  # Non-blocking by design: surfaces vulnerabilities as PR comments / job summary
  # without failing the build. Requires DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
  # secrets configured in repo settings; the job is a no-op if either is missing.
  docker-scout:
    name: Docker Scout (base-image CVEs)
    runs-on: ubuntu-latest
    needs: build-and-test
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if Docker Hub credentials are missing
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "have_creds=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials not configured — skipping Scout scan." >> $GITHUB_STEP_SUMMARY
          else
            echo "have_creds=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.creds.outputs.have_creds == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.have_creds == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build PRISM image (local, not pushed)
        if: steps.creds.outputs.have_creds == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: prism:scout-scan

      - name: Scan image with Docker Scout
        if: steps.creds.outputs.have_creds == 'true'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: prism:scout-scan
          only-severities: critical,high
          sarif-file: scout-results.sarif
          summary: true
          write-comment: ${{ github.event_name == 'pull_request' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        if: steps.creds.outputs.have_creds == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-scout-sarif
          path: scout-results.sarif
          retention-days: 30
