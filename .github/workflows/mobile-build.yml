name: Mobile Build (Capacitor)

# Builds the PRISM mobile apps from the SAME Vite bundle the web + Electron
# shells use (one build, three form factors). The app lives at mcp-server/web;
# Vite writes the SPA to mcp-server/dist/web (capacitor.config.json webDir
# "../dist/web"), then `cap sync` copies it into the android/ + ios/ scaffolds.
#
# Android builds on a Linux runner (free); iOS requires a macOS runner (Xcode).
# Both produce DEBUG/unsigned artifacts -- a signed release needs the operator's
# keystore (Android) / Apple signing identity + provisioning profile (iOS),
# which are not committed. Mirrors ci.yml's mcp-server-rooted convention
# (checkout@v6, setup-node@v4 with npm cache), scoped to mcp-server/web.
#
# Backend URL: the mobile bundle has NO same-origin backend (it loads over
# capacitor://localhost). Set the VITE_API_BASE_URL repo/environment secret to
# a device-reachable backend before a real-device build, or the app fails loud
# at runtime (see src/lib/apiBase.ts). CI builds without it produce a bundle
# that runs but cannot reach the backend -- intended for build verification only.

on:
  push:
    branches: [main, slot/quebec-ios-ci]
    paths:
      - 'mcp-server/web/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp-server/web/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch: {}

env:
  NODE_VERSION: '20'

jobs:
  android:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server/web
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mcp-server/web/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (-> ../dist/web)
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Point the bundle at a device-reachable backend if the secret is set;
          # absent -> apiBase resolver falls back + warns (build still succeeds).
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # The android/ native project is gitignored (Capacitor regenerates it --
      # see mcp-server/web/.gitignore). A fresh checkout has no android/ dir, and
      # `cap sync` only copies the bundle into an EXISTING scaffold; it never
      # creates one. So scaffold first (idempotent: no-op if present), then sync.
      - name: Capacitor add + sync (web -> android scaffold)
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Gradle assembleDebug
        working-directory: mcp-server/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prism-android-debug-apk
          path: mcp-server/web/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    name: iOS simulator app (unsigned)
    runs-on: macos-15
    defaults:
      run:
        working-directory: mcp-server/web
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mcp-server/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          pod --version

      - name: Build web bundle (-> ../dist/web)
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # The ios/ native project is gitignored and regenerated by Capacitor. The
      # shared script syncs assets, normalizes Podfile paths after junctioned
      # Windows worktrees, installs Pods on macOS, and builds without signing.
      - name: Capacitor sync + Xcode simulator build
        run: npm run ios:build:sim -- --no-web-build

      - name: Upload simulator .app (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: prism-ios-simulator-app-unsigned
          path: mcp-server/web/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14
          if-no-files-found: error
