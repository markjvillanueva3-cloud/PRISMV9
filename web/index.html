<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PRISM v9 — CNC Manufacturing Intelligence Platform. Speed & feed calculations, tool selection, machine validation, and process optimization." />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>P</text></svg>" />
    <title>PRISM v9 — Manufacturing Intelligence</title>
    <!--
      U-F7-REACT-SCAN-DEV-OVERLAY (slot:quebec /goal-loop) — live render-waste overlay.
      Loads ONLY on dev hostnames (localhost / 127.0.0.1 / 0.0.0.0 / *.local).
      Production hostnames never match, so the script never reaches users.
      Spec: state/shared/specs/FRONTEND-PLAN-EXTENSION-2026-05-25.md §9.3 + table.
    -->
    <script>
      (function () {
        var h = location.hostname;
        if (h === "localhost" || h === "127.0.0.1" || h === "0.0.0.0" || /\.local$/.test(h)) {
          var s = document.createElement("script");
          s.src = "//unpkg.com/react-scan/dist/auto.global.js";
          s.crossOrigin = "";
          s.defer = true;
          document.head.appendChild(s);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;text-align:center">PRISM requires JavaScript to run. Please enable JavaScript in your browser.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
