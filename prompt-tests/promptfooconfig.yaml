# PRISM Prompt Regression Tests
# Run: promptfoo eval
# View: promptfoo view
#
# Tests two core LLM prompts:
#   1. CADQUERY_CODEGEN_PROMPT - NL description -> CadQuery Python code
#   2. CAD_SYSTEM_PROMPT - tutorial transcript -> structured JSON features
#
# Source prompts: C:/PRISM/cad-engine/src/prompts/cad_prompts.py

description: "PRISM CAD Prompt Regression Tests"

prompts:
  - id: cadquery-codegen
    label: "CadQuery Code Generation"
    raw: "file://prompts/cadquery_codegen.txt"
  - id: cad-extraction
    label: "CAD Feature Extraction"
    raw: "file://prompts/cad_extraction.txt"

providers:
  - id: openai:gpt-4o-mini
    label: gpt-4o-mini
    config:
      temperature: 0
  # Uncomment to also test against Claude:
  # - id: anthropic:messages:claude-sonnet-4-20250514
  #   label: claude-sonnet
  #   config:
  #     temperature: 0

# Separate test suites per prompt
tests:
  # --- CadQuery code generation tests ---
  - description: "Codegen: box with hole"
    vars:
      input: "Make a box 50mm x 30mm x 10mm with a hole of diameter 8mm through the top"
    options:
      prompts: [cadquery-codegen]
    assert:
      - type: contains
        value: "import cadquery as cq"
      - type: contains
        value: "result"
      - type: icontains
        value: "extrude"
      - type: icontains
        value: "hole"
      - type: javascript
        value: "!output.includes('show_object') && !output.includes('show(') && !output.includes('display(')"
      - type: not-contains
        value: "```"

  - description: "Codegen: simple cylinder"
    vars:
      input: "Create a cylinder with radius 25mm and height 40mm"
    options:
      prompts: [cadquery-codegen]
    assert:
      - type: contains
        value: "import cadquery as cq"
      - type: contains
        value: "result"
      - type: icontains
        value: "circle"
      - type: icontains
        value: "extrude"
      - type: not-contains
        value: "```"

  - description: "Codegen: spur gear via cq_gears"
    vars:
      input: "Spur gear with module 2, 20 teeth, and 10mm face width"
    options:
      prompts: [cadquery-codegen]
    assert:
      - type: contains
        value: "import cadquery as cq"
      - type: contains
        value: "result"
      - type: icontains
        value: "cq_gears"
      - type: icontains
        value: "SpurGear"
      - type: not-contains
        value: "```"

  - description: "Codegen: flanged cylinder"
    vars:
      input: "Make a flanged cylinder: base flange 40mm diameter, 5mm thick, then a 20mm diameter cylinder 30mm tall on top, with a 6mm through hole"
    options:
      prompts: [cadquery-codegen]
    assert:
      - type: contains
        value: "import cadquery as cq"
      - type: contains
        value: "result"
      - type: icontains
        value: "circle"
      - type: icontains
        value: "extrude"
      - type: icontains
        value: "hole"
      - type: not-contains
        value: "```"

  - description: "Codegen: L-bracket with fillets"
    vars:
      input: "L-bracket: 40x60mm base plate 5mm thick, with a 10mm wide vertical wall 30mm tall rising from the center, all edges filleted at 3mm radius"
    options:
      prompts: [cadquery-codegen]
    assert:
      - type: contains
        value: "import cadquery as cq"
      - type: contains
        value: "result"
      - type: icontains
        value: "rect"
      - type: icontains
        value: "fillet"
      - type: not-contains
        value: "```"

  - description: "Codegen: bevel gear via cq_gears"
    vars:
      input: "Bevel gear with module 3, 25 teeth, cone angle 45 degrees, face width 15mm"
    options:
      prompts: [cadquery-codegen]
    assert:
      - type: contains
        value: "import cadquery as cq"
      - type: contains
        value: "result"
      - type: icontains
        value: "cq_gears"
      - type: icontains
        value: "BevelGear"
      - type: not-contains
        value: "```"

  - description: "Codegen: washer (ring shape)"
    vars:
      input: "A simple washer: outer diameter 20mm, inner diameter 10mm, thickness 2mm"
    options:
      prompts: [cadquery-codegen]
    assert:
      - type: contains
        value: "import cadquery as cq"
      - type: contains
        value: "result"
      - type: icontains
        value: "circle"
      - type: not-contains
        value: "```"

  - description: "Codegen: rectangular tube"
    vars:
      input: "Rectangular tube: 50mm x 30mm outer, 3mm wall thickness, 100mm long"
    options:
      prompts: [cadquery-codegen]
    assert:
      - type: contains
        value: "import cadquery as cq"
      - type: contains
        value: "result"
      - type: icontains
        value: "rect"
      - type: icontains
        value: "extrude"
      - type: not-contains
        value: "```"

  # --- CAD extraction tests ---
  - description: "Extraction: base plate with hole"
    vars:
      input: >
        OK so first we're going to create a sketch on the XY plane. Draw a rectangle
        100mm by 60mm. Then we'll extrude that up 20mm to make our base plate.
        Now select the top face, and we'll add a through hole, 12mm diameter,
        right in the center. That hole is for our mounting bolt.
    options:
      prompts: [cad-extraction]
    assert:
      - type: is-json
      - type: javascript
        value: "JSON.parse(output).features !== undefined"
      - type: javascript
        value: "JSON.parse(output).features.length >= 3"
      - type: icontains
        value: "extrude"
      - type: icontains
        value: "hole"
      - type: contains
        value: "cad-001"

  - description: "Extraction: gear housing with shell and pattern"
    vars:
      input: >
        In this tutorial I'll show you how to make a simple gear housing.
        Start with a cylinder, 80mm diameter, 50mm tall. We revolve a circle
        of radius 40mm around the Y axis. Then we shell it out to 3mm wall
        thickness. Finally add 4 mounting holes on a 60mm bolt circle,
        each hole is M6, so 6.5mm clearance diameter.
    options:
      prompts: [cad-extraction]
    assert:
      - type: is-json
      - type: javascript
        value: "JSON.parse(output).features.length >= 4"
      - type: icontains
        value: "shell"
      - type: icontains
        value: "hole"
      - type: javascript
        value: "JSON.parse(output).design_intent_summary !== undefined"

  - description: "Extraction: fillet and chamfer with design intent"
    vars:
      input: >
        Let me show you filleting in SolidWorks. We have our block here,
        40x40x40mm cube. Select these four vertical edges - I'll apply a
        5mm fillet to all of them. Then on the top edges, let's do a 2mm
        chamfer instead. The reason for the fillet on the verticals is
        stress concentration - sharp corners crack under load.
    options:
      prompts: [cad-extraction]
    assert:
      - type: is-json
      - type: javascript
        value: "JSON.parse(output).features.length >= 3"
      - type: icontains
        value: "fillet"
      - type: icontains
        value: "chamfer"
      - type: javascript
        value: "let f = JSON.parse(output).features; f.some(x => x.feature_type === 'fillet' || x.feature_type === 'chamfer')"

  - description: "Extraction: phone stand multi-feature"
    vars:
      input: >
        Today we're building a phone stand. Start with a base, 80mm wide,
        60mm deep, 5mm thick plate. Extrude a back wall from the rear edge,
        5mm thick, 100mm tall, angled back 10 degrees. We add a 15mm fillet
        where the wall meets the base for strength. Then cut a slot in the
        base, 70mm x 3mm, 15mm from the front edge - that's where the phone
        sits. The design intent is a sturdy stand that works for any phone up
        to 8mm thick.
    options:
      prompts: [cad-extraction]
    assert:
      - type: is-json
      - type: javascript
        value: "JSON.parse(output).features.length >= 4"
      - type: icontains
        value: "extrude"
      - type: javascript
        value: "JSON.parse(output).design_intent_summary && JSON.parse(output).design_intent_summary.length > 10"

  - description: "Extraction: loft between profiles"
    vars:
      input: >
        Now I'll demonstrate a loft operation in Fusion 360. On the bottom
        plane, sketch a 50mm square. Move up 40mm and sketch a 30mm circle.
        Select both profiles and loft between them. Use the ruled option
        for straighter sides. This creates a transition piece from square
        ductwork to a round pipe.
    options:
      prompts: [cad-extraction]
    assert:
      - type: is-json
      - type: javascript
        value: "JSON.parse(output).features.length >= 3"
      - type: icontains
        value: "loft"
      - type: javascript
        value: "JSON.parse(output).modeling_approach !== undefined"

  - description: "Extraction: sheet metal bracket"
    vars:
      input: >
        We need to create a sheet metal bracket. Start with a base flange
        100mm x 50mm from 1.5mm thick steel. Add an edge flange on the long
        side, 25mm tall, bent at 90 degrees with a 2mm bend radius.
        Mirror that flange to the other side. Then add two 8mm holes
        centered 15mm from each end of the base for mounting.
    options:
      prompts: [cad-extraction]
    assert:
      - type: is-json
      - type: javascript
        value: "JSON.parse(output).features.length >= 4"
      - type: javascript
        value: "let f = JSON.parse(output).features; f.some(x => x.feature_type === 'sheet_metal' || x.feature_type === 'mirror' || x.feature_type === 'hole')"

  - description: "Extraction: simple dowel pin"
    vars:
      input: >
        Here's a quick one - just a simple dowel pin. Create a circle 8mm
        diameter on the XY plane, extrude it 30mm. Add a 0.5mm chamfer
        on both ends for easy insertion. That's it - tolerance is h6.
    options:
      prompts: [cad-extraction]
    assert:
      - type: is-json
      - type: javascript
        value: "JSON.parse(output).features.length >= 2"
      - type: icontains
        value: "extrude"
      - type: javascript
        value: "let f = JSON.parse(output).features; f.some(x => x.feature_type === 'chamfer')"
      - type: contains
        value: "cad-001"
